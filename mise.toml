[tools]
python = "3.15.2"
uv = "0.13.7"
shellcheck = "0.11.0"
actionlint = "1.7.12"

[tasks.lint]
description = "Lint Python, shell, YAML, and Actions"
run = [
  "uv run ruff check scripts/ stacks/ tests/ && uv run ruff format --check scripts/ stacks/ tests/",
  "shellcheck scripts/*.sh ci-runner/*.sh ci-runner/net/*.sh ci-runner/tests/*.sh ci-runner/rootfs/ci-boot ci-runner/rootfs/ci-memwatch .github/actions/fc-cache/*.sh",
  "uv run yamllint -c .yamllint.yaml stacks/ .github/workflows/ .github/actions/",
  "actionlint",
]

[tasks.format]
description = "Format Python"
run = "uv run ruff format scripts/ stacks/ tests/"

[tasks.typecheck]
description = "Type-check Python"
run = "uv run ty check scripts/tailscale_policy.py scripts/deploy.py scripts/generate_env.py scripts/pc_backup.py scripts/runner_job_guard.py scripts/ci_supervisor.py scripts/public_stats_key.py scripts/pin_only.py scripts/versions_hash.py scripts/adr_frozen.py scripts/ssd_wear.py scripts/security_facts.py scripts/docs_size.py stacks/observability/public_stats.py stacks/observability/prometheus/replay.py stacks/observability/grafana/users.py"

[tasks.test]
description = "Run unit tests"
run = "uv run python -m pytest tests/ -q"

[tasks."validate:compose"]
description = "Validate Compose without changing local secrets"
run = "scripts/validate-compose.sh"

[tasks."docs:size"]
description = "Fail when a doc grows past docs-size.json"
run = "uv run python -m scripts.docs_size"

[tasks.check]
description = "Run CI checks"
depends = ["lint", "typecheck", "test", "docs:size", "validate:compose"]

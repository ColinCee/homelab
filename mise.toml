[tools]
python = "3.15.1"
uv = "0.13.4"
shellcheck = "0.11.0"
actionlint = "1.7.12"
trivy = "0.76.0"

[tasks.lint]
description = "Lint Python, shell, YAML, and Actions"
run = [
  "uv run ruff check scripts/ tests/ && uv run ruff format --check scripts/ tests/",
  "shellcheck scripts/*.sh ci-runner/*.sh ci-runner/net/*.sh ci-runner/tests/*.sh ci-runner/rootfs/ci-boot",
  "uv run yamllint -c .yamllint.yaml stacks/ .github/workflows/",
  "actionlint",
]

[tasks.format]
description = "Format Python"
run = "uv run ruff format scripts/ tests/"

[tasks.typecheck]
description = "Type-check Python"
run = "uv run ty check scripts/tailscale_policy.py scripts/deploy.py scripts/generate_env.py scripts/deploy_watchdog.py scripts/pc_backup.py scripts/runner_job_guard.py scripts/ci_supervisor.py"

[tasks.test]
description = "Run unit tests"
run = "uv run python -m pytest tests/ -q"

[tasks."validate:compose"]
description = "Validate Compose without changing local secrets"
run = "scripts/validate-compose.sh"

[tasks.ci]
description = "Run CI checks"
depends = ["lint", "typecheck", "test", "validate:compose"]

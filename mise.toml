[tools]
python = "3.14.4"
uv = "0.11.3"
shellcheck = "0.11.0"
actionlint = "1.7.12"
trivy = "0.69.3"

[tasks.lint]
description = "Lint Python, shell, YAML, and Actions"
run = [
  "cd stacks/knowledge/app && uv run ruff check . && uv run ruff format --check .",
  "shellcheck scripts/*.sh .githooks/pre-commit",
  "uv run yamllint -c .yamllint.yaml stacks/ .github/workflows/",
  "actionlint",
]

[tasks.format]
description = "Format Python"
run = "cd stacks/knowledge/app && uv run ruff format ."

[tasks.typecheck]
description = "Type-check Python"
run = "cd stacks/knowledge/app && uv run ty check ."

[tasks.test]
description = "Run unit tests"
run = "cd stacks/knowledge/app && uv run pytest tests/ -q --ignore=tests/integration"

[tasks."test:integration"]
description = "Run integration tests against live Postgres"
run = "cd stacks/knowledge/app && RUN_INTEGRATION_TESTS=1 uv run pytest tests/integration/ -q"

[tasks."validate:compose"]
description = "Validate Compose without changing local secrets"
run = "scripts/validate-compose.sh"

[tasks.ci]
description = "Run CI checks"
depends = ["lint", "typecheck", "test", "validate:compose"]

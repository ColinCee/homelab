[tools]
python = "3.14.7"
uv = "0.12.9"
shellcheck = "0.11.0"
actionlint = "1.7.12"
trivy = "0.74.0"

[tasks.lint]
description = "Lint Python, shell, YAML, and Actions"
run = [
  "uv run ruff check scripts/ tests/ stacks/knowledge/operations.py stacks/knowledge/tests/ && uv run ruff format --check scripts/ tests/ stacks/knowledge/operations.py stacks/knowledge/tests/",
  "cd stacks/knowledge/app && uv run ruff check . && uv run ruff format --check .",
  "shellcheck scripts/*.sh",
  "uv run yamllint -c .yamllint.yaml stacks/ .github/workflows/",
  "actionlint",
]

[tasks.format]
description = "Format Python"
run = [
  "uv run ruff format scripts/ tests/ stacks/knowledge/operations.py stacks/knowledge/tests/",
  "cd stacks/knowledge/app && uv run ruff format .",
]

[tasks.typecheck]
description = "Type-check Python"
run = [
  "uv run ty check scripts/tailscale_policy.py scripts/deploy.py scripts/generate_env.py stacks/knowledge/operations.py",
  "cd stacks/knowledge/app && uv run ty check .",
]

[tasks.test]
description = "Run unit tests"
run = [
  "uv run python -m pytest tests/ stacks/knowledge/tests/ -q",
  "cd stacks/knowledge/app && uv run python -m pytest tests/ -q --ignore=tests/integration",
]

[tasks."test:integration"]
description = "Run integration tests against live Postgres"
run = "cd stacks/knowledge/app && RUN_INTEGRATION_TESTS=1 uv run python -m pytest tests/integration/ -q"

[tasks."validate:compose"]
description = "Validate Compose without changing local secrets"
run = "scripts/validate-compose.sh"

[tasks.ci]
description = "Run CI checks"
depends = ["lint", "typecheck", "test", "validate:compose"]

[tools]
python = "3.15.2"
uv = "0.13.7"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.32.0"
# promtool, alloy and caddy for the tests, at the versions compose.yaml runs (tests/test_observability_compose.py).
"aqua:prometheus/prometheus" = "3.16.0"
"aqua:grafana/alloy" = "1.21.3"
"aqua:caddyserver/caddy" = "2.11.9"

[tasks.lint]
description = "Lint Python, shell, YAML, and Actions"
run = [
  "uv run ruff check scripts/ ci-runner/ stacks/ tests/ .github/actions/ && uv run ruff format --check scripts/ ci-runner/ stacks/ tests/ .github/actions/",
  "shellcheck scripts/*.sh ci-runner/*.sh ci-runner/net/*.sh ci-runner/tests/*.sh ci-runner/rootfs/ci-boot ci-runner/rootfs/ci-memwatch ci-runner/rootfs/runner-job-guard-vm.sh",
  "uv run yamllint -c .yamllint.yaml stacks/ .github/workflows/ .github/actions/",
  "actionlint",
  # GitHub Actions' security practices (pinned actions, no persisted token, no template injection), from files alone.
  "zizmor --offline --min-severity low .github/",
]

[tasks.format]
description = "Format Python"
run = "uv run ruff format scripts/ ci-runner/ stacks/ tests/ .github/actions/"

[tasks.typecheck]
description = "Type-check Python"
run = "uv run ty check scripts/tailscale_policy.py scripts/deploy.py scripts/render_secrets.py scripts/pc_backup.py scripts/runner_job_guard.py scripts/ci_supervisor.py scripts/ci_times.py scripts/ci.py .github/actions/fc-cache/fc_cache.py scripts/public_stats_key.py scripts/pin_only.py scripts/versions_hash.py scripts/ssd_wear.py scripts/security_facts.py scripts/docs_size.py ci-runner/install_host.py ci-runner/update.py stacks/observability/public_stats.py stacks/observability/prometheus/replay.py stacks/observability/grafana/users.py"

[tasks.test]
description = "Run unit tests"
# The slowest tests in every run, so a slow one shows where it starts.
run = "uv run python -m pytest tests/ -q --durations=8 -n auto --dist loadfile"

[tasks."validate:compose"]
description = "Validate Compose without changing local secrets"
run = "scripts/validate-compose.sh"

[tasks."docs:size"]
description = "Fail when a doc grows past docs-size.json"
run = "uv run python -m scripts.docs_size"

[tasks.check]
description = "Run CI checks"
depends = ["lint", "typecheck", "test", "docs:size", "validate:compose"]

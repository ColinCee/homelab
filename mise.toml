[tools]
python = "3.15.2"
uv = "0.13.7"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.32.0"
# promtool, alloy and caddy for the tests, at the versions compose.yaml runs (stacks/observability/observability_compose_test.py).
"aqua:prometheus/prometheus" = "3.16.0"
"aqua:grafana/alloy" = "1.21.3"
"aqua:caddyserver/caddy" = "2.11.9"

[tasks.lint]
description = "Lint Python, YAML, and Actions (shell scripts: checks/shell_scripts_test.py)"
run = [
  "uv run ruff check && uv run ruff format --check",
  "uv run yamllint -c .yamllint.yaml stacks/ .github/workflows/ .github/actions/",
  "actionlint",
  # GitHub Actions' security practices (pinned actions, no persisted token, no template injection), from files alone.
  "zizmor --offline --min-severity low .github/",
]

[tasks.format]
description = "Format Python"
run = "uv run ruff format"

[tasks.typecheck]
description = "Type-check Python"
run = "uv run ty check --python-platform linux"

[tasks.test]
description = "Run unit tests"
# The slowest tests in every run, so a slow one shows where it starts.
run = "uv run python -m checks.test_shards --durations=8"

[tasks."validate:compose"]
description = "Validate Compose without changing local secrets"
run = "uv run python -m checks.validate_compose"

[tasks."docs:size"]
description = "Fail when a doc grows past docs-size.json"
run = "uv run python -m checks.docs_size"

[tasks.check]
description = "Run CI checks"
depends = ["lint", "typecheck", "test", "docs:size", "validate:compose"]

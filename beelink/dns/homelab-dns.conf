# /etc/systemd/resolved.conf.d/homelab-dns.conf, installed by ci-runner/install_host.py.
# About 1 in 4,000 UDP DNS packets via the router is lost. resolved re-sends only after 5 s, and
# Docker's resolver, which containers ask, gives up after 4 s, so one loss fails a lookup. resolved
# asks the router and the first global server at the same time and takes the first answer; the
# second global server stands in when the first stops answering.
[Resolve]
DNS=1.1.1.1 9.9.9.9

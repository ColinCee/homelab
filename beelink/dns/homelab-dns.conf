# /etc/systemd/resolved.conf.d/homelab-dns.conf, installed by ci-runner/install_host.py.
# About 1 in 4,000 UDP DNS packets via the router is lost. resolved re-sends only after 5 s, and
# Docker's resolver, which containers ask, gives up after 4 s, so one loss fails a lookup. Global
# servers beside the router's are asked at the same time, and the first answer wins.
[Resolve]
DNS=1.1.1.1 9.9.9.9

# Beelink: /etc/systemd/system/docker.service.d/socket-users.conf, installed by ci-runner/install_host.py.
# The reason is in socket_users.py. `-` and the timeout: a failed or stuck restart must not fail Docker's start.
[Service]
ExecStartPost=-/usr/bin/timeout 60 /usr/local/bin/homelab-python3 -Es /usr/local/lib/homelab-ci/socket_users.py

[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
# Docker cannot publish our private ports until the tailnet address exists.
ExecStartPre=/usr/bin/timeout 90 /bin/sh -c 'until /usr/sbin/ip -4 address show dev tailscale0 2>/dev/null | /usr/bin/grep -Fq "inet 100.100.146.119/32"; do /usr/bin/sleep 1; done'
TimeoutStartSec=120

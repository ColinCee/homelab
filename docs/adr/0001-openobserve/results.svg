<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, sans-serif" font-size="13">
  <style>
    text { fill: #2c2c2a; } .muted { fill: #6b6a64; } .grid { stroke: #e1e0d9; }
    .oo { fill: #2a78d6; } .gt { fill: #eb6834; } .vm { fill: #888780; } .today { fill: #5f5e5a; }
    @media (prefers-color-scheme: dark) { text { fill: #f0efec; } .muted { fill: #a9a8a1; } .grid { stroke: #383835; } }
  </style>
  <text x="20" y="26" font-size="16" font-weight="500">Memory at the real rate, busiest 3 hours (MiB, 3 rounds)</text>
  <text x="20" y="44" class="muted">The decision rule's measure: whole setups, lowest to highest round. Bars start at 600.</text>
  <g transform="translate(190,60)">
    <line class="grid" x1="0" y1="0" x2="0" y2="104"/>
    <rect class="oo" x="0" y="4" width="151" height="18" rx="3"/><text x="-8" y="17" text-anchor="end">OpenObserve *</text><text x="157" y="17">724-751</text>
    <rect class="gt" x="0" y="30" width="155" height="18" rx="3"/><text x="-8" y="43" text-anchor="end">GreptimeDB + Grafana</text><text x="161" y="43">723-755</text>
    <rect class="vm" x="0" y="56" width="141" height="18" rx="3"/><text x="-8" y="69" text-anchor="end">Victoria + Grafana</text><text x="147" y="69">731-741</text>
    <rect class="today" x="0" y="82" width="84" height="18" rx="3"/><text x="-8" y="95" text-anchor="end">Today's setup</text><text x="90" y="95">684 (one round, estimated)</text>
  </g>
  <text x="20" y="196" font-size="16" font-weight="500">Screen at 24x, busiest hour (MiB)</text>
  <text x="20" y="214" class="muted">Cut the field; fast replay favours stores that buffer less, so it decided nothing between finalists.</text>
  <g transform="translate(190,226)" font-size="12">
    <text x="-8" y="12" text-anchor="end">Today / Victoria</text><text x="0" y="12">~715 / 720</text>
    <text x="-8" y="30" text-anchor="end">GreptimeDB</text><text x="0" y="30">862</text>
    <text x="-8" y="48" text-anchor="end">OpenObserve *</text><text x="0" y="48">1080</text>
    <text x="230" y="12">SigNoz * 1048, no alert in 120 s</text>
    <text x="230" y="30">ClickStack 1281</text>
    <text x="230" y="48">Grafana stack + Tempo 1339-1492, 10/14 right; Parseable 2379</text>
  </g>
  <text x="20" y="320" font-size="16" font-weight="500">Finalists' safety tests</text>
  <g transform="translate(20,336)">
    <text x="0" y="14" class="muted">Memory, 6 days stored (MiB, one run)</text>
    <rect class="oo" x="0" y="24" width="123" height="18" rx="3"/><text x="129" y="38">613</text>
    <rect class="gt" x="0" y="48" width="189" height="18" rx="3"/><text x="195" y="62">945</text>
  </g>
  <g transform="translate(260,336)">
    <text x="0" y="14" class="muted">Disk for 30 days (GB, limit 100)</text>
    <rect class="oo" x="0" y="24" width="96" height="18" rx="3"/><text x="102" y="38">24</text>
    <rect class="gt" x="0" y="48" width="40" height="18" rx="3"/><text x="46" y="62">10</text>
  </g>
  <g transform="translate(500,336)">
    <text x="0" y="14" class="muted">Back after a kill (seconds)</text>
    <rect class="oo" x="0" y="24" width="110" height="18" rx="3"/><text x="116" y="38">17-22</text>
    <rect class="gt" x="0" y="48" width="29" height="18" rx="3"/><text x="35" y="62">6</text>
  </g>
  <g transform="translate(20,440)">
    <rect class="oo" x="0" y="0" width="12" height="12" rx="2"/><text x="18" y="11">OpenObserve</text>
    <rect class="gt" x="120" y="0" width="12" height="12" rx="2"/><text x="138" y="11">GreptimeDB + Grafana</text>
    <text x="0" y="36" class="muted">* Ran without the homelab collector's data (a login fault), about 10 metric points and 1 log a second.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#57606a;stroke-width:1.2}
      .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
      .out{fill:#fff8c5;stroke:#9a6700;stroke-width:1.2}
      .t{font-size:14px;font-weight:600;fill:#1f2328;text-anchor:middle}
      .s{font-size:12px;fill:#57606a;text-anchor:middle}
      .l{font-size:12px;fill:#1f2328}
      .arrow{fill:none;stroke:#24292f;stroke-width:1.4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="610" fill="#ffffff"/>

  <!-- Who and what comes in -->
  <rect class="ext" x="20" y="20" width="260" height="70" rx="8"/>
  <text class="t" x="150" y="46">GitHub</text>
  <text class="s" x="150" y="64">PR, CI (Colin's in the VMs), merge</text>
  <text class="s" x="150" y="80">a merge rings the Beelink</text>

  <rect class="ext" x="350" y="20" width="260" height="70" rx="8"/>
  <text class="t" x="480" y="46">Colin's devices</text>
  <text class="s" x="480" y="64">over Tailscale only</text>

  <rect class="ext" x="680" y="20" width="260" height="70" rx="8"/>
  <text class="t" x="810" y="46">Public internet</text>
  <text class="s" x="810" y="64">no inbound connections</text>

  <!-- The Beelink -->
  <rect x="20" y="120" width="920" height="360" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text class="l" x="924" y="140" text-anchor="end" font-weight="600">Beelink: Ubuntu, Docker</text>

  <rect class="box" x="40" y="160" width="200" height="70" rx="6"/>
  <text class="t" x="140" y="184">deploy</text>
  <text class="s" x="140" y="202">on a ring, fetches main and</text>
  <text class="s" x="140" y="218">applies the changed stacks</text>

  <rect class="box" x="40" y="260" width="200" height="90" rx="6"/>
  <text class="t" x="140" y="284">CI runner</text>
  <text class="s" x="140" y="302">private repos' jobs</text>
  <text class="s" x="140" y="318">one Firecracker VM per job</text>
  <text class="s" x="140" y="334">internet only, no home network</text>

  <text class="l" x="40" y="392">Bridge containers reach the</text>
  <text class="l" x="40" y="408">internet and each other, not the</text>
  <text class="l" x="40" y="424">host, LAN or tailnet</text>

  <rect x="270" y="160" width="650" height="300" rx="8" fill="none" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text class="l" x="904" y="452" text-anchor="end" fill="#57606a">Compose stacks, stacks/&lt;name&gt;/</text>

  <rect class="box" x="290" y="190" width="140" height="50" rx="6"/>
  <text class="t" x="360" y="211">home-assistant</text>
  <text class="s" x="360" y="228">host network</text>

  <rect class="box" x="445" y="190" width="150" height="50" rx="6"/>
  <text class="t" x="520" y="211">internal-names</text>
  <text class="s" x="520" y="228">.internal DNS and proxy</text>

  <rect class="box" x="610" y="190" width="135" height="50" rx="6"/>
  <text class="t" x="677" y="211">tunnel</text>
  <text class="s" x="677" y="228">cloudflared</text>

  <rect class="box" x="760" y="190" width="145" height="50" rx="6"/>
  <text class="t" x="832" y="211">flight-tracker</text>
  <text class="s" x="832" y="228">public API</text>

  <rect class="box" x="290" y="270" width="140" height="50" rx="6"/>
  <text class="t" x="360" y="291">backup</text>
  <text class="s" x="360" y="308">restic, nightly</text>

  <rect x="450" y="260" width="455" height="165" rx="6" fill="#fff" stroke="#57606a" stroke-width="1.2"/>
  <text class="l" x="465" y="280" font-weight="600">observability</text>
  <rect class="box" x="465" y="300" width="80" height="44" rx="5"/>
  <text class="t" x="505" y="327">Alloy</text>
  <rect class="box" x="565" y="290" width="150" height="28" rx="5"/>
  <text class="s" x="640" y="309" fill="#1f2328">Prometheus and rules</text>
  <rect class="box" x="565" y="326" width="150" height="28" rx="5"/>
  <text class="s" x="640" y="345" fill="#1f2328">VictoriaLogs, Traces</text>
  <rect class="box" x="735" y="290" width="70" height="28" rx="5"/>
  <text class="s" x="770" y="309" fill="#1f2328">Grafana</text>
  <rect class="box" x="815" y="290" width="75" height="28" rx="5"/>
  <text class="s" x="852" y="309" fill="#1f2328">gateway</text>
  <rect class="box" x="735" y="326" width="155" height="28" rx="5"/>
  <text class="s" x="812" y="345" fill="#1f2328">Alertmanager</text>
  <rect class="box" x="505" y="380" width="110" height="28" rx="5"/>
  <text class="s" x="560" y="399" fill="#1f2328">public-stats</text>

  <!-- Where things go -->
  <rect class="out" x="270" y="520" width="180" height="70" rx="8"/>
  <text class="t" x="360" y="548">Cloudflare R2</text>
  <text class="s" x="360" y="566">encrypted backups</text>

  <rect class="out" x="470" y="520" width="180" height="70" rx="8"/>
  <text class="t" x="560" y="548">colincheung.dev</text>
  <text class="s" x="560" y="566">signed public stats</text>

  <rect class="out" x="690" y="520" width="110" height="70" rx="8"/>
  <text class="t" x="745" y="548">Discord</text>
  <text class="s" x="745" y="566">#uptime</text>

  <rect class="out" x="810" y="520" width="130" height="70" rx="8"/>
  <text class="t" x="875" y="548">Healthchecks.io</text>
  <text class="s" x="875" y="566">emails if pings stop</text>

  <!-- Arrows -->
  <path class="arrow" d="M140,158 V92"/>
  <text class="l" x="148" y="110">fetches main</text>
  <path class="arrow" d="M640,188 V150 H200 V158"/>
  <text class="l" x="400" y="144">ring</text>
  <path class="arrow" d="M30,90 V305 H38"/>
  <path class="arrow" d="M240,215 H288"/>
  <path class="arrow" d="M520,90 V188"/>
  <text class="l" x="528" y="110">admin pages</text>
  <path class="arrow" d="M710,90 V188"/>
  <text class="l" x="718" y="110">Cloudflare Tunnel</text>
  <path class="arrow" d="M745,215 H758"/>
  <path class="arrow" d="M545,305 H563"/>
  <path class="arrow" d="M545,340 H563"/>
  <path class="arrow" d="M360,320 V518"/>
  <path class="arrow" d="M560,408 V518"/>
  <path class="arrow" d="M745,354 V518"/>
  <path class="arrow" d="M875,354 V518"/>
</svg>

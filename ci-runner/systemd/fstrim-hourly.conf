# Ubuntu trims weekly. Each VM writes its disk into a throwaway file deleted when it ends,
# about 0.5 TB a day, so within days the SSD takes most of its free blocks as in use and
# slows every write (6 Nov: 360 GiB untrimmed after 4 days, writes waiting 90-260 ms). Hourly keeps it told.
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=1min
RandomizedDelaySec=0

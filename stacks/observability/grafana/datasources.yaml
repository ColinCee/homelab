# Grafana reads every store through the gateway (../gateway/Caddyfile), never directly: its data source proxy lets a
# Viewer's GET through to any path of a store, and every store serves writes or admin calls beside its reads.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://gateway:5080/prometheus
    isDefault: true
    basicAuth: true
    basicAuthUser: agents@homelab.internal
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/agents_password}
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.16.0
      timeInterval: 15s
      manageAlerts: true
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://gateway:5080/alertmanager
    basicAuth: true
    basicAuthUser: agents@homelab.internal
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/agents_password}
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
  # VictoriaLogs' plugin is in Grafana's image (../grafana.Dockerfile).
  - name: Logs
    uid: logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://gateway:5080/logs
    basicAuth: true
    basicAuthUser: agents@homelab.internal
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/agents_password}
    editable: false
    jsonData:
      # A line's trace opens in the trace store. `$$` keeps provisioning from expanding Grafana's own variable.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: $${__value.raw}
          datasourceUid: traces
          urlDisplayLabel: View trace
  # VictoriaTraces with Jaeger's data source, as its maker recommends:
  # https://docs.victoriametrics.com/victoriatraces/querying/grafana/
  - name: Traces
    uid: traces
    type: jaeger
    access: proxy
    url: http://gateway:5080/traces/select/jaeger
    basicAuth: true
    basicAuthUser: agents@homelab.internal
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/agents_password}
    editable: false
    # A span opens its lines in the log store and its service's request rate, errors and duration in Prometheus, whose
    # `job` is the span's `service.name`.
    jsonData:
      tracesToLogsV2:
        datasourceUid: logs
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: trace_id:="$${__trace.traceId}"
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -30m
        spanEndTimeShift: 30m
        tags:
          - key: service.name
            value: job
        queries:
          - name: Requests a second
            query: sum(rate(http_server_request_duration_seconds_count{$$__tags}[5m]))
          - name: Server errors a second
            query: sum(rate(http_server_request_duration_seconds_count{$$__tags, http_response_status_code=~"5.."}[5m]))
          - name: 95th percentile duration
            query: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{$$__tags}[5m])))
  # The same store's spans as rows, through its LogsQL paths: sums across traces, which Jaeger's paths cannot give.
  - name: Spans
    uid: spans
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://gateway:5080/traces
    basicAuth: true
    basicAuthUser: agents@homelab.internal
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/agents_password}
    editable: false

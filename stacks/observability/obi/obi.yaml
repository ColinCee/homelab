# What OBI (../compose.yaml, obi) instruments: the programs in the containers the lab's stacks start, each named after
# its Compose service. Both come from Docker's API: a host program or a CI VM has no container, so it matches no
# `container_name`, and with no Docker API nothing matches. OBI matches a container by its name alone, so a container
# an agent runs to test something must not be named for a stack, as Alloy keeps only the stacks' (config.alloy,
# discovery.relabel "compose"): Compose names each `<stack>-<service>-<n>`, or its container_name, and a
# `compose run` `<stack>-<service>-run-<id>`. alloy_test.py holds both to the stacks.
# https://opentelemetry.io/docs/zero-code/obi/configure/service-discovery/
discovery:
  instrument:
    - container_name: "{backup,deploy,flight-tracker,home-assistant,internal-names,observability,tunnel}-*"
    - container_name: "{backup,homeassistant}"
  # The telemetry's own path: every send Alloy makes would be a span, which it would then send, and the socket proxy
  # answers Alloy's polls many times a second.
  exclude_instrument:
    - container_name: "observability-{alloy,prometheus,logs,traces,docker-socket-proxy}-*"
    - container_name: "*-run-*"
  # Go programs get the tracer every program gets: Go's own also turns on the OpenTelemetry calls built into a program,
  # so a busy one, such as promtool testing the rules, sends about 10,000 spans a second. For the rest, it adds detail
  # inside one program (Grafana's SQLite queries) at about 1.8 times the spans and 80 MiB, and none for Go 1.26+, for
  # which OBI v1.0.0 has no runtime ABI.
  skip_go_specific_tracers: true
ebpf:
  # Half the default map sizes halves the kernel memory its maps take (about 330 to 170 MiB); one host's traffic needs
  # no more.
  maps_config:
    global_scale_factor: -1
  # Each request-serving service's lines written while it answers get the request's trace: a JSON line gains
  # `trace_id` and `span_id` fields, which Alloy reads out (config.alloy, loki.process "docker") and Grafana opens as
  # the trace. OBI zeroes each line the program writes and writes it again
  # with the IDs, so the log keeps a line of NULs in its place, which Alloy drops. A line OBI takes as it stops is lost.
  # Home Assistant and CoreDNS are left out: their lines are text with no request in them. So is Caddy (the gateway,
  # the .internal proxy): its error lines, written while it answers, got no IDs.
  # https://opentelemetry.io/docs/zero-code/obi/trace-log-correlation/
  log_enricher:
    services:
      - service:
          - container_name: "flight-tracker-backend-*"
          - container_name: "observability-{grafana,alertmanager,blackbox,incidents}-*"
          - container_name: "tunnel-cloudflared-*"
          - container_name: "deploy-doorbell-*"

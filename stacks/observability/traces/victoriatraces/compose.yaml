# The trace store when TRACE_STORE=victoriatraces (../../.env.example); ../../compose.yaml runs it as `traces`. Flags:
# https://docs.victoriametrics.com/victoriatraces/#list-of-command-line-flags
services:
  traces:
    image: victoriametrics/victoria-traces:v0.13.0@sha256:3018df8f99429d7d3029167ab9f70848bf0a778c31c49dff16c86c7e34759fbd
    command:
      - -storageDataPath=/vtraces
      # The default is 7 days.
      - -retentionPeriod=30d
    # It held at most 106 MiB at ten times the real span rate.
    mem_limit: 512m
    volumes:
      - victoriatraces-data:/vtraces

volumes:
  victoriatraces-data:

# From the maker's single-binary example (example/docker-compose/single-binary/tempo.yaml at v3.1.1), keeping 30
# days: https://grafana.com/docs/tempo/latest/configuration/
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
backend_worker:
  compaction:
    block_retention: 720h
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 720h
usage_report:
  reporting_enabled: false

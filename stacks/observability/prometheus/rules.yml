# The alert rules, held to the alert standard in docs/architecture.md ("Monitoring and alerts"). Prometheus runs them each
# minute and sends the firing ones to Alertmanager (../alertmanager), which repeats, holds back and sends them on to the
# incidents relay (../incidents/relay.py) for #incidents.
#
# Each post shows `measure: value unit`, so a query gives display units, rounded. A rule that is not per series
# takes `max` or `min` of its query, so its post carries no labels: the title prints every label but `alertname`
# and `level`. A per-series rule keeps only the labels that tell its series apart (`max by (name)`): one post per
# series. Only metrics written outside Alloy carry a no-data arm, `or on() max(absent_over_time(...)) * -1`, shown as
# "no data"; "Beelink metrics stopped" covers Alloy's own, and a job that may not have run yet has none for never
# having run, as its missing file is not a fault. `keep_firing_for` is the 10-minute hold: a return inside
# it is the same alert. A no-data arm fires once its window has passed and then the rule's `for`.
# Tests: tests/test_alert_rules.py, which runs them with promtool.

groups:
  - name: homelab
    interval: 1m
    rules:
      - alert: beelink-metrics-stopped
        expr: |
          (
            max(
              absent_over_time(up{job="integrations/unix"}[5m]) or absent_over_time(up{job="docker"}[5m])
            )
          ) > 0
        for: 0m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Beelink metrics stopped'
          measure: 'Missing for'
          unit: ' 5 min or more'
          harm: >-
            No alert can see the Beelink while its numbers are missing, so the alerts that read them are held
            back. A real outage could be going on unseen.
          action: >-
            On the Beelink, check `docker ps -a --filter name=observability-` and `docker logs --tail 50
            observability-alloy-1`, then `docker compose up -d` in
            /home/colin/code/homelab/stacks/observability.
          dashboard: &home http://grafana.internal/d/home
          value: '{{ $value }}'
      - alert: flight-tracker-down
        expr: |
          (
            max(probe_success{job="integrations/blackbox/flight-tracker"})
          ) < 1
        for: 10m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Flight Tracker site down'
          measure: 'Live aircraft check passing (1 yes, 0 no)'
          unit: ''
          harm: >-
            https://api.colincheung.dev/aircraft is not serving live aircraft, so the public radar is blank or
            stale.
          action: >-
            Check `docker logs --tail 50 flight-tracker-backend-1` (upstream 403 or 429?) and `docker logs
            --tail 50 tunnel-cloudflared-1`.
          dashboard: *home
          value: '{{ $value }}'
      # `up` too, so a stopped blackbox reads as down rather than as nothing.
      - alert: site-down
        expr: |
          (
            min by (site) (
              probe_success{job="integrations/blackbox/sites"} or up{job="integrations/blackbox/sites"}
            )
          ) < 1
        for: 10m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Public site down'
          measure: 'Answering with 200 (1 yes, 0 no)'
          unit: ''
          harm: 'Visitors to this public site get an error or nothing at all.'
          action: >-
            Open the site, then its latest deployment in the Cloudflare dashboard, which serves it. If it opens,
            the check itself failed: `docker logs --tail 50 observability-blackbox-1`.
          dashboard: *home
          value: '{{ $value }}'
      - alert: home-assistant-down
        expr: |
          (
            max(homelab_probe_success{target="home-assistant"})
            * (time() - max(homelab_probe_timestamp_seconds) < bool 300)
          ) < 1
          or on() max(absent_over_time(homelab_probe_success{target="home-assistant"}[15m])) * -1
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Home Assistant down'
          measure: 'Answering (1 yes, 0 no)'
          unit: ''
          harm: 'The house''s automations and its app stop working.'
          action: >-
            Check `docker ps -a --filter name=homeassistant` and `docker logs --tail 50 homeassistant`; restart
            it with `docker restart homeassistant`. If it is up, the check itself stopped: `docker logs
            observability-probes-1`.
          dashboard: *home
          value: '{{ $value }}'
      - alert: dns-or-names-down
        expr: |
          (
            min(homelab_probe_success{target=~"names-(dns|proxy)"})
            * (time() - max(homelab_probe_timestamp_seconds) < bool 300)
          ) < 1
          or on() max(absent_over_time(homelab_probe_success{target="names-dns"}[15m])) * -1
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'DNS or .internal names down'
          measure: 'Both checks passing (1 yes, 0 no)'
          unit: ''
          harm: 'home.internal, grafana.internal and the other .internal names stop opening on every device.'
          action: >-
            Check `docker ps -a --filter name=internal-names` and `docker logs --tail 50 internal-names-dns-1`
            and `internal-names-proxy-1`. If both are up, the check itself stopped: `docker logs
            observability-probes-1`.
          dashboard: *home
          value: '{{ $value }}'
      - alert: high-ram
        expr: |
          (
            max(
              round(100 * (1 - node_memory_MemAvailable_bytes{job="integrations/unix"}
              / node_memory_MemTotal_bytes{job="integrations/unix"}))
            )
          ) > 90
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Beelink running out of memory'
          measure: 'Memory use'
          unit: '%'
          harm: 'Past this the kernel kills processes, and any container may be the one stopped.'
          action: >-
            Find the container that grew with `docker stats --no-stream`, then restart it or give it a
            `mem_limit` in its compose.yaml.
          dashboard: *home
          value: '{{ $value }}'
      - alert: restart-loop
        expr: |
          (
            max by (name) (changes(container_start_time_seconds{job="docker",name!=""}[30m]))
          ) > 2
        for: 10m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'A container keeps restarting'
          measure: 'Starts in the last 30 min'
          unit: ''
          harm: 'The service in this container is down most of the time.'
          action: 'Read why it stops with `docker logs --tail 100 <name>`, fix the cause, and redeploy its stack.'
          dashboard: *home
          value: '{{ $value }}'
      # 0 is unhealthy or still starting, which no stack's start period keeps up for 10 minutes; -1 has no check.
      - alert: container-unhealthy
        expr: |
          (
            max by (name) (container_health_state{job="docker",name!=""})
          ) == 0
        for: 10m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'A container is unhealthy'
          measure: 'Health check passing (1 yes, 0 no)'
          unit: ''
          harm: 'Its own health check fails, so the service in this container is likely not working.'
          action: >-
            Read the failing check's output under State.Health in `docker inspect <name>`, and `docker logs --tail
            100 <name>`; fix the cause and redeploy its stack.
          dashboard: *home
          value: '{{ $value }}'
      # A service the last deploy started to keep running (scripts/deploy.py, record_running) with no running
      # container, which cAdvisor stops reporting once it exits, cleanly or not. One-shots are not on the list.
      - alert: container-stopped
        expr: |
          (
            max by (project, service) (homelab_container_expected) * 0
            unless on (project, service)
              label_replace(
                label_replace(
                  container_last_seen{job="docker",container_label_com_docker_compose_oneoff="False"},
                  "project", "$1", "container_label_com_docker_compose_project", "(.+)"
                ),
                "service", "$1", "container_label_com_docker_compose_service", "(.+)"
              )
          )
        for: 10m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'A service stopped'
          measure: 'Running (1 yes, 0 no)'
          unit: ''
          harm: 'Its container has exited and is not coming back, so whatever it serves is down.'
          action: >-
            Read why it stopped with `docker ps -a --filter label=com.docker.compose.service=<service>` and `docker
            logs --tail 100` on it, then `docker compose up -d` in its stack. If you removed the stack for good,
            delete /var/lib/homelab-metrics/deploy-<stack>.prom.
          dashboard: *home
          value: '{{ $value }}'
      # The supervisor rewrites ci-waits.prom every 15 seconds while its loop runs, polls failing or not.
      - alert: ci-supervisor-stopped
        expr: |
          (
            round((time() - max(last_over_time(node_textfile_mtime_seconds{file=~".*/ci-waits.prom"}[30m]))) / 60)
          ) > 10
          or on() max(absent_over_time(node_textfile_mtime_seconds{file=~".*/ci-waits.prom"}[30m])) * -1
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'CI supervisor stopped'
          measure: 'Last update'
          unit: ' min ago'
          harm: 'No CI machine starts, so private repositories'' checks wait and nothing of theirs merges.'
          action: >-
            Read `sudo journalctl -u homelab-ci-supervisor -n 100` on the Beelink, fix the cause, then `sudo
            systemctl restart homelab-ci-supervisor`; see docs/architecture.md, "CI runner".
          dashboard: *home
          value: '{{ $value }}'
      - alert: new-container
        expr: |
          (
            count by (name) (container_last_seen{job="docker",name!=""})
            unless count by (name) (container_last_seen{job="docker",name!="",container_label_com_docker_compose_project!=""})
            unless count by (name) (max_over_time(container_last_seen{job="docker",name!=""}[7d] offset 1h))
          ) > 0
        for: 15m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Unknown container started'
          measure: 'Containers of this name'
          unit: ''
          harm: >-
            Something started a container outside the reviewed deploy path; if it was not you, someone else can
            run code here.
          action: >-
            Expected if you ran one by hand. Otherwise check `docker ps -a --filter name=<name>` and `docker
            inspect` its image and command, then stop it.
          dashboard: *home
          value: '{{ $value }}'
      - alert: backup-missed
        expr: |
          (
            round((time() - max(homelab_backup_last_success_timestamp_seconds)) / 3600)
          ) > 26
          or on() max(absent_over_time(homelab_backup_last_success_timestamp_seconds[15m])) * -1
        for: 30m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Nightly backup didn''t run'
          measure: 'Last good backup'
          unit: ' h ago'
          harm: 'Without a nightly copy in R2, a lost disk loses everything since the last good backup.'
          action: 'Check `docker logs --tail 100 backup`; see docs/architecture.md, "Backups".'
          dashboard: *home
          value: '{{ $value }}'
      # Sundays' backup reads every pack back (backup.py, DEEP_CHECK_DAY), so over 8.5 days is a missed week. Its
      # file stays on the host between checks, so no data is a lost file, not a check yet to run.
      - alert: deep-check-missed
        expr: |
          (
            round((time() - max(homelab_backup_last_deep_check_timestamp_seconds)) / 86400)
          ) > 8
          or on() max(absent_over_time(homelab_backup_last_deep_check_timestamp_seconds[15m])) * -1
        for: 30m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Weekly backup check didn''t pass'
          measure: 'Last full check'
          unit: ' days ago'
          harm: 'Damaged data in R2 goes unseen until a restore needs it.'
          action: >-
            Run the check now with `docker exec -e DEEP_CHECK=1 backup python3 -I /backup.py once` and read why
            it fails in its output; a deploy since Sunday has wiped that run's log.
          dashboard: *home
          value: '{{ $value }}'
      - alert: pc-backup-stale
        expr: |
          (
            round((time() - max(homelab_pc_backup_newest_timestamp_seconds)) / 3600)
          ) > 50
          or on() max(absent_over_time(homelab_pc_backup_newest_timestamp_seconds[15m])) * -1
        for: 30m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'PC backup stopped arriving'
          measure: 'Newest PC backup'
          unit: ' h old'
          harm: 'The Windows PC''s files are no longer copied off it, so a dead PC disk loses them.'
          action: >-
            Check the PC's "Homelab PC backup" task and `~/.pc-backup.json` there, then `systemctl --user status
            backup-pc-receive` on the Beelink; see docs/architecture.md, "Backups".
          dashboard: *home
          value: '{{ $value }}'
      # The last run failed. A failure with no good run before it shows as no data; no run at all is upkeep-missed.
      - alert: upkeep-failed
        expr: |
          (
            round((time() - max(homelab_upkeep_last_success_timestamp_seconds)) / 86400)
            and on() max(homelab_upkeep_last_failure_timestamp_seconds)
              > on() max(homelab_upkeep_last_success_timestamp_seconds)
          )
          or on() (
            max(homelab_upkeep_last_failure_timestamp_seconds) * 0 - 1
            unless on() max(homelab_upkeep_last_success_timestamp_seconds)
          )
        for: 1h
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Monthly upkeep failed'
          measure: 'Last good upkeep'
          unit: ' days ago'
          harm: >-
            Either a file could not be restored from the latest backup, so a restore may fail when needed, or unused
            Docker images are filling the disk.
          action: >-
            Read `journalctl --user -u backup-upkeep` on the Beelink, fix the failing step, then `systemctl --user
            start backup-upkeep`; see docs/architecture.md, "Backups".
          dashboard: *home
          value: '{{ $value }}'
      # Due on the 1st at 05:00 (backup-upkeep.timer), so no run, good or not, in the 3 days since the last due time.
      # The timer's systemd stamp (scripts/deploy.py, record_running) is when it was first enabled if it never fired,
      # so a timer installed after a due time waits for the next one, and one that never fires still alerts. The due
      # time is 05:00 on the 1st of the month of 3 days and 5 hours ago (277200 s), so it moves on 3 days after each.
      - alert: upkeep-missed
        expr: |
          (
            round((time() - max({
              __name__=~"homelab_upkeep_last_(success|failure)_timestamp_seconds|homelab_timer_last_trigger_timestamp_seconds",
              timer=~"|backup-upkeep"
            })
              > on() time() - (
                time() - 277200 - (time() - 277200) % 86400 - (day_of_month(vector(time() - 277200)) - 1) * 86400
                + 18000
              )
            ) / 86400)
          )
          or on() max(absent_over_time(homelab_timer_last_trigger_timestamp_seconds{timer="backup-upkeep"}[1h])) * -1
        for: 1h
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Monthly upkeep didn''t run'
          measure: 'Last run, or install if none'
          unit: ' days ago'
          harm: >-
            Without it no restore is tested, so a backup that cannot be restored goes unseen, and unused Docker
            images fill the disk.
          action: >-
            Check `systemctl --user list-timers backup-upkeep.timer` on the Beelink and enable it if missing, then
            `systemctl --user start backup-upkeep`; see docs/architecture.md, "Backups".
          dashboard: *home
          value: '{{ $value }}'
      - alert: high-disk
        expr: |
          (
            max(
              round(100 * (1 - node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
              / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"}))
            )
          ) > 80
        for: 10m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Beelink disk filling up'
          measure: 'Disk use'
          unit: '%'
          harm: >-
            A full disk stops every stack writing: Prometheus, the logs, the backups and Home Assistant's
            history.
          action: >-
            Find what grew with `docker system df` and `sudo du -xh --max-depth=2 / | sort -h | tail`; prune
            images or old data, never Docker volumes.
          dashboard: *home
          value: '{{ $value }}'
      - alert: backup-storage-high
        expr: |
          (
            round(max(last_over_time(homelab_backup_repository_bytes[26h])) / 1e9, 0.1)
          ) > 5
          or on() max(absent_over_time(homelab_backup_repository_bytes[26h])) * -1
        for: 5m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Backup storage nearly full'
          measure: 'Backup storage'
          unit: ' GB'
          harm: 'Uploads stop at 8 GB, so backups stop; R2 bills past 10 GB.'
          action: 'Find what grew with `docker exec backup restic stats`; see docs/architecture.md, "Backups".'
          dashboard: *home
          value: '{{ $value }}'
      - alert: ssd-worn
        expr: |
          (
            max(homelab_ssd_percentage_used)
          ) > 80
        for: 1h
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Beelink SSD wearing out'
          measure: 'Endurance used'
          unit: '%'
          harm: 'Past 100% of its rated writes the SSD may start failing, and everything on the Beelink is on it.'
          action: >-
            Order a replacement SSD and plan the move. To see how fast it wears, chart
            `homelab_ssd_written_bytes_total`.
          dashboard: *home
          value: '{{ $value }}'
      - alert: ssd-wear-stale
        expr: |
          (
            round((time() - max(last_over_time(node_textfile_mtime_seconds{file=~".*/ssd.prom"}[30m]))) / 60)
          ) > 60
          or on() max(absent_over_time(node_textfile_mtime_seconds{file=~".*/ssd.prom"}[30m])) * -1
        for: 5m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'SSD wear check stopped'
          measure: 'Last check'
          unit: ' min ago'
          harm: 'A wearing SSD would go unnoticed.'
          action: >-
            Check `systemctl status homelab-ssd-wear.service` and `systemctl list-timers homelab-ssd-wear.timer`
            on the Beelink; it starts with `sudo ci-runner/install-host.sh`.
          dashboard: *home
          value: '{{ $value }}'
      # The latest main run's seconds (scripts/ci_times.py), median over a day against its 14 days: half again and
      # 20 s more, so a GitHub runner's few seconds either way never fire it. Per runner kind, whose speeds differ.
      # The value holds until the next run, so one slow run before a quiet night counts for hours: `for` is 6 h.
      - alert: ci-slower
        expr: |
          (
            round(max by (workflow, ci_job, runner) (
              quantile_over_time(0.5, homelab_ci_job_seconds{kind="main"}[1d])
            ))
          )
          > 1.5 * max by (workflow, ci_job, runner) (quantile_over_time(0.5, homelab_ci_job_seconds{kind="main"}[14d]))
          and
          max by (workflow, ci_job, runner) (quantile_over_time(0.5, homelab_ci_job_seconds{kind="main"}[1d]))
          > 20 + max by (workflow, ci_job, runner) (quantile_over_time(0.5, homelab_ci_job_seconds{kind="main"}[14d]))
        for: 6h
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'CI on main got slower'
          measure: 'Median today'
          unit: ' s'
          harm: 'Every merge waits longer for its checks or its deploy, and slow runs hide a fault.'
          action: >-
            On Grafana's CI page (http://grafana.internal/d/ci), open a slow run's timeline from Recent runs and
            compare its steps and slowest tests with one from last week.
          dashboard: *home
          value: '{{ $value }}'
      - alert: ci-times-stale
        expr: |
          (
            round((time() - max(last_over_time(node_textfile_mtime_seconds{file=~".*/ci-times.prom"}[30m]))) / 60)
          ) > 30
          or on() max(absent_over_time(node_textfile_mtime_seconds{file=~".*/ci-times.prom"}[30m])) * -1
        # Past a new install's first write, at most 5 minutes in.
        for: 15m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'CI run times stopped'
          measure: 'Last record'
          unit: ' min ago'
          harm: 'A slower CI or deploy would go unnoticed, and no run is traced.'
          action: >-
            Check `systemctl status homelab-ci-times.service` and `journalctl -u homelab-ci-times` on the Beelink;
            it starts with `sudo ci-runner/install-host.sh`.
          dashboard: *home
          value: '{{ $value }}'
      # deploy-main writes both on every run, at least every 15 minutes (stacks/deploy/deploy_main.py).
      - alert: main-not-deployed
        expr: |
          max(homelab_main_deploy_behind) > 0
          or on() round((time() - max(last_over_time(homelab_main_deploy_checked_timestamp_seconds[2h]))) / 60) > 60
          or on() max(absent_over_time(homelab_main_deploy_checked_timestamp_seconds[2h])) * -1
        for: 30m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Main not deployed'
          measure: 'Behind (1), minutes since the deployer last ran, or no record (-1)'
          unit: ''
          harm: 'A merged fix or update is not running on the Beelink, and later merges wait behind it.'
          action: >-
            Run `journalctl --user -u deploy-main -n 50` on the Beelink: a failed stack names itself. "refused" means
            main no longer contains the deployed commit; if you rewrote main, write its commit to
            `~/.local/state/homelab/last-deployed`. Retry with `systemctl --user start deploy-main`.
          dashboard: *home
          value: '{{ $value }}'
      # unattended-upgrades installs security updates each morning (beelink/auto-updates/52unattended-upgrades-local), so some waiting
      # at every check for 3 days means it is failing. Written each minute (beelink/security/security_facts.py, host); the
      # offset keeps a series younger than the window quiet.
      - alert: security-updates-waiting
        expr: |
          (
            min(min_over_time(homelab_security_updates_pending[3d]))
            and on() max(homelab_security_updates_pending offset 3d)
          ) > 0
          or on() max(absent_over_time(homelab_security_updates_pending[15m])) * -1
        for: 1h
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Security updates not installing'
          measure: 'Waiting for 3 days or more'
          unit: ' updates'
          harm: 'Known holes in the Beelink''s software stay open to anything that reaches it.'
          action: >-
            Read `sudo tail -50 /var/log/unattended-upgrades/unattended-upgrades.log` on the Beelink and `apt list
            --upgradable`, fix what stops it, then `sudo unattended-upgrade -v`.
          dashboard: *home
          value: '{{ $value }}'
      # It reboots at 04:00 the day after an update needs it (beelink/auto-updates/52unattended-upgrades-local), so 2 days is a missed
      # reboot. The flag lives in memory, so a reboot clears it.
      - alert: reboot-waiting
        expr: |
          (
            min(min_over_time(homelab_reboot_required[2d]))
            and on() max(homelab_reboot_required offset 2d)
          ) > 0
          or on() max(absent_over_time(homelab_reboot_required[15m])) * -1
        for: 1h
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Beelink waiting on a reboot'
          measure: 'Reboot needed for 2 days or more (1 yes)'
          unit: ''
          harm: 'Installed fixes, such as a new kernel, do not take effect until it reboots.'
          action: >-
            See what needs it in /run/reboot-required.pkgs and why the 04:00 reboot did not happen in `journalctl -u
            unattended-upgrades`, then `sudo reboot` at a quiet time.
          dashboard: *home
          value: '{{ $value }}'
      # Each unit systemd holds as failed, the system's and Colin's (../failed_units.py, each minute). A timer's unit
      # that fails at every run is failed all but its seconds of running, which the 5-minute max covers.
      - alert: unit-failed
        expr: |
          (
            max by (manager, unit) (max_over_time(homelab_systemd_unit_failed[5m]))
          ) > 0
        for: 15m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'A systemd unit failed'
          measure: 'Failed (1 yes)'
          unit: ''
          harm: 'The job this unit runs has stopped, so whatever it keeps running or up to date is not.'
          action: >-
            Read why with `journalctl -u <unit> -n 50` on the Beelink (`journalctl --user -u` for manager "user"),
            fix the cause and start it again. For a test unit you no longer need, `systemctl reset-failed <unit>`
            (`systemctl --user` for manager "user").
          dashboard: *home
          value: '{{ $value }}'
      - alert: failed-units-check-stopped
        expr: |
          (
            round((time() - max(last_over_time(node_textfile_mtime_seconds{file=~".*/failed-units.prom"}[30m]))) / 60)
          ) > 10
          or on() max(absent_over_time(node_textfile_mtime_seconds{file=~".*/failed-units.prom"}[30m])) * -1
        for: 5m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Failed unit check stopped'
          measure: 'Last check'
          unit: ' min ago'
          harm: 'A failed systemd unit, the system''s or Colin''s, goes unseen while it is stopped.'
          action: >-
            Check `systemctl --user status observability-failed-units.service` and `systemctl --user list-timers
            observability-failed-units.timer` on the Beelink; deploy-main installs it with the observability stack.
          dashboard: *home
          value: '{{ $value }}'

  # CI jobs on the Beelink's VMs not starting while the supervisor runs (its stopping is ci-supervisor-stopped, so
  # it counts only while ci-waits.prom is fresh), from write_wait_metrics in scripts/ci_supervisor.py.
  - name: ci-jobs
    interval: 1m
    rules:
      # A job whose VM never boots or never takes it (normal: under 3 min), polls of GitHub failing or rate limited
      # (normal: under 7 min), or any job queued 2 h. A wait for slots, memory, disk or the load test is capacity in
      # use and backlogs reach an hour; `unseen` restarts counting at each supervisor restart.
      - alert: ci-jobs-not-starting
        expr: |
          round(max(
            max(homelab_ci_wait_seconds{kind=~"booting|ready"}) > 300
            or max(homelab_ci_poll_failed_seconds) > 600
            or max(homelab_ci_queued_seconds) > 7200
          ) / 60)
          and on() (time() - max(node_textfile_mtime_seconds{file=~".*/ci-waits.prom"})) < 600
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'CI jobs not starting'
          measure: 'Stuck for'
          unit: ' min'
          harm: 'Private repositories'' checks sit queued, so nothing of theirs merges or deploys.'
          action: >-
            On the Beelink read `sudo journalctl -u homelab-ci-supervisor -n 50`. Jobs waiting on "a VM booting for
            it": VMs die at start, `sudo journalctl -t homelab-ci-vm -n 30` says why; fix it and merge. "A VM
            ready for it": its runner is up but GitHub sends it no job; check githubstatus.com. "Rate limited
            until": it clears by itself then. "Poll failed": fix the error it names. See docs/architecture.md, "CI
            runner".
          dashboard: *home
          value: '{{ $value }}'

  # Alerting itself: the Prometheus mixin's two stock rules (documentation/prometheus-mixin/alerts.libsonnet), with
  # their `for`, taken over all series so a post carries no labels, on Prometheus's own metrics (prometheus.yml, job
  # "prometheus").
  - name: prometheus
    interval: 1m
    rules:
      # Always firing while rules run and alerts reach Discord. Alertmanager sends it each minute to the incidents
      # relay, which pings Healthchecks.io with it (../incidents/relay.py), and Healthchecks.io pages Colin when the
      # pings stop: the Beelink, Prometheus, Alertmanager or the relay is down, or the relay failed to post an alert
      # in the last hour. Not a GitHub cron: GitHub ran 15-minute schedules hours late.
      - alert: watchdog
        expr: |
          vector(1)
          unless on() sum(increase(alertmanager_notifications_failed_total{integration="webhook"}[1h])) > 0.5
        for: 0m
        keep_firing_for: 10m
        labels:
          level: watchdog
        annotations:
          title: 'Alerting works'
          measure: 'Working'
          unit: ''
          harm: 'None: it never posts to Discord. It pings Healthchecks.io, which posts once the pings stop.'
          action: 'Nothing while it fires. When Healthchecks.io posts, check the Beelink, then Prometheus and Alertmanager.'
          dashboard: *home
          value: '{{ $value }}'
      - alert: PrometheusRuleFailures
        expr: sum(increase(prometheus_rule_evaluation_failures_total{job="prometheus"}[5m])) > 0
        for: 15m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'An alert rule is failing'
          measure: 'Failed evaluations in 5 min'
          unit: ''
          harm: 'An alert whose query fails can never fire, so the problem it watches goes unseen.'
          action: >-
            Read `lastError` for the failing rule in `/prometheus/api/v1/rules` on the gateway (port 5081), fix
            its query in stacks/observability/prometheus/rules.yml and deploy.
          dashboard: *home
          value: '{{ $value }}'
      - alert: PrometheusBadConfig
        expr: min(max_over_time(prometheus_config_last_reload_successful{job="prometheus"}[5m])) == 0
        for: 10m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Prometheus refused its config'
          measure: 'Last reload worked (1 yes, 0 no)'
          unit: ''
          harm: 'The changed rules or scrapes are not running; the ones before them still are.'
          action: >-
            Read `docker logs --tail 50 observability-prometheus-1` and run `promtool check config` on the
            files.
          dashboard: *home
          value: '{{ $value }}'

  # The stores themselves: a store down, or up and no longer taking what Alloy sends, loses data. The log and trace
  # stores' own metrics come from Alloy's scrape of them (config.alloy); Alloy stopping is "Beelink metrics stopped".
  - name: stores
    interval: 1m
    rules:
      - alert: store-down
        expr: min by (job) (up{job=~"logs|traces"}) == 0
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'A store is down'
          measure: 'Answering (1 yes, 0 no)'
          unit: ''
          harm: >-
            Alloy holds what it cannot send for an hour, then drops it, so logs or traces from the outage are lost.
          action: >-
            Check `docker ps -a --filter name=observability-` and `docker logs --tail 50 observability-<job>-1`, then
            `docker compose up -d` in /home/colin/code/homelab/stacks/observability.
          dashboard: *home
          value: '{{ $value }}'
      # Only a store that took data in the last day: with OBI off, nothing sends spans.
      - alert: store-stopped
        expr: |
          sum by (job) (
            rate(prometheus_tsdb_head_samples_appended_total{job="prometheus"}[15m])
            or rate(vl_rows_ingested_total{job="logs"}[15m])
            or rate(vt_rows_ingested_total{job="traces"}[15m])
          ) == 0
          and on (job) sum by (job) (
            increase(prometheus_tsdb_head_samples_appended_total{job="prometheus"}[1d])
            or increase(vl_rows_ingested_total{job="logs"}[1d])
            or increase(vt_rows_ingested_total{job="traces"}[1d])
          ) > 0
        for: 15m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'A store stopped taking data'
          measure: 'Taken in the last 15 min, a second'
          unit: ''
          harm: >-
            The store answers but stores nothing new, so what is happening now is missing from the dashboards and the
            alerts that read it.
          action: >-
            Read `docker logs --tail 100 observability-alloy-1` for refused sends, then `docker logs --tail 100` the
            store's own container (`observability-<job>-1`).
          dashboard: *home
          value: '{{ $value }}'
      # A program's own tracing or a log loop sends thousands a second, where the two stores take a few to a few
      # tens: one burst from promtool reached 17,000 spans a second (obi/obi.yaml, skip_go_specific_tracers).
      - alert: store-flooded
        expr: |
          sum by (job) (
            round(rate(vl_rows_ingested_total{job="logs"}[15m]))
            or round(rate(vt_rows_ingested_total{job="traces"}[15m]))
          ) > 1000
        for: 5m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'A store is being flooded'
          measure: 'Taken in the last 15 min, a second'
          unit: ''
          harm: >-
            The log or trace store is taking in far more than its usual load, which fills its memory and disk and
            buries what the services wrote.
          action: >-
            Find the sender on Grafana's Traces page (http://grafana.internal/d/traces) or Logs page
            (http://grafana.internal/d/logs), then stop it or leave it out in stacks/observability/obi/obi.yaml or
            config.alloy.
          dashboard: *home
          value: '{{ $value }}'

  # The way to the stores: what Alloy loses or queues on the way (its own metrics, config.alloy, which carry
  # `component_id`), and host-metrics, which writes past Alloy (compose.yaml). Alloy's remote write to Prometheus
  # backing up is not here: its own numbers queue behind the rest, so it shows as "Beelink metrics stopped".
  - name: pipeline
    interval: 1m
    rules:
      # Every counter of what Alloy dropped, failed to send or refused, summed per component, so two moving together are
      # one post. Not loki.process's drop stages, which drop by design. The exporters' failure counters start at their
      # first failure, so the zero arm gives each exporter a series that counts that first one.
      - alert: telemetry-dropped
        expr: |
          (
            round(max by (component_id) (increase((
              sum by (job, component_id) ({
                component_id!="",
                __name__=~"otelcol_exporter_(send|enqueue)_failed_(log_records|spans|metric_points)_total|otelcol_receiver_(refused|failed)_(log_records|spans|metric_points)_total|otelcol_exporter_loki_entries_failed|prometheus_remote_storage_(samples|histograms|exemplars)_(failed|dropped)_total|loki_secretfilter_lines_dropped_total"
              })
              or sum by (job, component_id) (otelcol_exporter_queue_capacity{component_id!=""}) * 0
            )[15m:1m])))
          ) > 0
        for: 0m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Alloy is losing telemetry'
          measure: 'Lost or refused in 15 min'
          unit: ' logs, spans or samples'
          harm: >-
            What this component lost is gone for good, so the dashboards, and the alerts that read them, miss that
            stretch.
          action: >-
            Read `docker logs --tail 100 observability-alloy-1` for the component named, then the store it sends to:
            `docker logs --tail 50 observability-logs-1`, `observability-traces-1` or `observability-prometheus-1`.
            Fix that store, or stop the sender flooding it.
          dashboard: *home
          value: '{{ $value }}'
      # Each send queue holds 10,000 batches (config.alloy), and a full one drops what arrives. A store down is "A store
      # is down", so only a queue whose store still answers is named.
      - alert: telemetry-backing-up
        expr: |
          (
            max by (component_id) (
              round(100 * otelcol_exporter_queue_size{component_id!=""} / otelcol_exporter_queue_capacity{component_id!=""})
            )
          ) > 25
          unless on (component_id) label_replace(
            min by (job) (up{job=~"logs|traces"}) == 0, "component_id", "otelcol.exporter.otlphttp.$1", "job", "(.+)"
          )
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Alloy is backing up'
          measure: 'Send queue full'
          unit: '%'
          harm: >-
            The store takes less than Alloy sends; once the queue is full, new logs or traces are dropped and lost.
          action: >-
            Read `docker logs --tail 100 observability-alloy-1` for slow or refused sends, and the store's own logs:
            `docker logs --tail 100 observability-logs-1` or `observability-traces-1`. A flood shows on Grafana's Logs
            page (http://grafana.internal/d/logs) or Traces page (http://grafana.internal/d/traces).
          dashboard: *home
          value: '{{ $value }}'
      # host-metrics writes each scrape's `up` too, so all three jobs gone is host-metrics stopped or no longer writing;
      # one target down is the probes' alerts.
      - alert: host-metrics-stopped
        expr: |
          (
            max(absent_over_time(up{job=~"caddy|coredns|homeassistant"}[10m]))
          ) > 0
        for: 0m
        keep_firing_for: 10m
        labels:
          level: week
        annotations:
          title: 'Proxy, DNS and Home Assistant metrics stopped'
          measure: 'Missing for'
          unit: ' 10 min or more'
          harm: >-
            The .internal proxy's, DNS's and Home Assistant's numbers are not recorded, so their dashboards keep a gap
            that is never filled.
          action: >-
            Check `docker ps -a --filter name=observability-host-metrics` and `docker logs --tail 50
            observability-host-metrics-1`, then `docker compose up -d` in /home/colin/code/homelab/stacks/observability.
          dashboard: *home
          value: '{{ $value }}'

  # Who changed the Beelink, and what should not be there: the facts the Beelink writes each minute
  # (beelink/security/security_facts.py, security.prom). An event stays in the file for an hour and fires for its first 10
  # minutes. A CI-host install by Colin or Renovate is every merge, so only another's posts. The install's author is
  # the commit's own text, so a forged one is caught only by main's ruleset.
  - name: intrusion
    interval: 1m
    rules:
      - alert: ci-host-updated
        expr: |
          max by (author, commit) (
            round((time() - homelab_ci_host_install_timestamp_seconds{author!~`Colin Cheung|renovate\[bot\]`}) / 60)
          ) < 10
        for: 0m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'CI host installed another''s commit'
          measure: 'Installed'
          unit: ' min ago'
          harm: >-
            update.sh installs ci-runner/ and scripts/ from main as root, so a commit you did not merge runs with full
            control of the Beelink.
          action: >-
            Read that commit on main and `journalctl -u homelab-ci-update`; if you did not merge it, stop the timer
            with `sudo systemctl stop homelab-ci-update.timer`.
          dashboard: *home
          value: '{{ $value }}'
      - alert: tailscale-device-added
        expr: |
          max by (name) (round((time() - homelab_tailscale_device_created_timestamp_seconds) / 3600))
          and on (name) (
            max by (name) (homelab_tailscale_device_created_timestamp_seconds{known!="true"})
            or max by (name) (time() - homelab_tailscale_device_created_timestamp_seconds) < 3600
          )
        for: 0m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'New or unknown Tailscale device'
          measure: 'Added'
          unit: ' h ago'
          harm: >-
            A device on the tailnet reaches the Beelink's ports, Grafana and SSH as the tailnet's rules allow; one you
            did not add means someone else holds a login or a key.
          action: >-
            If you added or re-added it, run `sudo rm -r /var/lib/homelab-security-facts` on the Beelink, so the next
            minute's check learns the tailnet as it is (beelink/security/security_facts.py). Otherwise remove it at
            https://login.tailscale.com/admin/machines and rotate your Tailscale login.
          dashboard: *home
          value: '{{ $value }}'
      - alert: ssh-login-elsewhere
        expr: |
          max by (user, from, device) (
            round((time() - homelab_ssh_login_timestamp_seconds{known!="true"}) / 60)
          ) < 10
        for: 0m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'SSH login not from a known device'
          measure: 'Logged in'
          unit: ' min ago'
          harm: 'A shell on the Beelink from another device can read every secret on it.'
          action: >-
            Read `journalctl -t sshd -t tailscaled -g "Accepted|ssh-session" --since -1h` on the Beelink. If it was
            not you, remove the device on the tailnet and the key from ~/.ssh/authorized_keys.
          dashboard: *home
          value: '{{ $value }}'
      - alert: security-checks-stopped
        expr: |
          (
            round((time() - max(last_over_time(node_textfile_mtime_seconds{file=~".*/security.prom"}[30m]))) / 60)
          ) > 10
          or on() max(absent_over_time(node_textfile_mtime_seconds{file=~".*/security.prom"}[30m])) * -1
        for: 5m
        keep_firing_for: 10m
        labels:
          level: now
        annotations:
          title: 'Security checks stopped'
          measure: 'Last check'
          unit: ' min ago'
          harm: 'CI-host installs, new Tailscale devices and SSH logins go unseen while it is stopped.'
          action: >-
            Check `systemctl status homelab-security-facts.service` on the Beelink; it starts with `sudo
            ci-runner/install-host.sh`.
          dashboard: *home
          value: '{{ $value }}'

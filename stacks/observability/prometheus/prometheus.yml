# Alloy scrapes every source and writes here (../config.alloy). Prometheus scrapes only what Alloy cannot reach:
# itself, for the rules on its own health (rules.yml, group "prometheus"), and Alertmanager, whose API only it and
# the gateway may reach (../compose.yaml, alerting).
global:
  scrape_interval: 15s
  evaluation_interval: 1m

storage:
  tsdb:
    # No size cap: 30 days at this feed is about 2 GB, so a cap near that would cut the keep short.
    retention:
      time: 30d

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # Whether it is up, and its notifications_failed_total: posts that did not reach Discord.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

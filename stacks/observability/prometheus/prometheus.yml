# Alloy scrapes every source and writes here (../config.alloy). Prometheus scrapes only what Alloy may not reach:
# itself, for the rules on its own health (rules.yml, group "prometheus"); Alertmanager, whose API only it and
# the gateway may reach (../compose.yaml, alerting); and the public probes, as blackbox probes any address its
# caller names and reaches the internet.
global:
  scrape_interval: 15s
  evaluation_interval: 1m

storage:
  tsdb:
    # No size cap: 30 days at this feed is about 2 GB, so a cap near that would cut the keep short.
    retention:
      time: 30d

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/slos.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # Whether it is up, and its notifications_failed_total: posts that did not reach Discord.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  # Probes the public API through Cloudflare and the tunnel each minute, as every probe is a request to it. Passes
  # only when the backend serves live upstream aircraft data, not stale cache (../blackbox/blackbox.yml).
  - job_name: integrations/blackbox/flight-tracker
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [aircraft_live]
      target: ["https://api.colincheung.dev/aircraft"]
    static_configs:
      - targets: ["blackbox:9115"]
        labels:
          instance: beelink
  # The public sites, each a 200 through Cloudflare. The API's own probe is the flight tracker's above.
  - job_name: integrations/blackbox/sites
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets: ["https://colincheung.dev", "https://flight-tracker-at-home.pages.dev"]
        labels:
          instance: beelink
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: site
      - target_label: __address__
        replacement: blackbox:9115

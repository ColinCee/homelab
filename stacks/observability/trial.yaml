# The trial beside the live stack (docs/runbooks/switching-observability.md, "Before the merge"), never deployed:
#   docker compose -p obs-trial --env-file <trial env> -f compose.yaml -f trial.yaml up -d
# No host ports, alerts to a local sink (trial-webhook; edit it to post to Discord), and no restarts,
# since the live stack's restart rule would post about them. The stores keep their data in the volumes the live
# stack will use, so nothing they hold is lost at the switch.
x-trial: &trial
  restart: "no"
  # Its memory cap, a systemd user slice set by hand: without it the trial has none.
  cgroup_parent: obs-trial.slice

services:
  prometheus: *trial
  logs: *trial
  traces: *trial
  grafana:
    <<: *trial
    ports: !reset []
  grafana-users: *trial
  alertmanager:
    <<: *trial
    networks:
      - alerting
      - alertmanager-out
  gateway:
    <<: *trial
    ports: !reset []
  alloy: *trial
  docker-socket-proxy: *trial
  blackbox: *trial
  obi: *trial
  probes:
    profiles: [never]
  public-stats:
    profiles: [never]
  openobserve-history:
    profiles: [never]
  # Takes Alertmanager's posts (trial-webhook).
  sink:
    <<: *trial
    image: python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
    mem_limit: 48m
    command:
      - python
      - -u
      - -c
      - |
        import http.server as h
        class S(h.BaseHTTPRequestHandler):
            def do_POST(s):
                print(s.rfile.read(int(s.headers["Content-Length"])).decode(), flush=True)
                s.send_response(204)
                s.end_headers()
            def log_message(s, *a):
                pass
        h.HTTPServer(("", 8080), S).serve_forever()
    networks:
      - alertmanager-out

networks:
  # The live stack's name would be taken when it starts.
  otlp:
    name: obs-trial-otlp

volumes:
  # The live stack's names (project `observability`), so the switch keeps what the trial stored.
  prometheus-data:
    name: observability_prometheus-data
  loki-data:
    name: observability_loki-data
  victorialogs-data:
    name: observability_victorialogs-data
  tempo-data:
    name: observability_tempo-data
  victoriatraces-data:
    name: observability_victoriatraces-data

secrets:
  discord_webhook:
    file: ./trial-webhook

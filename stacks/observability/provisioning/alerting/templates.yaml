apiVersion: 1
templates:
  - orgId: 1
    name: homelab-discord
    template: |
      {{- define "homelab.discord.heading" -}}
      {{- if or (eq .Labels.alertname "GrafanaTestAlert") (eq .Labels.notification_test "true") -}}
      Test — Discord notifications
      {{- else if eq .Labels.alertname "DatasourceNoData" -}}
      {{ if eq .Status "firing" }}Monitoring gap{{ else }}Monitoring gap ended{{ end }} — {{ .Labels.rulename }}
      {{- else if eq .Labels.alertname "DatasourceError" -}}
      {{ if eq .Status "firing" }}Monitoring error{{ else }}Monitoring error ended{{ end }} — {{ .Labels.rulename }}
      {{- else -}}
      {{ if eq .Status "firing" }}Firing{{ else }}Resolved{{ end }} — {{ .Labels.alertname }}
      {{- end -}}
      {{- end }}

      {{- define "homelab.discord.title" -}}
      {{- if eq (len .Alerts) 1 -}}
      {{ template "homelab.discord.heading" (index .Alerts 0) }}
      {{- else -}}
      Homelab — {{ len .Alerts.Firing }} firing, {{ len .Alerts.Resolved }} ended
      {{- end -}}
      {{- end }}

      {{- define "homelab.discord.message" -}}
      {{- range .Alerts }}
      {{- if gt (len $.Alerts) 1 }}**{{ template "homelab.discord.heading" . }}**
      {{ end -}}
      {{- if or (eq .Labels.alertname "GrafanaTestAlert") (eq .Labels.notification_test "true") -}}
      Delivery check only — no resource alert was triggered.
      Sent {{ .StartsAt.UTC.Format "02 Jan 2006 15:04 UTC" }}.
      {{- else -}}
      {{- with .Labels.severity }}{{ . | title }} · {{ end -}}
      {{- if eq .Status "firing" }}Since {{ .StartsAt.UTC.Format "02 Jan 2006 15:04 UTC" }}
      {{- else }}Ended {{ .EndsAt.UTC.Format "02 Jan 2006 15:04 UTC" }}{{ end }}
      {{ if eq .Labels.alertname "DatasourceNoData" -}}
      {{ if eq .Status "firing" -}}
      {{ if eq .Labels.datasource_uid "prometheus" }}Prometheus
      {{- else if eq .Labels.datasource_uid "loki" }}Loki{{ else }}The datasource{{ end }} returned no data. Resource health is unknown.
      Check the rule query and {{ if eq .Labels.datasource_uid "loki" }}Loki log ingestion{{ else }}Alloy scrapes in Prometheus{{ end }}.
      {{- else -}}
      The no-data alert ended; this does not confirm resource recovery.
      Check the current rule evaluation.
      {{- end }}
      {{- else if eq .Labels.alertname "DatasourceError" -}}
      {{ if eq .Status "firing" -}}
      Grafana could not evaluate the rule. Resource health is unknown.
      Check the rule error and {{ if eq .Labels.datasource_uid "loki" }}Loki
      {{- else if eq .Labels.datasource_uid "prometheus" }}Prometheus{{ else }}datasource{{ end }} connectivity.
      {{- else -}}
      The evaluation-error alert ended; this does not confirm resource recovery.
      Check the current rule evaluation.
      {{- end }}
      {{- else if eq .Status "resolved" -}}
      {{ if eq .Labels.alertname "Knowledge Task Failed" -}}
      Failure alert ended; this does not mean the failed task succeeded.
      {{- else -}}
      This alert instance ended; closure alone does not confirm recovery.
      {{ if match "^[0-9]+(\\.[0-9]+)?%$" .Annotations.value }}Last reported value: {{ .Annotations.value }}.
      {{ end -}}
      {{- end }}
      Check the current rule evaluation.
      {{- else if eq .Labels.alertname "Knowledge Task Failed" -}}
      A knowledge task failed in the last 5 minutes.
      Inspect Knowledge Task Runs or the task logs in Loki.
      {{- else if match "^[0-9]+(\\.[0-9]+)?%$" .Annotations.value -}}
      {{ .Annotations.summary }}: **{{ .Annotations.value }}**.
      {{ .Annotations.description }}
      {{ .Annotations.action }}
      {{- else -}}
      No usable measurement is attached. Check the rule evaluation before treating this as a threshold breach.
      {{- end }}
      {{ if match "^https?://" .GeneratorURL }}[View alert](<{{ .GeneratorURL }}>)
      {{- else }}[View alerts](<{{ reReplaceAll "/$" "" $.ExternalURL }}/alerting/list>){{ end }}
      {{- if and (eq .Status "firing") .SilenceURL }} · [Silence](<{{ .SilenceURL }}>){{ end }}
      {{- end }}

      {{ end -}}
      {{- end }}

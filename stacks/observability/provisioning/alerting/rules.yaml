apiVersion: 1
groups:
  - orgId: 1
    name: Infrastructure
    folder: Homelab
    interval: 1m
    rules:
      - uid: high-cpu
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle",job="integrations/unix"}[5m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink CPU usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 5 minutes (5-minute CPU average)."
          action: "Check CPU consumers in Container Overview."
        labels:
          severity: warning

      - uid: high-ram
        title: High RAM Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - (node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink RAM usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 90% for 5 minutes."
          action: "Check memory consumers in Container Overview."
        labels:
          severity: warning

      - uid: high-disk
        title: High Disk Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
                / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Beelink root disk usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 10 minutes."
          action: "Inspect root filesystem usage before removing files; preserve Docker volumes."
        labels:
          severity: critical

apiVersion: 1
groups:
  - orgId: 1
    name: Infrastructure
    folder: Homelab
    interval: 1m
    rules:
      - uid: high-cpu
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle",job="integrations/unix"}[5m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink CPU usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 5 minutes (5-minute CPU average)."
          action: "Check CPU consumers in Container Overview."
        labels:
          severity: warning

      - uid: high-ram
        title: High RAM Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - (node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink RAM usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 90% for 5 minutes."
          action: "Check memory consumers in Container Overview."
        labels:
          severity: warning

      - uid: high-disk
        title: High Disk Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
                / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Beelink root disk usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 10 minutes."
          action: "Inspect root filesystem usage before removing files; preserve Docker volumes."
        labels:
          severity: critical

      - uid: backup-missed
        title: Backup Missed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: loki
            model:
              expr: sum(count_over_time({container_name="backup"} |= "backup ok" [26h])) or vector(0)
              queryType: instant
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "Beelink off-site backup"
          value: "{{ with $values.A }}{{ .Value }}{{ end }} successful backups in 26 hours"
          description: "Threshold: no successful restic backup to R2 in the last 26 hours."
          action: "Check `docker logs backup`; see docs/runbooks/backups.md."
        labels:
          severity: critical

      - uid: backup-storage-high
        title: Backup Storage High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: loki
            model:
              expr: >-
                max(max_over_time({container_name="backup"} |= "repository size:"
                | regexp "repository size: (?P<bytes>[0-9]+) bytes" | unwrap bytes [26h])) or vector(0)
              queryType: instant
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5000000000]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink backup storage in R2"
          value: "{{ with $values.A }}{{ humanize1024 .Value }}B{{ end }}"
          description: "Threshold: above 5 GB. Uploads stop at 8 GB; R2 bills past 10 GB."
          action: "Find what grew with `docker exec backup restic stats`; see docs/runbooks/backups.md."
        labels:
          severity: warning

      - uid: flight-tracker-down
        title: Flight Tracker Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(probe_success{job="integrations/blackbox/flight-tracker"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 10m
        annotations:
          summary: "Flight tracker live radar"
          value: "{{ with $values.A }}{{ .Value }}{{ end }} (1 = live, 0 = down)"
          description: "Threshold: https://api.colincheung.dev/aircraft not serving live aircraft for 10 minutes."
          action: "Check `docker logs flight-tracker-backend-1` (upstream 403/429?) and `flight-tracker-cloudflared-1`."
        labels:
          severity: critical

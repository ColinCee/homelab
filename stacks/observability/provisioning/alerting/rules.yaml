apiVersion: 1
groups:
  - orgId: 1
    name: Infrastructure
    # Grafana keeps alert rules in a folder; this one holds no dashboards.
    folder: Alert rules
    interval: 1m
    rules:
      - uid: high-cpu
        title: Beelink CPU maxed out
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Busy share of the CPU, minus the CI VMs (they run at low CPU weight on
              # purpose and soak up idle time) and iowait (waiting on disk, not using CPU).
              expr: |
                (
                  sum(rate(node_cpu_seconds_total{mode!~"idle|iowait",job="integrations/unix"}[5m]))
                  - (sum(rate(container_cpu_usage_seconds_total{job="ci-vms",id=~"/firecracker/ci-slot[0-9]+"}[5m])) or vector(0))
                ) / count(node_cpu_seconds_total{mode="idle",job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        # Deploys build images for a few minutes at full CPU (twice on 4 Nov),
        # which needs nobody; a runaway process lasts longer.
        for: 20m
        annotations:
          summary: "Beelink CPU usage"
          measure: "CPU use"
          trigger: "over 80% for 20 min"
          chart: |
            100 * (
              (
                sum(rate(node_cpu_seconds_total{mode!~"idle|iowait",job="integrations/unix"}[5m]))
                - (sum(rate(container_cpu_usage_seconds_total{job="ci-vms",id=~"/firecracker/ci-slot[0-9]+"}[5m])) or vector(0))
              ) / count(node_cpu_seconds_total{mode="idle",job="integrations/unix"})
            )
          chart_line: "80"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 20 minutes (5-minute CPU average)."
          action: "Check the CPU chart on Home (containers, CI VMs and the rest), then its Containers section."
        labels:
          severity: warning

      - uid: high-ram
        title: Beelink running out of memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - (node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink RAM usage"
          measure: "Memory use"
          trigger: "over 90% for 5 min"
          chart: |
            100 * (
              1 - (node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
            )
          chart_line: "90"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 90% for 5 minutes."
          action: "Check the memory chart on Home (containers, CI VMs and the rest), then its Containers section."
        labels:
          severity: warning

      - uid: beelink-swapping
        title: Beelink swapping, slowing Kaizen's VMs
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              # Swap shares the one SSD with every CI VM's disk, so swapping stalls jobs and holds new
              # VMs back (6 Nov: 2-8 MB/s through most busy hours, held VMs about 10 min per task).
              expr: rate(node_vmstat_pswpout{job="integrations/unix"}[30m]) * 4096 / 1e6
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "Beelink swap writes"
          measure: "Swapped out"
          trigger: "over 1 MB/s for 30 min"
          chart: |
            rate(node_vmstat_pswpout{job="integrations/unix"}[30m]) * 4096 / 1e6
          chart_line: "1"
          value: "{{ with $values.A }}{{ printf \"%.1f\" .Value }} MB/s{{ end }}"
          description: "Threshold: over 1 MB/s swapped out, averaged over 30 minutes."
          action: "Check which VMs or containers hold swap (VmSwap in /proc/*/status) and the CI memory notes in docs/runbooks/ci-runner.md."
        labels:
          severity: warning

      - uid: beelink-disk-stalled
        title: Beelink disk too slow for Kaizen's VMs
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              # The share of time tasks waited on the disk. Over half holds new CI VMs back
              # (DISK_WAIT_LIMIT in ci_supervisor.py), so a half-hour of it means tasks queue.
              expr: rate(node_pressure_io_waiting_seconds_total{job="integrations/unix"}[30m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "Beelink disk waits"
          measure: "Time waiting on disk"
          trigger: "over 50% for 30 min"
          chart: |
            100 * (
              rate(node_pressure_io_waiting_seconds_total{job="integrations/unix"}[30m])
            )
          chart_line: "50"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: tasks waited on the disk over half the time, averaged over 30 minutes."
          action: "Check write rate and latency (iostat -dx nvme0n1), when the SSD was last trimmed (journalctl -u fstrim) and the CI disk notes in docs/runbooks/ci-runner.md."
        labels:
          severity: warning

      - uid: high-disk
        title: Beelink disk filling up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
                / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Beelink root disk usage"
          measure: "Disk use"
          trigger: "over 80% for 10 min"
          chart: |
            100 * (
              1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
              / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
            )
          chart_line: "80"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 10 minutes."
          action: "Inspect root filesystem usage before removing files; preserve Docker volumes."
        labels:
          severity: critical

      - uid: backup-missed
        title: Nightly backup didn't run
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Written by backup.sh after each successful run.
              expr: (time() - max(homelab_backup_last_success_timestamp_seconds)) / 3600
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [26]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "Beelink off-site backup"
          measure: "Last good backup"
          trigger: "over 26 h ago"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} h ago{{ end }}"
          description: "Threshold: no successful restic backup to R2 in the last 26 hours."
          action: "Check `docker logs backup`; see docs/runbooks/backups.md."
        labels:
          severity: critical

      - uid: backup-storage-high
        title: Backup storage nearly full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: loki
            model:
              expr: >-
                max(max_over_time({container_name="backup"} |= "repository size:"
                | regexp "repository size: (?P<bytes>[0-9]+) bytes" | unwrap bytes [26h])) or vector(0)
              queryType: instant
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5000000000]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink backup storage in R2"
          measure: "Backup storage"
          trigger: "over 5 GB"
          value: "{{ with $values.A }}{{ humanize1024 .Value }}B{{ end }}"
          description: "Threshold: above 5 GB. Uploads stop at 8 GB; R2 bills past 10 GB."
          action: "Find what grew with `docker exec backup restic stats`; see docs/runbooks/backups.md."
        labels:
          severity: warning

      - uid: flight-tracker-down
        title: Flight Tracker site down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(probe_success{job="integrations/blackbox/flight-tracker"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 10m
        annotations:
          summary: "Flight tracker live radar"
          measure: "Live radar"
          trigger: "down for 10 min"
          value: "{{ with $values.A }}{{ if eq .Value 0.0 }}down{{ else }}live{{ end }}{{ end }}"
          description: "Threshold: https://api.colincheung.dev/aircraft not serving live aircraft for 10 minutes."
          action: "Check `docker logs flight-tracker-backend-1` (upstream 403/429?) and `flight-tracker-cloudflared-1`."
        labels:
          severity: critical

      - uid: new-container
        title: Unknown container started
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # A container whose name was not seen in the week before its last hour.
              # Compose keeps names across deploys, so redeploys don't fire. Quick
              # `docker run` checks by people and agents get random names but stop
              # within minutes, so `for: 15m` lets them pass (30 days to 6 Nov: 35 new
              # names, 32 such checks; the 3 that ran on were new stacks).
              expr: >-
                count by (name) (container_last_seen{job="docker",name!=""})
                unless count by (name) (max_over_time(container_last_seen{job="docker",name!=""}[7d] offset 1h))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Unknown container running"
          measure: "Container"
          value: "{{ $labels.name }}"
          description: "Container {{ $labels.name }} has run on the Beelink for 15 minutes and was not seen in the week before."
          action: >-
            Expected if you just added a stack or ran one by hand. Otherwise check
            `docker ps -a --filter name={{ $labels.name }}` and `docker inspect` its image and command.
        labels:
          severity: warning

      - uid: new-tailnet-device
        title: New Tailscale device
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # When each device visible to the Beelink was added to the tailnet
              # (stacks/observability/systemd/observability-tailnet.service).
              expr: max by (name, os) (homelab_tailnet_device_created_timestamp_seconds)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                # Devices added before this time are approved. The alert stays on
                # until the device leaves the tailnet or this moves past its added time.
                - evaluator:
                    type: gt
                    params: [1793962000]  # 6 Nov 2026 10:46 UTC
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "New Tailscale device"
          measure: "Device"
          value: "{{ reReplaceAll \"[.].*\" \"\" $labels.name }} ({{ $labels.os }})"
          description: "{{ $labels.name }} ({{ $labels.os }}) was added to the tailnet and is visible to the Beelink."
          action: >-
            Ask Colin whether it is his. If yes, approve it by raising this rule's
            threshold in stacks/observability/provisioning/alerting/rules.yaml to
            {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}; that approves every device
            added before it too, so first check none of the other firing devices is unknown.
            If not his, he removes it at https://login.tailscale.com/admin/machines and rotates
            any secret it could reach.
        labels:
          severity: warning

      - uid: tailnet-check-stale
        title: Tailscale device check stopped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Without fresh data, New Tailscale device stays quiet.
              expr: (time() - max(node_textfile_mtime_seconds{file=~".*/tailnet.prom"})) / 60
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [15]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Tailscale device check stopped"
          measure: "Last check"
          trigger: "over 15 min ago"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} min ago{{ else }}never{{ end }}"
          description: "The device list behind New Tailscale device has not been written for over 15 minutes, so new devices would go unnoticed."
          action: >-
            Check `systemctl --user status observability-tailnet.service` and
            `tailscale status` on the Beelink, and that colin owns /var/lib/homelab-metrics.
        labels:
          severity: warning

      - uid: pc-backup-stale
        title: PC backup stopped arriving
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Newest file the PC sent (stacks/backup/systemd/backup-pc-receive.service).
              # 50 h lets one night pass with the PC off.
              expr: (time() - max(homelab_pc_backup_newest_timestamp_seconds)) / 3600
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "PC backup"
          measure: "Newest PC backup"
          trigger: "over 50 h old"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} h old{{ else }}never{{ end }}"
          description: "No backup file has arrived from the Windows PC in over 50 hours."
          action: >-
            Check the PC's "Homelab PC backup" task and `~/.pc-backup.json` there, then
            `systemctl --user status backup-pc-receive` on the Beelink; see docs/runbooks/backups.md.
        labels:
          severity: warning

  - orgId: 1
    name: Kaizen
    # Grafana keeps alert rules in a folder; this one holds no dashboards.
    folder: Alert rules
    interval: 1m
    rules:
      - uid: kaizen-machine-wait
        title: Kaizen tasks stuck waiting for a test VM
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Served by Auto Kaizen's Control room: the longest a running task has waited for a homelab machine.
              # [2m] rides out a missed scrape while the Control room redeploys. Only while it has read
              # GitHub in the last 10 minutes: a stale Control room keeps counting a wait that may have ended.
              expr: >-
                max(max_over_time(kaizen_machine_wait_seconds_max{job="kaizen"}[2m])) / 60
                and on() (time() - max(max_over_time(kaizen_tasks_read_timestamp_seconds{job="kaizen"}[2m])) < 600)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
              refId: C
        # No number while the Control room restarts for a deploy, several times a day: quiet, as
        # Kaizen Control room unreachable says when it is really down.
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Longest Kaizen wait for a homelab machine"
          measure: "Longest wait for a VM"
          trigger: "over 20 min"
          chart: >-
            max(max_over_time(kaizen_machine_wait_seconds_max{job="kaizen"}[2m])) / 60
            and on() (time() - max(max_over_time(kaizen_tasks_read_timestamp_seconds{job="kaizen"}[2m])) < 600)
          chart_line: "20"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} min{{ end }}"
          description: "Threshold: a task has waited over 20 minutes for a homelab CI machine."
          action: "Check `journalctl -u homelab-ci-supervisor` on the Beelink and the job's runner labels; see docs/runbooks/ci-runner.md."
        labels:
          severity: warning

      - uid: kaizen-not-merging
        title: Kaizen hasn't merged anything in 3 hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: prometheus
            model:
              # Hours since the last merge, or 0 unless tasks have been running or waiting for the whole
              # last 3 hours, so work starting after an idle night does not count as not merging.
              expr: >-
                (time() - max(max_over_time(kaizen_last_merge_timestamp_seconds{job="kaizen"}[2m]))) / 3600
                * on() min_over_time((sum(kaizen_tasks{job="kaizen",state=~"working|waiting_for_machine|stuck"}) > bool 0)[3h:1m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        # No number while the Control room restarts for a deploy, several times a day: quiet, as
        # Kaizen Control room unreachable says when it is really down.
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Time since Kaizen last merged, with tasks queued"
          measure: "Since last merge"
          trigger: "over 3 h with tasks queued"
          value: "{{ with $values.A }}{{ printf \"%.1f\" .Value }} h{{ end }}"
          description: "Threshold: tasks have been running or waiting for 3 hours, and nothing has merged in that time."
          action: "Open the Control room (http://beelink.tail4f465e.ts.net:8090) and Grafana Home; look for a failing step or held change."
        labels:
          severity: warning

      - uid: kaizen-watcher-stopped
        title: Kaizen's Watcher stopped running
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Minutes since Auto Kaizen's Watcher, due every 20 minutes, last worked (served by the Control room).
              # Needs neither GitHub's machines nor the Watcher: on 5 Nov GitHub did not start Kaizen's jobs for hours
              # and nothing warned. Only while the Control room read GitHub in the last 10 minutes.
              expr: >-
                (time() - max(max_over_time(kaizen_watcher_success_timestamp_seconds{job="kaizen"}[2m]))) / 60
                and on() (time() - max(max_over_time(kaizen_tasks_read_timestamp_seconds{job="kaizen"}[2m])) < 600)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              refId: C
        # No number yet (a Control room older than the metric): quiet; the off-host Kaizen watchdog still checks.
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Minutes since Auto Kaizen's Watcher last worked"
          measure: "Since the Watcher last ran"
          trigger: "over 60 min"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} min{{ end }}"
          description: "Threshold: the Watcher, due every 20 minutes, has not worked for an hour, so GitHub is not starting Kaizen's jobs."
          action: "Open github.com/ColinCee/auto-kaizen/actions: a refused job names the cause (billing, an outage, no machine)."
        labels:
          severity: warning

      - uid: kaizen-control-room-down
        title: Kaizen Control room unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # The Control room posts every other alert to Discord, so its own outage goes there directly (policies.yaml).
              expr: max(up{job="kaizen"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Kaizen Control room scrape"
          measure: "Control room"
          trigger: "down for 5 min"
          value: "{{ with $values.A }}{{ if eq .Value 0.0 }}down{{ else }}up{{ end }}{{ end }}"
          description: "Threshold: Prometheus could not reach the Control room for 5 minutes, so alerts are not reaching the #alerts forum."
          action: "On the Beelink: docker ps -a | grep control-room, then docker logs on it."
        labels:
          severity: critical

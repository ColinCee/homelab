apiVersion: 1
groups:
  - orgId: 1
    name: Infrastructure
    # Grafana keeps alert rules in a folder; this one holds no dashboards.
    folder: Alert rules
    interval: 1m
    rules:
      - uid: high-cpu
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle",job="integrations/unix"}[5m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink CPU usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 5 minutes (5-minute CPU average)."
          action: "Check the CPU chart on Home (containers, CI VMs and the rest), then its Containers section."
        labels:
          severity: warning

      - uid: high-ram
        title: High RAM Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - (node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink RAM usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 90% for 5 minutes."
          action: "Check the memory chart on Home (containers, CI VMs and the rest), then its Containers section."
        labels:
          severity: warning

      - uid: high-disk
        title: High Disk Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
                / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Beelink root disk usage"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 10 minutes."
          action: "Inspect root filesystem usage before removing files; preserve Docker volumes."
        labels:
          severity: critical

      - uid: backup-missed
        title: Backup Missed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Written by backup.sh after each successful run.
              expr: (time() - max(homelab_backup_last_success_timestamp_seconds)) / 3600
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [26]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "Beelink off-site backup"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }}{{ end }} hours since the last successful backup"
          description: "Threshold: no successful restic backup to R2 in the last 26 hours."
          action: "Check `docker logs backup`; see docs/runbooks/backups.md."
        labels:
          severity: critical

      - uid: backup-storage-high
        title: Backup Storage High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: loki
            model:
              expr: >-
                max(max_over_time({container_name="backup"} |= "repository size:"
                | regexp "repository size: (?P<bytes>[0-9]+) bytes" | unwrap bytes [26h])) or vector(0)
              queryType: instant
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5000000000]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink backup storage in R2"
          value: "{{ with $values.A }}{{ humanize1024 .Value }}B{{ end }}"
          description: "Threshold: above 5 GB. Uploads stop at 8 GB; R2 bills past 10 GB."
          action: "Find what grew with `docker exec backup restic stats`; see docs/runbooks/backups.md."
        labels:
          severity: warning

      - uid: flight-tracker-down
        title: Flight Tracker Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(probe_success{job="integrations/blackbox/flight-tracker"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 10m
        annotations:
          summary: "Flight tracker live radar"
          value: "{{ with $values.A }}{{ .Value }}{{ end }} (1 = live, 0 = down)"
          description: "Threshold: https://api.colincheung.dev/aircraft not serving live aircraft for 10 minutes."
          action: "Check `docker logs flight-tracker-backend-1` (upstream 403/429?) and `flight-tracker-cloudflared-1`."
        labels:
          severity: critical

  - orgId: 1
    name: Kaizen
    # Grafana keeps alert rules in a folder; this one holds no dashboards.
    folder: Alert rules
    interval: 1m
    rules:
      - uid: kaizen-machine-wait
        title: Kaizen Waiting For A Machine
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Served by the Kaizen Board: the longest a running task has waited for a homelab machine.
              # [2m] rides out a missed scrape while the board redeploys. Only while the board has read
              # GitHub in the last 10 minutes: a stale board keeps counting a wait that may have ended.
              expr: >-
                max(max_over_time(kaizen_machine_wait_seconds_max{job="kaizen"}[2m])) / 60
                and on() (time() - max(max_over_time(kaizen_tasks_read_timestamp_seconds{job="kaizen"}[2m])) < 600)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Longest Kaizen wait for a homelab machine"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} minutes{{ end }}"
          description: "Threshold: a task has waited over 20 minutes for a homelab CI machine."
          action: "Check `journalctl -u homelab-ci-supervisor` on the Beelink and the job's runner labels; see docs/runbooks/ci-runner.md."
        labels:
          severity: warning

      - uid: kaizen-not-merging
        title: Kaizen Not Merging
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: prometheus
            model:
              # Hours since the last merge, or 0 unless tasks have been running or waiting for the whole
              # last 3 hours, so work starting after an idle night does not count as not merging.
              expr: >-
                (time() - max(max_over_time(kaizen_last_merge_timestamp_seconds{job="kaizen"}[2m]))) / 3600
                * on() min_over_time((sum(kaizen_tasks{job="kaizen",state=~"working|waiting_for_machine|stuck"}) > bool 0)[3h:1m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: "Time since Kaizen last merged, with tasks queued"
          value: "{{ with $values.A }}{{ printf \"%.1f\" .Value }} hours{{ end }}"
          description: "Threshold: tasks have been running or waiting for 3 hours, and nothing has merged in that time."
          action: "Open the Kaizen Board (http://beelink.tail4f465e.ts.net:8090) and Kaizen on Grafana's Home; look for a failing step or a held change."
        labels:
          severity: warning

apiVersion: 1
groups:
  - orgId: 1
    name: Infrastructure
    # Grafana keeps alert rules in a folder; this one holds no dashboards.
    folder: Alert rules
    interval: 1m
    rules:
      - uid: high-cpu
        title: Beelink CPU maxed out
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Busy share of the CPU, minus the CI VMs (they run at low CPU weight on
              # purpose and soak up idle time) and iowait (waiting on disk, not using CPU).
              expr: |
                (
                  sum(rate(node_cpu_seconds_total{mode!~"idle|iowait",job="integrations/unix"}[5m]))
                  - (sum(rate(container_cpu_usage_seconds_total{job="ci-vms",id=~"/firecracker/ci-slot[0-9]+"}[5m])) or vector(0))
                ) / count(node_cpu_seconds_total{mode="idle",job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        # Deploys build images for a few minutes at full CPU (twice on 4 Nov),
        # which needs nobody; a runaway process lasts longer.
        for: 20m
        # A dip under 10 minutes is not a clear, so one problem stays one alert.
        keepFiringFor: 10m
        annotations:
          summary: "Beelink CPU usage"
          measure: "CPU use"
          trigger: "over 80% for 20 min"
          chart: |
            100 * (
              (
                sum(rate(node_cpu_seconds_total{mode!~"idle|iowait",job="integrations/unix"}[5m]))
                - (sum(rate(container_cpu_usage_seconds_total{job="ci-vms",id=~"/firecracker/ci-slot[0-9]+"}[5m])) or vector(0))
              ) / count(node_cpu_seconds_total{mode="idle",job="integrations/unix"})
            )
          chart_line: "80"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 20 minutes (5-minute CPU average)."
          action: "Check the CPU chart on Home (containers, CI VMs and the rest), then its Containers section."
        labels:
          severity: warning

      - uid: high-ram
        title: Beelink running out of memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 1 - (node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        # A dip under 10 minutes is not a clear, so one problem stays one alert.
        keepFiringFor: 10m
        annotations:
          summary: "Beelink RAM usage"
          measure: "Memory use"
          trigger: "over 90% for 5 min"
          chart: |
            100 * (
              1 - (node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"})
            )
          chart_line: "90"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 90% for 5 minutes."
          action: "Check the memory chart on Home (containers, CI VMs and the rest), then its Containers section."
        labels:
          severity: warning

      - uid: beelink-swapping
        title: Beelink swapping, slowing Kaizen's VMs
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Swap shares the one SSD with every CI VM's disk, so swapping stalls jobs and holds new VMs back.
              expr: rate(node_vmstat_pswpout{job="integrations/unix"}[5m]) * 4096 / 1e6
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 30m
        # A dip under 10 minutes is not a clear, so one problem stays one alert.
        keepFiringFor: 10m
        annotations:
          summary: "Beelink swap writes"
          measure: "Swapped out"
          trigger: "over 1 MB/s for 30 min"
          chart: |
            rate(node_vmstat_pswpout{job="integrations/unix"}[5m]) * 4096 / 1e6
          chart_line: "1"
          value: "{{ with $values.A }}{{ printf \"%.1f\" .Value }} MB/s{{ end }}"
          description: "Threshold: over 1 MB/s swapped out for 30 minutes."
          action: >-
            Check which VMs or containers hold swap (VmSwap in /proc/*/status) and the CI memory
            notes in docs/runbooks/ci-runner.md.
        labels:
          severity: warning

      - uid: ci-vm-out-of-memory
        title: A Kaizen job ran out of memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              # From each VM's ci-memwatch, counted by the CI supervisor when the VM ends.
              expr: sum by (kind) (increase(homelab_ci_vm_oom_kills_total{job="integrations/unix"}[15m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Out-of-memory kills in {{ $labels.kind }} VMs"
          measure: "Kills in the last 15 min"
          trigger: "any"
          chart: |
            sum by (kind) (increase(homelab_ci_vm_oom_kills_total{job="integrations/unix"}[15m]))
          chart_line: "0"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }}{{ end }}"
          description: "A {{ $labels.kind }} VM's kernel killed a process for lack of memory: its job failed or ran short."
          action: >-
            Find the VM in the supervisor's log (`journalctl -u homelab-ci-supervisor -g "out-of-memory kills"`), map its
            runner name to the job, and give that job a bigger VM (LIGHT_SIZES in scripts/ci_supervisor.py) or trim it.
        labels:
          severity: critical

      - uid: ci-vms-near-full
        title: Kaizen jobs need nearly all their VM's memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              # The share of a kind's job VMs whose need passed 80% of their memory, once at least 8 ended in 6 h.
              expr: >-
                (sum by (kind) (increase(homelab_ci_vms_near_full_total{job="integrations/unix"}[6h]))
                / sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])))
                and sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])) >= 8
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.25]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "{{ $labels.kind }} VMs near full"
          measure: "Job VMs over 80% of their memory, last 6 h"
          trigger: "over a quarter, for 30 min"
          chart: |
            (sum by (kind) (increase(homelab_ci_vms_near_full_total{job="integrations/unix"}[6h]))
            / sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])))
            and sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])) >= 8
          chart_line: "0.25"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: >-
            Over a quarter of {{ $labels.kind }} job VMs needed more than 80% of their memory in 6 hours: the next
            bigger job may be killed.
          action: >-
            List the near-full VMs (`journalctl -u homelab-ci-supervisor -g "needed at least"`), see which jobs they ran, and
            give that kind more memory (LIGHT_SIZES or vm_size in scripts/ci_supervisor.py) or trim the job.
        labels:
          severity: warning

      - uid: ci-supervisor-poll-failing
        title: The CI supervisor's poll keeps failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Polls failed in a row (2 s apart), from the CI supervisor; 0 while they work.
              expr: max(homelab_ci_poll_failures{job="integrations/unix"})
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_poll_failed_seconds{job="integrations/unix"})
              instant: true
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [9]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "The CI supervisor's poll keeps failing: no job VM starts"
          measure: "Polls failed in a row"
          trigger: "10 or more, for 2 min"
          chart: |
            max(homelab_ci_poll_failures{job="integrations/unix"})
          chart_line: "10"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }}{{ end }}"
          description: >-
            Every poll of the CI supervisor has failed for {{ with $values.B }}{{ humanizeDuration .Value }}{{ end }}:
            no job VM starts on the Beelink, so every queued job waits.
          action: >-
            Read the error (`journalctl -u homelab-ci-supervisor -g "poll failed"`) and fix its cause in
            scripts/ci_supervisor.py (docs/runbooks/ci-runner.md).
        labels:
          severity: critical

      - uid: beelink-disk-stalled
        title: Beelink disk too slow for Kaizen's VMs
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # The share of time tasks waited on the disk. Over half holds new CI VMs back
              # (DISK_WAIT_LIMIT in ci_supervisor.py), so a half-hour of it means tasks queue.
              expr: rate(node_pressure_io_waiting_seconds_total{job="integrations/unix"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.6]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 30m
        # A dip under 10 minutes is not a clear, so one problem stays one alert.
        keepFiringFor: 10m
        annotations:
          summary: "Beelink disk waits"
          measure: "Time waiting on disk"
          trigger: "over 60% for 30 min"
          chart: |
            100 * (
              rate(node_pressure_io_waiting_seconds_total{job="integrations/unix"}[5m])
            )
          chart_line: "60"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: tasks waited on the disk over 60% of the time for 30 minutes."
          action: >-
            Check write rate and latency (iostat -dx nvme0n1), when the SSD was last trimmed
            (journalctl -u fstrim) and the CI disk notes in docs/runbooks/ci-runner.md.
        labels:
          severity: warning

      - uid: high-disk
        title: Beelink disk filling up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
                / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Beelink root disk usage"
          measure: "Disk use"
          trigger: "over 80% for 10 min"
          chart: |
            100 * (
              1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
              / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
            )
          chart_line: "80"
          value: "{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}"
          description: "Threshold: above 80% for 10 minutes."
          action: "Inspect root filesystem usage before removing files; preserve Docker volumes."
        labels:
          severity: critical

      - uid: backup-missed
        title: Nightly backup didn't run
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Written by backup.sh after each successful run.
              expr: (time() - max(homelab_backup_last_success_timestamp_seconds)) / 3600
              instant: true
              refId: A
          # The step the last run failed at, written by backup.sh and removed by the next good run:
          # 1 cap, 2 backup, 3 forget, 4 check, 0 none recorded. A number without labels, so the
          # annotation can read it whatever the alert's own labels are.
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                max(
                  homelab_backup_last_failure_timestamp_seconds{step="cap"} * 0 + 1
                  or homelab_backup_last_failure_timestamp_seconds{step="backup"} * 0 + 2
                  or homelab_backup_last_failure_timestamp_seconds{step="forget"} * 0 + 3
                  or homelab_backup_last_failure_timestamp_seconds{step="check"} * 0 + 4
                ) or vector(0)
              instant: true
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [26]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "Beelink off-site backup"
          measure: "Last good backup"
          trigger: "over 26 h ago"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} h ago{{ end }}"
          description: >-
            Threshold: no successful restic backup to R2 in the last 26 hours.
            Last run failed at: {{ with $values.B }}{{ if eq .Value 1.0 }}size cap (upload skipped)
            {{- else if eq .Value 2.0 }}backup (R2 or credentials){{ else if eq .Value 3.0 }}forget and prune
            {{- else if eq .Value 4.0 }}repository check{{ else }}no failure recorded (the run did not happen)
            {{- end }}{{ end }}.
          action: "Check `docker logs backup`; see docs/runbooks/backups.md."
        labels:
          severity: critical

      - uid: backup-storage-high
        title: Backup storage nearly full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: loki
            model:
              expr: >-
                max(max_over_time({container_name="backup"} |= "repository size:"
                | regexp "repository size: (?P<bytes>[0-9]+) bytes" | unwrap bytes [26h])) or vector(0)
              queryType: instant
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5000000000]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Beelink backup storage in R2"
          measure: "Backup storage"
          trigger: "over 5 GB"
          value: "{{ with $values.A }}{{ humanize1024 .Value }}B{{ end }}"
          description: "Threshold: above 5 GB. Uploads stop at 8 GB; R2 bills past 10 GB."
          action: "Find what grew with `docker exec backup restic stats`; see docs/runbooks/backups.md."
        labels:
          severity: warning

      - uid: flight-tracker-down
        title: Flight Tracker site down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(probe_success{job="integrations/blackbox/flight-tracker"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 10m
        # A dip under 10 minutes is not a clear, so one problem stays one alert.
        keepFiringFor: 10m
        annotations:
          summary: "Flight tracker live radar"
          measure: "Live radar"
          trigger: "down for 10 min"
          value: "{{ with $values.A }}{{ if eq .Value 0.0 }}down{{ else }}live{{ end }}{{ end }}"
          description: "Threshold: https://api.colincheung.dev/aircraft not serving live aircraft for 10 minutes."
          action: "Check `docker logs flight-tracker-backend-1` (upstream 403/429?) and `flight-tracker-cloudflared-1`."
        labels:
          severity: critical

      - uid: new-container
        title: Unknown container started
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # A container outside any Compose project whose name was not seen in the
              # week before its last hour. Stacks run under Compose and reach the
              # Beelink through the reviewed deploy path, so new stacks don't fire; a
              # hand-run `docker run` carries no project label. Quick checks by people
              # and agents stop within minutes, so `for: 15m` lets them pass.
              expr: >-
                count by (name) (container_last_seen{job="docker",name!="",container_label_com_docker_compose_project=""})
                unless count by (name) (max_over_time(container_last_seen{job="docker",name!=""}[7d] offset 1h))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Unknown container running"
          measure: "Container"
          value: "{{ $labels.name }}"
          description: "Container {{ $labels.name }} has run on the Beelink for 15 minutes and was not seen in the week before."
          # route: colin alerts ask Colin this in their #alerts post (a few words).
          needs: "Is {{ $labels.name }} yours?"
          action: >-
            Expected if you just added a stack or ran one by hand. Otherwise check
            `docker ps -a --filter name={{ $labels.name }}` and `docker inspect` its image and command.
        labels:
          severity: warning
          route: colin

      - uid: ssd-worn
        title: Beelink SSD wearing out
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              # The SSD's own estimate of its rated endurance used (scripts/ssd_wear.py).
              expr: max(homelab_ssd_percentage_used)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Beelink SSD wear"
          measure: "Endurance used"
          trigger: "over 80%"
          chart: max(homelab_ssd_percentage_used)
          chart_line: "80"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }}%{{ end }}"
          description: "The SSD reports over 80% of its rated write endurance used; past 100% it may start failing."
          needs: "Order a replacement SSD"
          action: >-
            Order a replacement SSD and plan the move. To see how fast it wears, chart
            `homelab_ssd_written_bytes_total` in Grafana.
        labels:
          severity: warning
          route: colin

      - uid: ssd-wear-stale
        title: SSD wear check stopped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              # Without fresh data, Beelink SSD wearing out stays quiet. last_over_time carries the
              # file time across a short scrape gap (an Alloy restart); a longer one is no data.
              expr: (time() - max(last_over_time(node_textfile_mtime_seconds{file=~".*/ssd.prom"}[30m]))) / 60
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "SSD wear check stopped"
          measure: "Last check"
          trigger: "over 60 min ago"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} min ago{{ else }}never{{ end }}"
          description: "ssd.prom has not been written for over an hour, so a wearing SSD would go unnoticed."
          action: >-
            Check `systemctl status homelab-ssd-wear.service` and `systemctl list-timers homelab-ssd-wear.timer`
            on the Beelink; it starts with `sudo ci-runner/install-host.sh`.
        labels:
          severity: warning

      - uid: pc-backup-stale
        title: PC backup stopped arriving
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Newest file the PC sent (stacks/backup/systemd/backup-pc-receive.service).
              # 50 h lets one night pass with the PC off.
              expr: (time() - max(homelab_pc_backup_newest_timestamp_seconds)) / 3600
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "PC backup"
          measure: "Newest PC backup"
          trigger: "over 50 h old"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} h old{{ else }}never{{ end }}"
          description: "No backup file has arrived from the Windows PC in over 50 hours."
          action: >-
            Check the PC's "Homelab PC backup" task and `~/.pc-backup.json` there, then
            `systemctl --user status backup-pc-receive` on the Beelink; see docs/runbooks/backups.md.
        labels:
          severity: warning

  - orgId: 1
    name: Kaizen
    # Grafana keeps alert rules in a folder; this one holds no dashboards.
    folder: Alert rules
    interval: 1m
    rules:
      - uid: kaizen-machine-wait
        title: Kaizen tasks stuck waiting for a test VM
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Served by Auto Kaizen's Control room: the longest a running task has waited for a homelab machine.
              # [2m] rides out a missed scrape while the Control room redeploys. Only while it has read
              # GitHub in the last 10 minutes: a stale Control room keeps counting a wait that may have ended.
              expr: >-
                max(max_over_time(kaizen_machine_wait_seconds_max{job="kaizen"}[2m])) / 60
                and on() (time() - max(max_over_time(kaizen_tasks_read_timestamp_seconds{job="kaizen"}[2m])) < 600)
              instant: true
              refId: A
          # Why: the CI runner's longest-waiting queued job, its minutes so far per kind of wait
          # (homelab_ci_wait_seconds, written by the supervisor), for the description. 0 when the
          # file is missing, so the reason never makes the rule no-data.
          - refId: slots
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_wait_seconds{job="integrations/unix",kind="slots"}) / 60 or on() vector(0)
              instant: true
              refId: slots
          - refId: memory
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_wait_seconds{job="integrations/unix",kind="memory"}) / 60 or on() vector(0)
              instant: true
              refId: memory
          - refId: disk
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_wait_seconds{job="integrations/unix",kind="disk"}) / 60 or on() vector(0)
              instant: true
              refId: disk
          - refId: booting
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_wait_seconds{job="integrations/unix",kind="booting"}) / 60 or on() vector(0)
              instant: true
              refId: booting
          - refId: other
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_wait_seconds{job="integrations/unix",kind="other"}) / 60 or on() vector(0)
              instant: true
              refId: other
          # The longest-waiting job asking for a runner label no VM has: its repo and labels
          # ride on the "other" kind, for the description. 0 with no labels when none waits.
          - refId: unmatched
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max by (repo, labels) (homelab_ci_wait_seconds{job="integrations/unix",kind="other",repo!=""}) or on() vector(0)
              instant: true
              refId: unmatched
          - refId: ready
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_wait_seconds{job="integrations/unix",kind="ready"}) / 60 or on() vector(0)
              instant: true
              refId: ready
          - refId: unseen
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_wait_seconds{job="integrations/unix",kind="unseen"}) / 60 or on() vector(0)
              instant: true
              refId: unseen
          # The rest of the Control room's wait, which the runner has no reason for: the kinds add
          # up to its longest queued job's wait since GitHub created it, and the Control room also
          # counts a job still waiting or pending on GitHub, which the runner never sees. 0 when
          # the two disagree.
          - refId: gap
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: >-
                ($A - $slots - $memory - $disk - $booting - $ready - $unseen - $other)
                * ($A - $slots - $memory - $disk - $booting - $ready - $unseen - $other > 0)
              refId: gap
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
              refId: C
        # No number while the Control room restarts for a deploy, several times a day: quiet, as
        # Kaizen Control room unreachable says when it is really down.
        noDataState: OK
        execErrState: Error
        for: 1m
        # A dip under 10 minutes is not a clear, so one problem stays one alert.
        keepFiringFor: 10m
        annotations:
          summary: "Longest Kaizen wait for a homelab machine"
          measure: "Longest wait for a VM"
          trigger: "over 20 min"
          chart: >-
            max(max_over_time(kaizen_machine_wait_seconds_max{job="kaizen"}[2m])) / 60
            and on() (time() - max(max_over_time(kaizen_tasks_read_timestamp_seconds{job="kaizen"}[2m])) < 600)
          chart_line: "20"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} min{{ end }}"
          description: >-
            Threshold: a task has waited over 20 minutes for a homelab CI machine.
            The CI runner's longest queued job waited
            {{ with $values.unseen }}{{ printf "%.0f" .Value }}{{ end }} min on GitHub before the runner saw it,
            {{ with $values.slots }}{{ printf "%.0f" .Value }}{{ end }} for a free slot,
            {{ with $values.memory }}{{ printf "%.0f" .Value }}{{ end }} for memory,
            {{ with $values.disk }}{{ printf "%.0f" .Value }}{{ end }} for the disk,
            {{ with $values.booting }}{{ printf "%.0f" .Value }}{{ end }} for its VM to boot,
            {{ with $values.ready }}{{ printf "%.0f" .Value }}{{ end }} with its VM ready but no job from GitHub and
            {{ with $values.other }}{{ printf "%.0f" .Value }}{{ end }} for a runner label no VM has.
            {{ with $values.unmatched }}{{ if .Labels.repo }}A job in {{ .Labels.repo }} asks for labels
            {{ .Labels.labels }}, which no VM has: it never starts here until its runs-on changes.{{ end }}{{ end }}
            {{ with $values.gap }}{{ printf "%.0f" .Value }}{{ end }} min of the wait has no runner reason:
            the job is still waiting or pending on GitHub, not yet queued for any runner.
          action: "See \"Why a job waits\" in docs/runbooks/ci-runner.md; `journalctl -u homelab-ci-supervisor` on the Beelink has each job's reason."
        labels:
          severity: warning

      - uid: kaizen-not-merging
        title: Kaizen hasn't merged anything in 3 hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: prometheus
            model:
              # Hours since the last merge, or 0 unless tasks have been running or waiting for the whole
              # last 3 hours, so work starting after an idle night does not count as not merging.
              expr: >-
                (time() - max(max_over_time(kaizen_last_merge_timestamp_seconds{job="kaizen"}[2m]))) / 3600
                * on() min_over_time((sum(kaizen_tasks{job="kaizen",state=~"working|waiting_for_machine|stuck"}) > bool 0)[3h:1m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        # No number while the Control room restarts for a deploy, several times a day: quiet, as
        # Kaizen Control room unreachable says when it is really down.
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Time since Kaizen last merged, with tasks queued"
          measure: "Since last merge"
          trigger: "over 3 h with tasks queued"
          value: "{{ with $values.A }}{{ printf \"%.1f\" .Value }} h{{ end }}"
          description: "Threshold: tasks have been running or waiting for 3 hours, and nothing has merged in that time."
          action: "Open the Control room (http://beelink.tail4f465e.ts.net:8090) and Grafana Home; look for a failing step or held change."
        labels:
          severity: warning

      - uid: kaizen-watcher-stopped
        title: Kaizen's Watcher stopped running
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Minutes since Auto Kaizen's Watcher, due every 20 minutes, last worked (served by the Control room).
              # Needs neither GitHub's machines nor the Watcher: on 5 Nov GitHub did not start Kaizen's jobs for hours
              # and nothing warned. Only while the Control room read GitHub in the last 10 minutes.
              expr: >-
                (time() - max(max_over_time(kaizen_watcher_success_timestamp_seconds{job="kaizen"}[2m]))) / 60
                and on() (time() - max(max_over_time(kaizen_tasks_read_timestamp_seconds{job="kaizen"}[2m])) < 600)
              instant: true
              refId: A
          # Why: minutes since GitHub queued Auto Kaizen's longest-waiting job and the Watcher's own
          # job for a test VM, and the VMs running jobs (homelab_ci_queued_seconds and
          # homelab_ci_vms_busy, written by the CI supervisor), for the description. 0 when nothing
          # waits or the file is missing, so the reason never makes the rule no-data.
          - refId: kaizen
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_queued_seconds{job="integrations/unix",repo="ColinCee/auto-kaizen"}) / 60 or on() vector(0)
              instant: true
              refId: kaizen
          - refId: watcher
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_queued_seconds{job="integrations/unix",repo="ColinCee/auto-kaizen",workflow="watch"}) / 60 or on() vector(-1)
              instant: true
              refId: watcher
          - refId: busy
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_vms_busy{job="integrations/unix"}) or on() vector(0)
              instant: true
              refId: busy
          - refId: slots
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(homelab_ci_vm_slots{job="integrations/unix"}) or on() vector(0)
              instant: true
              refId: slots
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              refId: C
        # No number yet (a Control room older than the metric): quiet; Kaizen Control room unreachable covers a Control room that is down.
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Minutes since Auto Kaizen's Watcher last worked"
          measure: "Since the Watcher last ran"
          trigger: "over 60 min"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} min{{ end }}"
          description: >-
            Threshold: the Watcher, due every 20 minutes, has not worked for an hour.
            {{ with $values.watcher }}{{ if ge .Value 0.0 }}Its job has waited {{ printf "%.0f" .Value }} min for a test VM.
            {{- else }}Its job is not waiting for a test VM.{{ end }}{{ end }}
            Auto Kaizen's longest-waiting job has queued {{ with $values.kaizen }}{{ printf "%.0f" .Value }}{{ end }} min for a test VM,
            with {{ with $values.busy }}{{ printf "%.0f" .Value }}{{ end }} of {{ with $values.slots }}{{ printf "%.0f" .Value }}{{ end }} VMs busy.
          action: >-
            Waiting for a VM means a capacity problem: see "Why a job waits" in docs/runbooks/ci-runner.md.
            No waiting job means GitHub is not starting jobs: github.com/ColinCee/auto-kaizen/actions names the cause (billing, an outage).
        labels:
          severity: warning

      - uid: kaizen-github-app-calls
        title: Kaizen's GitHub App running out of calls
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Served by the Control room. At the limit every Builder fails until the hour resets.
              expr: >-
                max(max_over_time(kaizen_github_app_calls_used{job="kaizen"}[2m]))
                / max(max_over_time(kaizen_github_app_calls_limit{job="kaizen"}[2m])) * 100
              instant: true
              refId: A
          - refId: reset
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(kaizen_github_app_calls_reset_timestamp_seconds{job="kaizen"}) - time()) / 60 or on() vector(0)
              instant: true
              refId: reset
          - refId: early
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              # Late in the hour the calls come back within minutes, so only high use with over
              # 15 minutes still to go risks the limit.
              type: math
              expression: $A > 80 && $reset > 15
              refId: early
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: early
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        # No number while the Control room restarts for a deploy: quiet, as Kaizen Control room
        # unreachable says when it is really down.
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Share of the Kaizen GitHub App's hourly calls used"
          measure: "App's GitHub calls used"
          trigger: "over 80% of the hour's limit with over 15 min until it resets"
          chart: >-
            max(max_over_time(kaizen_github_app_calls_used{job="kaizen"}[2m]))
            / max(max_over_time(kaizen_github_app_calls_limit{job="kaizen"}[2m])) * 100
          chart_line: "80"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }}%{{ end }}"
          description: >-
            Threshold: Kaizen's GitHub App has used over 80% of its hourly calls with over 15 minutes left in the hour;
            at the limit every Builder fails. Later in the hour it stays quiet, as the calls come back soon.
            The calls come back in {{ with $values.reset }}{{ printf "%.0f" .Value }}{{ end }} min.
          action: >-
            On Grafana Home, the Kaizen GitHub App calls panel shows when use climbed, and the Control room restarts
            panel below it shows whether a restart came just before; find the Kaizen job calling GitHub most and slow it.
        labels:
          severity: warning
          # Kaizen's own spending: the factory manager finds and slows the spender.
          route: factory

      - uid: kaizen-control-room-down
        title: Kaizen Control room unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # The Control room posts every other alert to Discord, so its own outage goes there directly (policies.yaml).
              expr: max(up{job="kaizen"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Kaizen Control room scrape"
          measure: "Control room"
          trigger: "down for 5 min"
          value: "{{ with $values.A }}{{ if eq .Value 0.0 }}down{{ else }}up{{ end }}{{ end }}"
          description: "Threshold: Prometheus could not reach the Control room for 5 minutes, so alerts are not reaching the #alerts forum."
          action: "On the Beelink: docker ps -a | grep control-room, then docker logs on it."
        labels:
          severity: critical

  # Signs that Auto Kaizen itself wastes or stalls, served by its Control room (auto-kaizen's src/kaizen/anomaly.py,
  # whose *_AT constants are these thresholds). route=factory makes each a factory problem the factory manager fixes,
  # not an alert for the responder.
  - orgId: 1
    name: Kaizen factory
    folder: Alert rules
    interval: 1m
    rules:
      - uid: kaizen-workflow-key-calls
        title: Kaizen's shared workflow key running out of calls
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Percent left, as the Watcher last counted it; only while that count is under 90 minutes old, since a
              # Watcher waiting out an empty key runs up to 65 minutes before it counts again.
              expr: >-
                min(min_over_time(kaizen_github_workflow_key_calls_remaining{job="kaizen"}[2m]))
                / max(max_over_time(kaizen_github_workflow_key_calls_limit{job="kaizen"}[2m])) * 100
                and on() (time() - max(kaizen_github_workflow_key_calls_read_timestamp_seconds{job="kaizen"}) < 5400)
              instant: true
              refId: A
          - refId: reset
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(kaizen_github_workflow_key_calls_reset_timestamp_seconds{job="kaizen"}) - time()) / 60 or on() vector(0)
              instant: true
              refId: reset
          - refId: early
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: $A < 20 && $reset > 15
              refId: early
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: early
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Share of the workflows' shared GitHub key's hourly calls left"
          measure: "Shared key's calls left"
          trigger: "under 20% with over 15 min until it resets"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }}%{{ end }}"
          description: >-
            Threshold: every Auto Kaizen workflow shares one key of 5,000 GitHub calls an hour, and under a fifth is left
            with over 15 minutes to go. At none, workflows fail and the Watcher sits out. Back in
            {{ with $values.reset }}{{ printf "%.0f" .Value }}{{ end }} min.
          action: "Find the workflow spending it: the Watcher's 'used N of 5000' line, and which step reads GitHub most."
        labels:
          severity: warning
          route: factory

      - uid: kaizen-workflow-failures
        title: Kaizen workflows failing for one cause
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Failed runs of any workflow in the last hour, by the cause of their first failed job.
              expr: max by (cause) (max_over_time(kaizen_workflow_failures_last_hour{job="kaizen"}[2m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [4]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Failed Kaizen runs in the last hour for one cause"
          measure: "Failed runs, one cause"
          trigger: "5 or more in an hour"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} runs{{ end }}"
          description: "Threshold: 5 or more runs of Kaizen's workflows failed in the last hour with one cause: {{ $labels.cause }}"
          action: "Find the step that logs it, and why; an outside error that keeps coming back is ours to work around."
        labels:
          severity: warning
          route: factory

      - uid: kaizen-goal-owner-reruns
        title: A Kaizen goal owner reruns with nothing new
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Each ongoing goal's owner runs since the goal or one of its tasks last changed.
              expr: max by (goal) (max_over_time(kaizen_goal_owner_runs_since_change{job="kaizen"}[2m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Goal owner runs since anything changed for the goal"
          measure: "Owner runs, nothing new"
          trigger: "4 or more"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} runs{{ end }}"
          description: >-
            Threshold: goal G{{ $labels.goal }}'s owner ran 4 or more times while nothing changed for it: no task opened
            and no task's run ended. Each run is an agent paid for.
          action: "Read the goal's Recheck: and Owner: lines: what it waits on, and why that wakes it."
        labels:
          severity: warning
          route: factory

      - uid: kaizen-stopped-alike
        title: Kaizen tasks stopped for one reason
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Tasks stopped for Colin or their goal owner, by the cause of their last run's stop.
              expr: max by (reason) (max_over_time(kaizen_stopped_tasks_alike{job="kaizen"}[2m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Stopped Kaizen tasks sharing one stop reason"
          measure: "Tasks stopped alike"
          trigger: "2 or more"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} tasks{{ end }}"
          description: >-
            Threshold: 2 or more tasks wait on Colin or their goal owner, stopped for one reason: {{ $labels.reason }}.
            One reason across tasks is likely Kaizen's own fault, not theirs.
          action: "Find what the tasks share (a conflict with main, a red main, a step) and fix that once."
        labels:
          severity: warning
          route: factory

      - uid: kaizen-silent-tasks
        title: Kaizen tasks left with nothing moving them
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Open tasks whose newest finished run left no Run record, and that nothing runs.
              expr: max(max_over_time(kaizen_silent_tasks{job="kaizen"}[2m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Open Kaizen tasks whose last run left no record"
          measure: "Silent tasks"
          trigger: "1 or more for 10 min"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} tasks{{ end }}"
          description: >-
            Threshold: a task's run finished over 40 minutes ago without writing its Run record, and nothing runs it now,
            so no goal owner, Watcher or retry will move it.
          action: "The Control room's /state lists the tasks; read the run's Record step log for why its note was not written."
        labels:
          severity: warning
          route: factory

      - uid: kaizen-agent-cost
        title: Kaizen's agents spending fast
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Agent runs that ended in the last hour. The busiest real hours of a week cost about $26 (90th
              # percentile); the night of waste reached $45 to $58.
              expr: max(max_over_time(kaizen_agent_cost_usd_last_hour{job="kaizen"}[2m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [40]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "What Kaizen's agents cost in the last hour"
          measure: "Agent cost, last hour"
          trigger: "over $40"
          chart: max(max_over_time(kaizen_agent_cost_usd_last_hour{job="kaizen"}[2m]))
          chart_line: "40"
          value: "{{ with $values.A }}${{ printf \"%.0f\" .Value }}{{ end }}"
          description: "Threshold: agents' runs that ended in the last hour cost over $40, past any busy hour of real work."
          action: "kaizen-speed --agents --since <an hour ago> names the workflow and agent spending it."
        labels:
          severity: warning
          route: factory

      - uid: kaizen-signs-stale
        title: Kaizen's waste checks stopped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Minutes since the Control room last looked for these signs, while it is up: a dead look reads as calm.
              expr: >-
                (time() - max(max_over_time(kaizen_anomaly_read_timestamp_seconds{job="kaizen"}[2m]))) / 60
                and on() (max(up{job="kaizen"}) == 1)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Minutes since the Control room last looked for waste"
          measure: "Since the last look"
          trigger: "over 10 min"
          value: "{{ with $values.A }}{{ printf \"%.0f\" .Value }} min{{ end }}"
          description: >-
            Threshold: the Control room is up but has not looked for signs of waste or stalls for 10 minutes, so the other
            factory alerts cannot fire.
          action: "docker logs on the Control room: its anomaly look's error repeats there."
        labels:
          severity: warning
          route: factory
# Grafana keeps a rule removed from this file until its uid is listed here.
deleteRules:
  - orgId: 1
    uid: new-tailnet-device
  - orgId: 1
    uid: tailnet-check-stale

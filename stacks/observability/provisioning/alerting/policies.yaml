apiVersion: 1
policies:
  - orgId: 1
    receiver: Kaizen
    group_by: ['alertname', 'rulename']
    group_wait: 30s
    group_interval: 5m
    # Rare repeats to Kaizen: a firing on an alert issue open over 12 hours reads
    # as a lost resolve and opens a new issue, and some alerts stay on until
    # Colin acts (Beelink SSD wearing out). 5 days is as long as Grafana keeps its
    # record of what it sent.
    repeat_interval: 120h
    # The Control room posts every other alert to Discord, so only its own
    # outage also goes straight to Discord through the webhook.
    routes:
      - receiver: Discord Private
        repeat_interval: 12h
        object_matchers:
          - ["alertname", "=", "Kaizen Control room unreachable"]

apiVersion: 1
policies:
  - orgId: 1
    receiver: Kaizen
    group_by: ['alertname', 'rulename']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    # Kaizen posts alerts to Discord itself, so it cannot report its own
    # failure: these also go straight to Discord through the webhook.
    routes:
      - receiver: Discord Private
        object_matchers:
          - ["alertname", "=~", "Kaizen's Watcher stopped running|Kaizen Control room unreachable|DatasourceNoData|DatasourceError"]

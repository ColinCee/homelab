apiVersion: 1
policies:
  - orgId: 1
    receiver: Kaizen
    # One notification per series, so each is its own Kaizen issue: the labels
    # that tell a rule's series apart (rules.yaml).
    group_by: ['alertname', 'rulename', 'kind', 'name', 'cause', 'goal', 'reason']
    group_wait: 30s
    group_interval: 5m
    # Rare repeats to Kaizen: it reads Grafana's firing list each minute, so a
    # lost resolve is found there. 5 days is as long as Grafana keeps its record
    # of what it sent.
    repeat_interval: 120h
    routes:
      # The Control room posts every other alert to Discord, so its own outage
      # also goes straight to Discord through the webhook.
      - receiver: Discord Private
        repeat_interval: 12h
        object_matchers:
          - ["alertname", "=", "Kaizen Control room unreachable"]
      # One issue, post and question per unknown container: grouped only by rule, a second
      # container would hide behind the first's post with no new mention.
      - receiver: Kaizen
        group_by: ['alertname', 'rulename', 'name']
        object_matchers:
          - ["route", "=", "colin"]

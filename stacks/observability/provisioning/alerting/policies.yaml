apiVersion: 1
policies:
  - orgId: 1
    receiver: Kaizen
    group_by: ['alertname', 'rulename']
    group_wait: 30s
    group_interval: 5m
    # Rare repeats to Kaizen: a firing on an alert issue open over 12 hours reads
    # as a lost resolve and opens a new issue, and an alert can stay on for days.
    # 5 days is as long as Grafana keeps its record of what it sent.
    repeat_interval: 120h
    routes:
      # The Control room posts every other alert to Discord, so its own outage
      # also goes straight to Discord through the webhook.
      - receiver: Discord Private
        repeat_interval: 12h
        object_matchers:
          - ["alertname", "=", "Kaizen Control room unreachable"]
      # One issue, post and question per unknown container: grouped only by rule, a second
      # container would hide behind the first's post with no new mention.
      - receiver: Kaizen
        group_by: ['alertname', 'rulename', 'name']
        object_matchers:
          - ["route", "=", "colin"]

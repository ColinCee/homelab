apiVersion: 1
contactPoints:
  - orgId: 1
    name: Discord Private
    receivers:
      - uid: discord-private
        type: discord
        disableResolveMessage: false
        settings:
          url: ${DISCORD_PRIVATE_WEBHOOK_URL}
          use_discord_username: true
          use_embed_description: true
          title: '{{ template "homelab.discord.title" . }}'
          message: '{{ template "homelab.discord.message" . }}'
      # Wakes the "Homelab alert triage" Claude routine, which diagnoses and
      # fixes it. Firing only; Discord still gets resolves.
      - uid: claude-triage
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.anthropic.com/v1/claude_code/routines/trig_019CAZPbSkiyWMPPYFkxfitP/fire
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${CLAUDE_ROUTINE_TOKEN}
          headers:
            anthropic-version: "2023-06-01"
            anthropic-beta: experimental-cc-routine-2026-04-01
          payload:
            template: '{{ template "homelab.claude.payload" . }}'

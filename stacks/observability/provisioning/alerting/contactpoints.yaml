apiVersion: 1
contactPoints:
  - orgId: 1
    name: Discord Private
    receivers:
      - uid: discord-private
        type: discord
        disableResolveMessage: false
        settings:
          url: ${DISCORD_PRIVATE_WEBHOOK_URL}
          use_discord_username: true
          use_embed_description: true
          title: '{{ template "homelab.discord.title" . }}'
          message: '{{ template "homelab.discord.message" . }}'
# Grafana keeps a contact point removed from this file until its uid is listed here.
deleteContactPoints:
  - orgId: 1
    uid: discord-only
  - orgId: 1
    uid: kaizen-only

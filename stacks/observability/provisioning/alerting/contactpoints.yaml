apiVersion: 1
contactPoints:
  - orgId: 1
    name: Discord Private
    receivers:
      - uid: discord-private
        type: discord
        disableResolveMessage: false
        settings:
          url: ${DISCORD_PRIVATE_WEBHOOK_URL}
          use_discord_username: true
          use_embed_description: true
          title: '{{ template "homelab.discord.title" . }}'
          message: '{{ template "homelab.discord.message" . }}'
      # Also to Kaizen, so these alerts get a post in #alerts like the rest.
      - uid: kaizen-alert
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://100.100.146.119:8090/alert
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${KAIZEN_ALERT_SECRET}
          payload:
            template: '{{ template "homelab.kaizen.payload" . }}'
  # Every other alert: an `alert` issue in Auto Kaizen through its Control
  # room, which starts the responder and keeps the alert's post in the Discord
  # #alerts forum; the resolve closes the issue.
  - orgId: 1
    name: Kaizen
    receivers:
      - uid: kaizen-only
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://100.100.146.119:8090/alert
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${KAIZEN_ALERT_SECRET}
          payload:
            template: '{{ template "homelab.kaizen.payload" . }}'

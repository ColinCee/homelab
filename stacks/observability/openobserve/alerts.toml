# OpenObserve's alert rules, one per Grafana rule in ../provisioning/alerting/rules.yaml (same key and title), which
# stays the live alerter until the cutover. apply.py makes OpenObserve match this file on each deploy.
#
# A rule fires when its `promql` is `operator` `threshold` for `for`, and holds through a dip shorter than
# `keep_firing`. A per-series rule names the labels that tell its series apart in `series`: one alert, and one
# Kaizen issue, per series. A `no_data` query fires the rule when the metric is gone, as Grafana's NoData did,
# with the value -1. `extra` holds named queries the Control room runs for the post's numbers.
# Post fields (`measure`, `trigger`, `chart`, `chart_line`, `closes`, `needs`) are those Kaizen reads from Grafana's rules.
# `format` shows the value as Grafana's `value` annotation does: a Python `{:spec}` with text around it, `bytes`, or
# `down/live` (0, else not); Kaizen applies it (auto-kaizen src/kaizen/board/alert_source.py, `shown`).

# Until the cutover every rule goes to `shadow` alone, which Kaizen logs without opening issues. `true` sends each
# rule to its route's destinations instead, and needs DISCORD_PRIVATE_WEBHOOK_URL passed to openobserve-apply.
live = false

# Where each route goes when live.
[routes]
kaizen = ["discord"]
colin = ["discord"]

# Minutes before a firing alert is sent again. The Control room ignores a repeat of an alert it has open; a resolved
# message waits for the repeat to end, so Discord's is 30 minutes.
[repeat]
kaizen = 0

# Destinations: `${NAME}` is read from the environment, and `body` is the template, `kaizen` (Kaizen's /alert body)
# or `discord`. The Control room by its name on its Docker network, the one private host OpenObserve allows
# (ZO_SSRF_ALLOWED_HOSTS).
[destinations.shadow]
url = "http://control-room:8090/alert/openobserve/shadow"
bearer = "${KAIZEN_ALERT_SECRET}"
body = "kaizen"

[destinations.kaizen]
url = "http://control-room:8090/alert"
bearer = "${KAIZEN_ALERT_SECRET}"
body = "kaizen"

[destinations.discord]
url = "${DISCORD_PRIVATE_WEBHOOK_URL}"
body = "discord"

[rules.high-cpu]
title = "Beelink CPU maxed out"
route = "kaizen"
# Busy share of the CPU, minus the CI VMs (they run at low CPU weight on purpose and soak up idle time) and
# iowait (waiting on disk, not using CPU).
promql = '''
(
  sum(rate(node_cpu_seconds_total{mode!~"idle|iowait",job="integrations/unix"}[5m]))
  - (sum(rate(container_cpu_usage_seconds_total{job="ci-vms",id=~"/firecracker/ci-slot[0-9]+"}[5m])) or vector(0))
) / count(node_cpu_seconds_total{mode="idle",job="integrations/unix"})'''
no_data = '''absent_over_time(node_cpu_seconds_total{job="integrations/unix"}[5m])'''
operator = ">"
threshold = 0.8
# Deploys build images for a few minutes at full CPU, which needs nobody; a runaway process lasts longer.
for = "20m"
keep_firing = "10m"
measure = "CPU use"
format = "{:.0%}"
trigger = "over 80% for 20 min"
chart = '''
100 * (
  (
    sum(rate(node_cpu_seconds_total{mode!~"idle|iowait",job="integrations/unix"}[5m]))
    - (sum(rate(container_cpu_usage_seconds_total{job="ci-vms",id=~"/firecracker/ci-slot[0-9]+"}[5m])) or vector(0))
  ) / count(node_cpu_seconds_total{mode="idle",job="integrations/unix"})
)'''
chart_line = 80
description = "Threshold: above 80% for 20 minutes (5-minute CPU average)."
action = "Check the CPU chart on Home (containers, CI VMs and the rest), then its Containers section."

[rules.high-ram]
title = "Beelink running out of memory"
route = "kaizen"
# OpenObserve keeps metric names in lower case.
promql = "1 - (node_memory_memavailable_bytes{job=\"integrations/unix\"} / node_memory_memtotal_bytes{job=\"integrations/unix\"})"
no_data = '''absent_over_time(node_memory_memavailable_bytes{job="integrations/unix"}[5m])'''
operator = ">"
threshold = 0.9
for = "5m"
keep_firing = "10m"
measure = "Memory use"
format = "{:.0%}"
trigger = "over 90% for 5 min"
chart = '''
100 * (
  1 - (node_memory_memavailable_bytes{job="integrations/unix"} / node_memory_memtotal_bytes{job="integrations/unix"})
)'''
chart_line = 90
description = "Threshold: above 90% for 5 minutes."
action = "Check the memory chart on Home (containers, CI VMs and the rest), then its Containers section."

[rules.beelink-swapping]
title = "Beelink swapping, slowing CI VMs"
route = "kaizen"
# Swap shares the one SSD with every CI VM's disk, so swapping stalls jobs and holds new VMs back.
promql = "rate(node_vmstat_pswpout{job=\"integrations/unix\"}[5m]) * 4096 / 1e6"
no_data = '''absent_over_time(node_vmstat_pswpout{job="integrations/unix"}[5m])'''
operator = ">"
threshold = 1
for = "30m"
keep_firing = "10m"
measure = "Swapped out"
format = "{:.1f} MB/s"
trigger = "over 1 MB/s for 30 min"
chart = "rate(node_vmstat_pswpout{job=\"integrations/unix\"}[5m]) * 4096 / 1e6"
chart_line = 1
description = "Threshold: over 1 MB/s swapped out for 30 minutes."
action = '''
Check which VMs or containers hold swap (VmSwap in /proc/*/status) and the CI memory notes in
docs/runbooks/ci-runner.md.'''

[rules.ci-vm-out-of-memory]
title = "A CI job ran out of memory"
route = "kaizen"
series = ["kind"]
# From each VM's ci-memwatch, counted by the CI supervisor when the VM ends.
promql = "sum by (kind) (increase(homelab_ci_vm_oom_kills_total{job=\"integrations/unix\"}[15m]))"
operator = ">"
threshold = 0
for = "0m"
closes = "event"
measure = "Kills in the last 15 min"
format = "{:.0f}"
trigger = "any"
chart = "sum by (kind) (increase(homelab_ci_vm_oom_kills_total{job=\"integrations/unix\"}[15m]))"
chart_line = 0
description = "A VM's kernel killed a process for lack of memory: its job failed or ran short."
action = '''
Find the VM in the supervisor's log (`journalctl -u homelab-ci-supervisor -g "out-of-memory kills"`), map its
runner name to the job, and give that job a bigger VM (LIGHT_SIZES in scripts/ci_supervisor.py) or trim it.'''

[rules.ci-vms-near-full]
title = "CI jobs need nearly all their VM's memory"
route = "kaizen"
series = ["kind"]
# The share of a kind's job VMs whose need passed 80% of their memory, once at least 8 ended in 6 h.
promql = '''
(sum by (kind) (increase(homelab_ci_vms_near_full_total{job="integrations/unix"}[6h]))
/ sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])))
and sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])) >= 8'''
operator = ">"
threshold = 0.25
for = "30m"
measure = "Job VMs over 80% of their memory, last 6 h"
format = "{:.0%}"
trigger = "over a quarter, for 30 min"
chart = '''
(sum by (kind) (increase(homelab_ci_vms_near_full_total{job="integrations/unix"}[6h]))
/ sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])))
and sum by (kind) (increase(homelab_ci_vms_ended_total{job="integrations/unix"}[6h])) >= 8'''
chart_line = 0.25
description = '''
Over a quarter of this kind's job VMs needed more than 80% of their memory in 6 hours: the next bigger job may
be killed.'''
action = '''
List the near-full VMs (`journalctl -u homelab-ci-supervisor -g "needed at least"`), see which jobs they ran,
and give that kind more memory (LIGHT_SIZES or vm_size in scripts/ci_supervisor.py) or trim the job.'''

[rules.ci-supervisor-poll-failing]
title = "The CI supervisor's poll keeps failing"
route = "kaizen"
# Polls failed in a row (2 s apart), from the CI supervisor; 0 while they work.
promql = "max(homelab_ci_poll_failures{job=\"integrations/unix\"})"
operator = ">"
threshold = 9
for = "2m"
measure = "Polls failed in a row"
format = "{:.0f}"
trigger = "10 or more, for 2 min"
chart = "max(homelab_ci_poll_failures{job=\"integrations/unix\"})"
chart_line = 10
description = "Every poll of the CI supervisor has failed: no job VM starts on the Beelink, so every queued job waits."
action = '''
Read the error (`journalctl -u homelab-ci-supervisor -g "poll failed"`) and fix its cause in
scripts/ci_supervisor.py (docs/runbooks/ci-runner.md).'''

[rules.ci-supervisor-poll-failing.extra]
# Seconds every poll has failed.
failing_for = "max(homelab_ci_poll_failed_seconds{job=\"integrations/unix\"})"

[rules.beelink-disk-stalled]
title = "Beelink disk too slow for CI VMs"
route = "kaizen"
# The share of time tasks waited on the disk. Over half holds new CI VMs back (DISK_WAIT_LIMIT in
# ci_supervisor.py), so a half-hour of it means tasks queue.
promql = "rate(node_pressure_io_waiting_seconds_total{job=\"integrations/unix\"}[5m])"
no_data = '''absent_over_time(node_pressure_io_waiting_seconds_total{job="integrations/unix"}[5m])'''
operator = ">"
threshold = 0.6
for = "30m"
keep_firing = "10m"
measure = "Time waiting on disk"
format = "{:.0%}"
trigger = "over 60% for 30 min"
chart = '''
100 * (
  rate(node_pressure_io_waiting_seconds_total{job="integrations/unix"}[5m])
)'''
chart_line = 60
description = "Threshold: tasks waited on the disk over 60% of the time for 30 minutes."
action = '''
Check write rate and latency (iostat -dx nvme0n1), when the SSD was last trimmed (journalctl -u fstrim) and the
CI disk notes in docs/runbooks/ci-runner.md.'''

[rules.high-disk]
title = "Beelink disk filling up"
route = "kaizen"
promql = '''
1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
/ node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})'''
no_data = '''absent_over_time(node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}[5m])'''
operator = ">"
threshold = 0.8
for = "10m"
measure = "Disk use"
format = "{:.0%}"
trigger = "over 80% for 10 min"
chart = '''
100 * (
  1 - (node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
  / node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"})
)'''
chart_line = 80
description = "Threshold: above 80% for 10 minutes."
action = "Inspect root filesystem usage before removing files; preserve Docker volumes."

[rules.backup-missed]
title = "Nightly backup didn't run"
route = "kaizen"
# Hours since backup.sh last wrote a successful run.
promql = "(time() - max(homelab_backup_last_success_timestamp_seconds)) / 3600"
no_data = "absent_over_time(homelab_backup_last_success_timestamp_seconds[5m])"
operator = ">"
threshold = 26
for = "30m"
closes = "good-news"
measure = "Last good backup"
format = "{:.0f} h ago"
trigger = "over 26 h ago"
description = "Threshold: no successful restic backup to R2 in the last 26 hours."
action = "Check `docker logs backup`; see docs/runbooks/backups.md."

[rules.backup-missed.extra]
# The step the last run failed at, written by backup.sh and removed by the next good run:
# 1 cap, 2 backup, 3 forget, 4 check, 0 none recorded (the run did not happen).
failed_step = '''
max(
  homelab_backup_last_failure_timestamp_seconds{step="cap"} * 0 + 1
  or homelab_backup_last_failure_timestamp_seconds{step="backup"} * 0 + 2
  or homelab_backup_last_failure_timestamp_seconds{step="forget"} * 0 + 3
  or homelab_backup_last_failure_timestamp_seconds{step="check"} * 0 + 4
) or vector(0)'''

[rules.backup-storage-high]
title = "Backup storage nearly full"
route = "kaizen"
# Written by backup.sh after each good run; 26 h covers one missed night, which Nightly backup didn't run reports.
promql = "max(last_over_time(homelab_backup_repository_bytes[26h]))"
no_data = "absent_over_time(homelab_backup_repository_bytes[26h])"
operator = ">"
threshold = 5000000000
for = "5m"
measure = "Backup storage"
format = "bytes"
trigger = "over 5 GB"
description = "Threshold: above 5 GB. Uploads stop at 8 GB; R2 bills past 10 GB."
action = "Find what grew with `docker exec backup restic stats`; see docs/runbooks/backups.md."

[rules.flight-tracker-down]
title = "Flight Tracker site down"
route = "kaizen"
promql = "max(probe_success{job=\"integrations/blackbox/flight-tracker\"})"
no_data = "absent_over_time(probe_success{job=\"integrations/blackbox/flight-tracker\"}[5m])"
operator = "<"
threshold = 1
for = "10m"
keep_firing = "10m"
closes = "good-news"
measure = "Live radar"
format = "down/live"
trigger = "down for 10 min"
description = "Threshold: https://api.colincheung.dev/aircraft not serving live aircraft for 10 minutes."
action = "Check `docker logs flight-tracker-backend-1` (upstream 403/429?) and `flight-tracker-cloudflared-1`."

[rules.new-container]
title = "Unknown container started"
route = "colin"
series = ["name"]
# A container outside any Compose project whose name was not seen in the week before its last hour. Stacks run
# under Compose and reach the Beelink through the reviewed deploy path, so new stacks don't fire; a hand-run
# `docker run` carries no project label. Quick checks by people and agents stop within minutes, so `for: 15m`
# lets them pass. In OpenObserve no matcher, `=""` included, selects a series that lacks the label, so the
# containers with a project are taken away instead.
promql = '''
count by (name) (container_last_seen{job="docker",name!=""})
unless count by (name) (container_last_seen{job="docker",name!="",container_label_com_docker_compose_project!=""})
unless count by (name) (max_over_time(container_last_seen{job="docker",name!=""}[7d] offset 1h))'''
operator = ">"
threshold = 0
for = "15m"
needs = "Is this container yours?"
measure = "Container"
format = "{:.0f}"
description = "This container has run on the Beelink for 15 minutes and was not seen in the week before."
action = '''
Expected if you just added a stack or ran one by hand. Otherwise check `docker ps -a --filter name=<name>` and
`docker inspect` its image and command.'''

[rules.ssd-worn]
title = "Beelink SSD wearing out"
route = "colin"
# The SSD's own estimate of its rated endurance used (scripts/ssd_wear.py).
promql = "max(homelab_ssd_percentage_used)"
operator = ">"
threshold = 80
for = "0m"
needs = "Order a replacement SSD"
measure = "Endurance used"
format = "{:.0f}%"
trigger = "over 80%"
chart = "max(homelab_ssd_percentage_used)"
chart_line = 80
description = "The SSD reports over 80% of its rated write endurance used; past 100% it may start failing."
action = '''
Order a replacement SSD and plan the move. To see how fast it wears, chart `homelab_ssd_written_bytes_total`.'''

[rules.ssd-wear-stale]
title = "SSD wear check stopped"
route = "kaizen"
# Minutes since ssd.prom was written. last_over_time carries the file time across a short scrape gap (an Alloy
# restart); a longer one is no data.
promql = "(time() - max(last_over_time(node_textfile_mtime_seconds{file=~\".*/ssd.prom\"}[30m]))) / 60"
no_data = "absent_over_time(node_textfile_mtime_seconds{file=~\".*/ssd.prom\"}[30m])"
operator = ">"
threshold = 60
for = "5m"
closes = "good-news"
measure = "Last check"
format = "{:.0f} min ago"
trigger = "over 60 min ago"
description = "ssd.prom has not been written for over an hour, so a wearing SSD would go unnoticed."
action = '''
Check `systemctl status homelab-ssd-wear.service` and `systemctl list-timers homelab-ssd-wear.timer` on the
Beelink; it starts with `sudo ci-runner/install-host.sh`.'''

[rules.pc-backup-stale]
title = "PC backup stopped arriving"
route = "kaizen"
# Hours since the newest file the PC sent (stacks/backup/systemd/backup-pc-receive.service). 50 h lets one night
# pass with the PC off.
promql = "(time() - max(homelab_pc_backup_newest_timestamp_seconds)) / 3600"
no_data = "absent_over_time(homelab_pc_backup_newest_timestamp_seconds[5m])"
operator = ">"
threshold = 50
for = "30m"
closes = "good-news"
measure = "Newest PC backup"
format = "{:.0f} h old"
trigger = "over 50 h old"
description = "No backup file has arrived from the Windows PC in over 50 hours."
action = '''
Check the PC's "Homelab PC backup" task and `~/.pc-backup.json` there, then
`systemctl --user status backup-pc-receive` on the Beelink; see docs/runbooks/backups.md.'''

# OpenObserve's alert rules, held to the alert standard in docs/observability.md ("Alerts"). apply.py makes
# OpenObserve match this file on each deploy; every rule posts each minute while it fires to Alertmanager
# (../alertmanager), which posts to Discord, repeats, clears and holds back.
#
# A rule fires when its `promql` is `operator` `threshold` for `for`. Its value is shown as `measure: value unit`,
# so the query gives display units, rounded. A per-series rule names the labels that tell its series apart in
# `series`: one post per series. A `no_data` query fires the rule, shown as "no data", when the metric is gone;
# only metrics written outside Alloy carry one, since "Beelink metrics stopped" covers Alloy's own.

# Where each post links; a rule may name its own `dashboard`.
dashboard = "http://beelink.tail4f465e.ts.net:5080/web/dashboards?org_identifier=default"

[rules.beelink-metrics-stopped]
title = "Beelink metrics stopped"
level = "now"
promql = '''absent_over_time(up{job="integrations/unix"}[5m]) or absent_over_time(up{job="docker"}[5m])'''
operator = ">"
threshold = 0
for = "0m"
measure = "Missing for"
unit = " 5 min or more"
harm = """
No alert can see the Beelink while its numbers are missing, so the alerts that read them are held back. \
A real outage could be going on unseen."""
action = """
On the Beelink, check `docker ps -a --filter name=observability-` and `docker logs --tail 50 observability-alloy-1`, \
then `docker compose up -d` in /home/colin/code/homelab/stacks/observability."""

[rules.flight-tracker-down]
title = "Flight Tracker site down"
level = "now"
promql = '''max(probe_success{job="integrations/blackbox/flight-tracker"})'''
operator = "<"
threshold = 1
for = "10m"
measure = "Live aircraft check passing (1 yes, 0 no)"
unit = ""
harm = "https://api.colincheung.dev/aircraft is not serving live aircraft, so the public radar is blank or stale."
action = """
Check `docker logs --tail 50 flight-tracker-backend-1` (upstream 403 or 429?) and \
`docker logs --tail 50 flight-tracker-cloudflared-1`."""

[rules.home-assistant-down]
title = "Home Assistant down"
level = "now"
# From ../probes.py; a check older than 5 minutes counts as failed, since its file outlives it.
promql = '''
max(homelab_probe_success{target="home-assistant"})
* (time() - max(homelab_probe_timestamp_seconds) < bool 300)'''
no_data = '''absent_over_time(homelab_probe_success{target="home-assistant"}[15m])'''
operator = "<"
threshold = 1
for = "5m"
measure = "Answering (1 yes, 0 no)"
unit = ""
harm = "The house's automations and its app stop working."
action = """
Check `docker ps -a --filter name=homeassistant` and `docker logs --tail 50 homeassistant`; restart it with `docker restart homeassistant`. If it is up, the check itself stopped: `docker logs observability-probes-1`."""

[rules.dns-or-names-down]
title = "DNS or .internal names down"
level = "now"
# From ../probes.py: the DNS server answering home.internal, and Caddy serving it.
promql = '''
min(homelab_probe_success{target=~"names-(dns|proxy)"})
* (time() - max(homelab_probe_timestamp_seconds) < bool 300)'''
no_data = '''absent_over_time(homelab_probe_success{target="names-dns"}[15m])'''
operator = "<"
threshold = 1
for = "5m"
measure = "Both checks passing (1 yes, 0 no)"
unit = ""
harm = "home.internal, openobserve.internal and the other .internal names stop opening on every device."
action = """
Check `docker ps -a --filter name=internal-names` and `docker logs --tail 50 internal-names-dns-1` and `internal-names-proxy-1`. If both are up, the check itself stopped: `docker logs observability-probes-1`."""

[rules.high-ram]
title = "Beelink running out of memory"
level = "now"
# OpenObserve keeps metric names in lower case.
promql = '''
round(100 * (1 - node_memory_memavailable_bytes{job="integrations/unix"}
/ node_memory_memtotal_bytes{job="integrations/unix"}))'''
operator = ">"
threshold = 90
for = "5m"
measure = "Memory use"
unit = "%"
harm = "Past this the kernel kills processes, and any container may be the one stopped."
action = """
Find the container that grew with `docker stats --no-stream`, then restart it or give it a `mem_limit` in its \
compose.yaml."""

[rules.restart-loop]
title = "A container keeps restarting"
level = "now"
series = ["name"]
promql = '''max by (name) (changes(container_start_time_seconds{job="docker",name!=""}[30m]))'''
operator = ">"
threshold = 2
for = "10m"
measure = "Starts in the last 30 min"
unit = ""
harm = "The service in this container is down most of the time."
action = "Read why it stops with `docker logs --tail 100 <name>`, fix the cause, and redeploy its stack."

[rules.new-container]
title = "Unknown container started"
level = "now"
series = ["name"]
# A container outside any Compose project whose name was not seen in the week before its last hour. Stacks run
# under Compose and reach the Beelink through the reviewed deploy path, so new stacks don't fire; a hand-run
# `docker run` carries no project label. Quick checks by people and agents stop within minutes, so `for: 15m`
# lets them pass. In OpenObserve no matcher, `=""` included, selects a series that lacks the label, so the
# containers with a project are taken away instead.
promql = '''
count by (name) (container_last_seen{job="docker",name!=""})
unless count by (name) (container_last_seen{job="docker",name!="",container_label_com_docker_compose_project!=""})
unless count by (name) (max_over_time(container_last_seen{job="docker",name!=""}[7d] offset 1h))'''
operator = ">"
threshold = 0
for = "15m"
measure = "Containers of this name"
unit = ""
harm = "Something started a container outside the reviewed deploy path; if it was not you, someone else can run code here."
action = """
Expected if you ran one by hand. Otherwise check `docker ps -a --filter name=<name>` and `docker inspect` its image \
and command, then stop it."""

[rules.backup-missed]
title = "Nightly backup didn't run"
level = "week"
# Hours since backup.sh last wrote a successful run.
promql = "round((time() - max(homelab_backup_last_success_timestamp_seconds)) / 3600)"
no_data = "absent_over_time(homelab_backup_last_success_timestamp_seconds[15m])"
operator = ">"
threshold = 26
for = "30m"
measure = "Last good backup"
unit = " h ago"
harm = "Without a nightly copy in R2, a lost disk loses everything since the last good backup."
action = "Check `docker logs --tail 100 backup`; see docs/runbooks/backups.md."

[rules.pc-backup-stale]
title = "PC backup stopped arriving"
level = "week"
# Hours since the newest file the PC sent (stacks/backup/systemd/backup-pc-receive.service). 50 h lets one night
# pass with the PC off.
promql = "round((time() - max(homelab_pc_backup_newest_timestamp_seconds)) / 3600)"
no_data = "absent_over_time(homelab_pc_backup_newest_timestamp_seconds[15m])"
operator = ">"
threshold = 50
for = "30m"
measure = "Newest PC backup"
unit = " h old"
harm = "The Windows PC's files are no longer copied off it, so a dead PC disk loses them."
action = """
Check the PC's "Homelab PC backup" task and `~/.pc-backup.json` there, then \
`systemctl --user status backup-pc-receive` on the Beelink; see docs/runbooks/backups.md."""

[rules.high-disk]
title = "Beelink disk filling up"
level = "week"
promql = '''
round(100 * (1 - node_filesystem_avail_bytes{mountpoint="/",job="integrations/unix"}
/ node_filesystem_size_bytes{mountpoint="/",job="integrations/unix"}))'''
operator = ">"
threshold = 80
for = "10m"
measure = "Disk use"
unit = "%"
harm = "A full disk stops every stack writing: OpenObserve, the backups and Home Assistant's history."
action = """
Find what grew with `docker system df` and `sudo du -xh --max-depth=2 / | sort -h | tail`; prune images or old data, \
never Docker volumes."""

[rules.backup-storage-high]
title = "Backup storage nearly full"
level = "week"
# Written by backup.sh after each good run; 26 h covers one missed night, which Nightly backup didn't run reports.
promql = "round(max(last_over_time(homelab_backup_repository_bytes[26h])) / 1e9, 0.1)"
no_data = "absent_over_time(homelab_backup_repository_bytes[26h])"
operator = ">"
threshold = 5
for = "5m"
measure = "Backup storage"
unit = " GB"
harm = "Uploads stop at 8 GB, so backups stop; R2 bills past 10 GB."
action = "Find what grew with `docker exec backup restic stats`; see docs/runbooks/backups.md."

[rules.ssd-worn]
title = "Beelink SSD wearing out"
level = "week"
# The SSD's own estimate of its rated endurance used (scripts/ssd_wear.py).
promql = "max(homelab_ssd_percentage_used)"
operator = ">"
threshold = 80
for = "1h"
measure = "Endurance used"
unit = "%"
harm = "Past 100% of its rated writes the SSD may start failing, and everything on the Beelink is on it."
action = "Order a replacement SSD and plan the move. To see how fast it wears, chart `homelab_ssd_written_bytes_total`."

[rules.ssd-wear-stale]
title = "SSD wear check stopped"
level = "week"
# Minutes since ssd.prom was written. last_over_time carries the file time across a short scrape gap (an Alloy
# restart); a longer one is no data.
promql = '''round((time() - max(last_over_time(node_textfile_mtime_seconds{file=~".*/ssd.prom"}[30m]))) / 60)'''
no_data = '''absent_over_time(node_textfile_mtime_seconds{file=~".*/ssd.prom"}[30m])'''
operator = ">"
threshold = 60
for = "5m"
measure = "Last check"
unit = " min ago"
harm = "A wearing SSD would go unnoticed."
action = """
Check `systemctl status homelab-ssd-wear.service` and `systemctl list-timers homelab-ssd-wear.timer` on the \
Beelink; it starts with `sudo ci-runner/install-host.sh`."""

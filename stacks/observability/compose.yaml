services:
  # Metrics and the alert rules (prometheus/; docs/adr/0001-observability-stack.md). Alloy writes to it.
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --log.format=json
      # One heavy query must not take its memory, and the alerts with it: about 160 MB of samples, a minute, four at a
      # time.
      - --query.max-samples=10000000
      - --query.timeout=1m
      - --query.max-concurrency=4
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    # No published port: readers go through the gateway, since it serves admin calls beside its reads.
    labels:
      homelab.config-hash: ${CONFIG_HASH_PROMETHEUS:-}
    # Refused rules stop it at start, which fails the deploy's wait.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      start_period: 60s
      start_interval: 2s
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      ingest: {}
      stores: {}
      alerting: {}
      probe: {}
      # A fixed address, as host-metrics, on the host's network, has no Docker DNS.
      host-writes:
        ipv4_address: 10.201.0.2

  # Logs, VictoriaLogs (ADR 0001). Flags: https://docs.victoriametrics.com/victorialogs/#list-of-command-line-flags
  logs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    restart: unless-stopped
    read_only: true
    command:
      - -storageDataPath=/vlogs
      - -loggerFormat=json
      - -retentionPeriod=30d
      # A kill -9 lost about the last 5 s, its default save interval, of what it held in memory.
      - -inmemoryDataFlushInterval=1s
      # One heavy query must not take its memory: two at a time, a minute each, at most a month back. A 30-day count
      # took 8 s.
      - -search.maxConcurrentRequests=2
      - -search.maxQueryDuration=60s
      - -search.maxQueryTimeRange=31d
    security_opt:
      - no-new-privileges:true
    # It held a median 363 and at most 650 MiB through a 30-day backfill and heavy queries.
    mem_limit: 1g
    labels:
      homelab.config-hash: ${CONFIG_HASH_LOGS:-}
    volumes:
      - victorialogs-data:/vlogs
    networks:
      - ingest
      - stores

  # Traces, VictoriaTraces (ADR 0001). Flags: https://docs.victoriametrics.com/victoriatraces/#list-of-command-line-flags
  traces:
    image: victoriametrics/victoria-traces:v0.13.0@sha256:3018df8f99429d7d3029167ab9f70848bf0a778c31c49dff16c86c7e34759fbd
    restart: unless-stopped
    read_only: true
    command:
      - -storageDataPath=/vtraces
      - -loggerFormat=json
      # The default is 7 days.
      - -retentionPeriod=30d
      - -inmemoryDataFlushInterval=1s
      # As the log store's.
      - -search.maxConcurrentRequests=2
      - -search.maxQueryDuration=60s
      - -search.maxQueryTimeRange=31d
    security_opt:
      - no-new-privileges:true
    # Twice its 30-day peak of 300 MiB.
    mem_limit: 768m
    labels:
      homelab.config-hash: ${CONFIG_HASH_TRACES:-}
    volumes:
      - victoriatraces-data:/vtraces
    networks:
      - ingest
      - stores

  # Dashboards and Explore over every store, from Git (grafana/), behind a login: Colin's admin
  # login, and the agents' read-only one (grafana-users). Provisioned dashboards and data sources refuse edits.
  grafana:
    build:
      context: .
      dockerfile: grafana.Dockerfile
    image: homelab/grafana
    # Built here only: never pulled, so no registry image of that name can stand in.
    pull_policy: build
    restart: unless-stopped
    read_only: true
    # Its plugins' sockets, and the log file of the entrypoint's `grafana cli`.
    tmpfs:
      - /tmp
      - /var/log/grafana
    # Also checks its database.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # People use grafana.internal; only its proxy (stacks/internal-names) and the runner's load test use 5080.
    ports:
      - "100.100.146.119:5080:3000"
    mem_limit: 1g
    # Grafana applies its admin password only when it makes its database, so each start sets it from the secret.
    entrypoint:
      - sh
      - -c
      - grafana cli admin reset-admin-password --password-from-stdin < /run/secrets/grafana_admin_password && exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: colin
      # Still needed: it makes the login when the volume is new.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      # Encrypts the data sources' passwords in its volume, which provisioning writes again at each start, so a new key
      # needs nothing else; the default key is published.
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
      GF_SERVER_DOMAIN: grafana.internal
      GF_SERVER_ROOT_URL: http://grafana.internal
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # A snapshot or a public dashboard is read by its link alone, with no login; an external snapshot would also
      # publish a panel's data to the maker's public server.
      GF_SNAPSHOTS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # With no quota file, 13.3's dashboard browser asks for a quota on every visit and gets a 501, which it logs
      # as an error (grafana/grafana#136271); an empty one answers with the default limit, which nothing enforces.
      # Drop this and the file's mount once that is fixed.
      GF_UNIFIED_STORAGE_OVERRIDES_PATH: /etc/grafana/quota-overrides.yaml
      GF_LOG_LEVEL: warn
      GF_LOG_CONSOLE_FORMAT: json
      # Its plugins are in its image (grafana.Dockerfile).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Go grows its heap to twice what is live by default.
      GOMEMLIMIT: 400MiB
    # agents_password: read by the data sources' provisioning, for the gateway.
    secrets:
      - grafana_admin_password
      - grafana_secret_key
      - agents_password
    labels:
      homelab.config-hash: ${CONFIG_HASH_GRAFANA:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/quota-overrides.yaml:/etc/grafana/quota-overrides.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Shared with the gateway and grafana-users only, so no data source can reach a store directly.
    networks:
      - grafana
    depends_on:
      - gateway

  # Makes Grafana's agents login a Viewer with its password (grafana/users.py), then idles, healthy only if that
  # worked: `up --wait` fails the deploy on an unhealthy container, and one that exited would restart in a loop. A
  # restart applies again.
  grafana-users:
    image: python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    restart: unless-stopped
    command: ["sh", "-c", "python -I /users.py && touch /tmp/done; exec sleep infinity"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 32m
    environment:
      GRAFANA_ADMIN_USER: colin
    secrets:
      - grafana_admin_password
      - agents_password
    labels:
      homelab.config-hash: ${CONFIG_HASH_GRAFANA_USERS:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/done"]
      interval: 60s
      start_period: 110s
      start_interval: 2s
    tmpfs:
      - /tmp
    volumes:
      - ./grafana/users.py:/users.py:ro
      - ../telemetry/telemetry.py:/usr/local/lib/python3.15/site-packages/telemetry.py:ro
    networks:
      - grafana
    depends_on:
      - grafana

  # Sends Prometheus's alerts to the incidents relay, repeats, clears and holds them back
  # (alertmanager/alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # One instance: no peers to gossip with.
      - --cluster.listen-address=
      - --log.format=json
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    # No published port: its API takes silences and alerts without a login, so only Prometheus and the gateway reach
    # it (alerting); it reaches nothing outside, only the relay (incidents).
    labels:
      homelab.config-hash: ${CONFIG_HASH_ALERTMANAGER:-}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # What it has posted and its silences, so a restart does not post firing alerts again.
      - alertmanager-data:/alertmanager
    networks:
      - alerting
      - incidents
    # The relay first: an old relay given the watchdog would open a post for it.
    depends_on:
      - incidents

  # Gives each alert one #incidents post and starts the cloud on-call agent on it; passes the watchdog on to
  # Healthchecks.io (incidents/relay.py).
  incidents:
    image: python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    restart: unless-stopped
    command: ["python3", "-I", "/relay.py"]
    init: true
    # Root in the container, with no capabilities, so it may write its state to the root-owned volume.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    pids_limit: 32
    environment:
      INCIDENTS_FORUM: "1567861139142877295"
      DISCORD_GUILD: "1467218689245053010"
      # The claude.ai routine that runs the homelab-oncall skill on the alert it is given; empty starts none.
      ONCALL_ROUTINE: trig_012QtfdKg7fygsfKECcGZYPU
    secrets:
      - incidents_discord_bot_token
      - oncall_fire_token
      - healthchecks_ping
      # The gateway's read-only login, for an alert's first log line.
      - agents_password
    volumes:
      - ./incidents/relay.py:/relay.py:ro
      - ../telemetry/telemetry.py:/usr/local/lib/python3.15/site-packages/telemetry.py:ro
      # Which post each firing alert has, so a restart opens none again.
      - incidents-data:/state
    labels:
      homelab.config-hash: ${CONFIG_HASH_INCIDENTS:-}
    # Answered at all: a POST to / gets 404, which neither logs nor counts as a failed request; a GET's 501 would.
    healthcheck:
      test: ["CMD-SHELL", "wget -qS -O /dev/null --post-data '' http://127.0.0.1:8080/ 2>&1 | grep -q ' 404 '"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    # incidents: only Alertmanager reaches it; incidents-out: its way out to Discord, Anthropic and Healthchecks.io;
    # incidents-read: the gateway.
    networks:
      - incidents
      - incidents-out
      - incidents-read

  # How everyone but Prometheus's own rules reads the stores: each reader logs in with its own login and may read
  # only read paths (gateway/Caddyfile). Grafana and public stats on their own networks, agents on
  # Tailscale or, the on-call agent, through the tunnel.
  gateway:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/start.sh"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    # Twice its 30-day peak of 44 MiB.
    mem_limit: 96m
    ports:
      - "100.100.146.119:5081:5080"
    secrets:
      - stats_password
      - agents_password
    labels:
      homelab.config-hash: ${CONFIG_HASH_GATEWAY:-}
    # It has no open path: a request with no login gets its 403, without reaching a store.
    healthcheck:
      test: ["CMD-SHELL", "wget -qS -O /dev/null http://127.0.0.1:5080/ 2>&1 | grep -q ' 403 '"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    tmpfs:
      - /data:uid=65534,gid=65534
      - /config:uid=65534,gid=65534
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/start.sh:/etc/caddy/start.sh:ro
    # Reads the stores and Alertmanager; reached by Grafana and public stats on their own networks, and by the on-call
    # agent through the tunnel behind Cloudflare Access.
    networks:
      - stores
      - alerting
      - grafana
      - public-stats
      - read
      - incidents-read

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    mem_limit: 1g
    # Its image's own user, with no capabilities and no host folder but what it reads, so it can read no host file
    # that is not open to every user; in the journal's group on the Beelink (systemd-journal, 999).
    user: "473:473"
    group_add:
      - "999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >-
      run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data --disable-reporting
      /etc/alloy/config.alloy
    # The `instance` label on every series; a container ID would change on each recreate.
    hostname: beelink
    environment:
      ALLOY_DEPLOY_MODE: docker
      # Go grows its heap to twice what is live by default; this keeps it a little above what is live.
      GOMEMLIMIT: 192MiB
    labels:
      homelab.config-hash: ${CONFIG_HASH_ALLOY:-}
    tmpfs:
      - /tmp
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-state:/var/lib/alloy/data
      # Under /rootfs, where cAdvisor looks for the host's: its processes, for each container's network counters,
      # and which layer is each container's own (layer IDs only, open to all), without which it tracks none.
      - /proc:/rootfs/proc:ro
      - /var/lib/docker/image/overlay2/layerdb/mounts:/rootfs/var/lib/docker/image/overlay2/layerdb/mounts:ro
      # The disks' udev properties, open to all, which the host exporter adds to their series; without them it logs an
      # error at each start.
      - /run/udev/data:/run/udev/data:ro
      - /sys:/sys:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/lib/homelab-metrics:/var/lib/homelab-metrics:ro
    depends_on:
      - prometheus
      - logs
      - traces
      - docker-socket-proxy
    # Every network internal: the only writer to the stores (ingest), the Docker API, and programs' traces on
    # observability-otlp and the host's on host-otlp, neither of which reaches a store.
    networks:
      docker-api: {}
      ingest: {}
      otlp: {}
      # A fixed address for the host's programs (ci-runner/run-times/ci_times.py), which have no Docker DNS. They could already
      # write to Prometheus (host-writes), so this lets them do nothing new.
      host-otlp:
        ipv4_address: 10.201.0.10

  # Probes the flight tracker's public API (blackbox/blackbox.yml) for Prometheus, not Alloy: it probes any address
  # its caller names, so Alloy, which reads the journal, must not reach it.
  blackbox:
    image: prom/blackbox-exporter:v0.29.1-distroless@sha256:4d6d2d50ecabf3a0b10e8f6f5c4b14fc0c2326dcc2f7fe161668de722d5bf61e
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml", "--log.format=json"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 64m
    labels:
      homelab.config-hash: ${CONFIG_HASH_BLACKBOX:-}
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Out to the internet (default); Prometheus scrapes it on probe.
    networks:
      - default
      - probe

  # Traces and request rate, errors and duration for every program in a container, with no change to them but the
  # trace in the flight tracker's log lines, by eBPF (OpenTelemetry's OBI; obi/obi.yaml). It needs the host's processes
  # and the kernel's tracing, so it runs privileged, and only when the `obi` profile is on (COMPOSE_PROFILES in
  # settings.env). Sends both to Alloy.
  obi:
    image: otel/ebpf-instrument:v1.0.0@sha256:a68d70e934260f72540f157ccf4fb4adfa38f11de060d7d905696dad6a3fca02
    profiles: [obi]
    restart: unless-stopped
    # It writes nothing to its own files (`docker diff` showed only its config's mount point); its maps live in the
    # kernel.
    read_only: true
    privileged: true
    pid: host
    # It holds about 150 MiB, most of it its maps' kernel memory, but reading every program at start reached the old
    # 512 MiB limit and was killed twice: 1g is a guess above that, not a measured need.
    mem_limit: 1g
    environment:
      OTEL_EBPF_CONFIG_PATH: /etc/obi/obi.yaml
      OTEL_EBPF_LOG_FORMAT: json
      # Request rate, errors and duration per service. Not `application_service_graph`: with no Kubernetes to name a
      # peer's address, most callers were `incoming`, while the spans, linked across services, name them.
      OTEL_EBPF_METRICS_FEATURES: application
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Calls on this host already link (OBI sees both ends), except some it misses, such as the gateway's to
      # Alertmanager: those get a `traceparent` header. Plain HTTP only; TLS is unchanged.
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: headers
      # Which container each program is in, and its Compose service.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    labels:
      homelab.config-hash: ${CONFIG_HASH_OBI:-}
    volumes:
      - ./obi/obi.yaml:/etc/obi/obi.yaml:ro
      # The host's cgroups, where it attaches the header writer; its own namespace shows only its own. Kernels from
      # 6.6.128, 6.12.75 and 6.18.14 also turn the writer off without the tracing folder.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    networks:
      - otlp
      - docker-api
    # With no Docker API at start it matches nothing.
    depends_on:
      - docker-socket-proxy

  # Read-only Docker API for Alloy and OBI; a raw socket mount would be root-equivalent.
  docker-socket-proxy:
    image: linuxserver/socket-proxy:3.4.6-r0-ls100@sha256:0357c479cc98e863917d1cd8b10e83d35a50ca46a0788f5a192bf792c3b7100d
    restart: unless-stopped
    mem_limit: 64m
    # Not root: the socket's group (docker, 1001 on the Beelink) is all it needs.
    user: "65534:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run:uid=65534,gid=65534
    # Through to Docker; Alloy drops the log line of each answered one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    # What they ask for: container lists, inspects and events (cAdvisor, the log tailer and OBI need them), logs,
    # networks for discovery, info and version. An inspect shows every container's environment and labels, so no secret
    # goes in either (checks/no_secret_in_env_test.py); a container's files (archive, export) stay refused.
    environment:
      ALLOW_LOGS: 1
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  # Checks Home Assistant and the .internal names each minute (probes.py) for their alerts, and the blog's numbers' age.
  # On the host's network: the firewall admits only Tailscale and loopback, so from a Docker network the host's
  # services are out of reach.
  probes:
    image: python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    restart: unless-stopped
    command: ["python", "-I", "/probes.py"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 64m
    network_mode: host
    labels:
      homelab.config-hash: ${CONFIG_HASH_PROBES:-}
    # Its loop writes each minute. The file is on the host, so after a restart the last container's write passes for up
    # to 3 minutes.
    healthcheck:
      test: ["CMD-SHELL", "find /metrics/probes.prom -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 90s
      start_interval: 2s
    volumes:
      - ./probes.py:/probes.py:ro
      - ../telemetry/telemetry.py:/usr/local/lib/python3.15/site-packages/telemetry.py:ro
      # Read by Alloy's textfile collector.
      - /var/lib/homelab-metrics:/metrics

  # Scrapes what runs on the host's network or publishes only to loopback, Caddy, CoreDNS and Home Assistant
  # (host-metrics/prometheus.yml), and writes to Prometheus. On the host's network for the probes' reason; the host may
  # reach a container, so it writes to Prometheus's fixed address on host-writes.
  host-metrics:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --agent
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.agent.path=/agent
      # Its default, 9090, would be on the host's every address.
      - --web.listen-address=127.0.0.1:9095
      - --log.format=json
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    # It held 33 MiB; its write log, in memory, grows while Prometheus is away.
    mem_limit: 128m
    network_mode: host
    labels:
      homelab.config-hash: ${CONFIG_HASH_HOST_METRICS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9095/-/ready"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    secrets:
      - homeassistant_metrics_token
    tmpfs:
      - /agent:uid=65534,gid=65534,size=48m
    volumes:
      - ./host-metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - prometheus

  # Pushes a few numbers to the blog's home page; nothing connects in. See
  # docs/architecture.md, "Public stats" for what it publishes.
  public-stats:
    build:
      context: ./public-stats
    image: homelab/public-stats
    # Built here only: never pulled, since a registry image of that name
    # would run with the signing key.
    pull_policy: build
    restart: unless-stopped
    mem_limit: 64m
    command: ["python", "-I", "/public_stats.py"]
    # Passes SIGTERM on (docs/architecture.md, "Deploys").
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    environment:
      FLIGHTS_URL: https://api.colincheung.dev/aircraft
      PUBLIC_STATS_URL: https://colincheung.dev/homelab.json
      PUBLIC_STATS_KEY_FILE: /run/secrets/public_stats_key
      PROMETHEUS_URL: http://gateway:5080/prometheus
      PROMETHEUS_USER: stats@homelab.internal
      PROMETHEUS_PASSWORD_FILE: /run/secrets/stats_password
      # Each push's trace (telemetry.run).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    secrets:
      - public_stats_key
      - stats_password
    labels:
      homelab.config-hash: ${CONFIG_HASH_PUBLIC_STATS:-}
    healthcheck:
      # Healthy while pushes succeed: the heartbeat is under 15 minutes old.
      test: ["CMD-SHELL", "find /tmp/ready -mmin -15 | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 90s
      start_interval: 5s
    tmpfs:
      - /tmp
    volumes:
      - ./public-stats/public_stats.py:/public_stats.py:ro
      - ../telemetry/telemetry.py:/usr/local/lib/python3.15/site-packages/telemetry.py:ro
    # Its own network, shared with the gateway only, where its login reads one query; outbound, the
    # internet. otlp: Alloy, for its traces.
    networks:
      - public-stats
      - otlp
    depends_on:
      - gateway

networks:
  docker-api:
    internal: true
  # Alloy's writes to the stores.
  ingest:
    internal: true
  # The gateway's reads of the stores.
  stores:
    internal: true
  alerting:
    internal: true
  incidents:
    internal: true
  incidents-out:
  # The relay's reads of an alert's log lines, as the agents login, through the gateway.
  incidents-read:
    internal: true
  # The tunnel's way to the gateway, for the on-call agent; owned here, as otlp, so this stack deploys first.
  read:
    name: observability-read
    internal: true
  # Prometheus's scrape of the probe.
  probe:
    internal: true
  # Not internal: Grafana's port is published from it.
  grafana:
  public-stats:
  # For any stack's programs to send traces to Alloy at alloy:4318.
  otlp:
    name: observability-otlp
    internal: true
  # Prometheus, for host-metrics alone.
  host-writes:
    internal: true
    ipam:
      config:
        - subnet: 10.201.0.0/29
  # Alloy's OTLP receiver, for the host's programs alone.
  host-otlp:
    internal: true
    ipam:
      config:
        - subnet: 10.201.0.8/29

# Files on the Beelink, copied from Bitwarden (docs/recovery.md).
secrets:
  healthchecks_ping:
    file: ../../secrets/healthchecks_ping_url
  grafana_admin_password:
    file: ../../secrets/grafana_admin_password
  grafana_secret_key:
    file: ../../secrets/grafana_secret_key
  agents_password:
    file: ../../secrets/agents_password
  stats_password:
    file: ../../secrets/stats_password
  public_stats_key:
    file: ../../secrets/public_stats_key
  # Empty until it is made in Home Assistant: its scrape fails until then.
  homeassistant_metrics_token:
    file: ../../secrets/homeassistant_metrics_token
  incidents_discord_bot_token:
    file: ../../secrets/incidents_discord_bot_token
  oncall_fire_token:
    file: ../../secrets/oncall_fire_token

volumes:
  alloy-state:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  victorialogs-data:
  victoriatraces-data:
  incidents-data:

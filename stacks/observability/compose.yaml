services:
  # Metrics and the alert rules (prometheus/; docs/adr/0003-prometheus-grafana.md). Alloy writes to it.
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    # No published port: readers go through the gateway, since it serves admin calls beside its reads.
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    # Refused rules stop it at start, which fails the deploy's wait.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      start_period: 60s
      start_interval: 2s
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  # The log store and the trace store, each one of two picked in .env (LOG_STORE, TRACE_STORE; ADR 0003). Each
  # store's folder holds its service, its Alloy exporter, its gateway paths, its Grafana data source and, for logs,
  # the Home dashboard written in its query language; the services below mount the picked store's files.
  logs:
    extends:
      file: logs/${LOG_STORE:?}/compose.yaml
      service: logs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}

  traces:
    extends:
      file: traces/${TRACE_STORE:?}/compose.yaml
      service: traces
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}

  # Dashboards and Explore over every store, from Git (grafana/, logs/*/home.json). Anyone on Tailscale may view;
  # edits and admin need the admin password, and provisioned dashboards and data sources refuse edits even then.
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 5080, the address alert posts, bookmarks and grafana.internal use.
    ports:
      - "100.100.146.119:5080:3000"
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: http://beelink.tail4f465e.ts.net:5080
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # VictoriaLogs' data source, signed by its maker; unused while LOG_STORE is loki.
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.34.0
      # Go grows its heap to twice what is live by default.
      GOMEMLIMIT: 400MiB
      # Read by the data sources' provisioning, for the gateway.
      AGENTS_PASSWORD: ${AGENTS_PASSWORD:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./logs/${LOG_STORE:?}/datasource.yaml:/etc/grafana/provisioning/datasources/logs.yaml:ro
      - ./traces/${TRACE_STORE:?}/datasource.yaml:/etc/grafana/provisioning/datasources/traces.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./logs/${LOG_STORE:?}/home.json:/var/lib/grafana/dashboards/home.json:ro
    # Shared with the gateway only, so no data source can reach a store directly; outbound, its plugin download.
    networks:
      - grafana
    depends_on:
      - gateway

  # Posts Prometheus's alerts to Discord, repeats, clears and holds them back (alertmanager/alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # One instance: no peers to gossip with.
      - --cluster.listen-address=
    # Not read-only: Compose copies a secret from the environment into the container, which a read-only one refuses.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    # No published port: its API takes silences and alerts without a login. Prometheus and Alloy reach it here,
    # readers through the gateway.
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    secrets:
      - discord_webhook
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # What it has posted, so a restart does not post firing alerts again.
      - alertmanager-data:/alertmanager

  # How everyone but Prometheus's own rules reads the stores: each reader logs in with its own login and may read
  # only read paths (gateway/Caddyfile). Grafana and public stats on their own networks, server-health and agents
  # on Tailscale.
  gateway:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/start.sh"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 64m
    ports:
      - "100.100.146.119:5081:5080"
    environment:
      STATS_PASSWORD: ${STATS_PASSWORD:?}
      AGENTS_PASSWORD: ${AGENTS_PASSWORD:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    tmpfs:
      - /data:uid=65534,gid=65534
      - /config:uid=65534,gid=65534
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/start.sh:/etc/caddy/start.sh:ro
      - ./logs/${LOG_STORE:?}/gateway.caddy:/etc/caddy/logs.caddy:ro
      - ./traces/${TRACE_STORE:?}/gateway.caddy:/etc/caddy/traces.caddy:ro
    networks:
      - default
      - grafana
      - public-stats

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - FOWNER
    # The folder: config.alloy and the picked stores' exporters load as one configuration.
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy
    # The `instance` label on every series; a container ID would change on each recreate.
    hostname: beelink
    environment:
      ALLOY_DEPLOY_MODE: docker
      # Go grows its heap to twice what is live by default; this keeps it a little above what is live.
      GOMEMLIMIT: 192MiB
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs/${LOG_STORE:?}/alloy.alloy:/etc/alloy/logs.alloy:ro
      - ./traces/${TRACE_STORE:?}/alloy.alloy:/etc/alloy/traces.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/rootproc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /dev/disk:/dev/disk:ro
      - /var/lib/docker:/var/lib/docker:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/kmsg
    depends_on:
      - prometheus
      - logs
      - traces
      - docker-socket-proxy
    networks:
      - default
      - docker-api

  # Read-only Docker API for Alloy; a raw socket mount would be root-equivalent.
  docker-socket-proxy:
    image: linuxserver/socket-proxy:3.4.6-r0-ls100@sha256:0357c479cc98e863917d1cd8b10e83d35a50ca46a0788f5a192bf792c3b7100d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
    environment:
      ALLOW_LOGS: 1
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Only Alloy can reach it: container inspect shows every container's
    # environment, secrets included.
    networks:
      - docker-api

  # Checks Home Assistant and the .internal names each minute (probes.py) for their alerts. On the host's network: the
  # firewall admits only Tailscale and loopback, so from a Docker network the host's services are out of reach.
  probes:
    image: python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
    restart: unless-stopped
    command: ["python", "-I", "/probes.py"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 32m
    network_mode: host
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - ./probes.py:/probes.py:ro
      # Read by Alloy's textfile collector.
      - /var/lib/homelab-metrics:/metrics

  # Pushes a few numbers to the blog's home page; nothing connects in. See
  # docs/public-stats.md for what it publishes.
  public-stats:
    build:
      context: .
      dockerfile: public-stats.Dockerfile
    image: homelab/public-stats
    # Built here only: never pulled, since a registry image of that name
    # would run with the signing key.
    pull_policy: build
    restart: unless-stopped
    command: ["python", "-I", "/public_stats.py"]
    # Passes SIGTERM on (docs/runbooks/deploying-services.md, "Adding a stack").
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    environment:
      FLIGHTS_URL: https://api.colincheung.dev/aircraft
      PUBLIC_STATS_URL: https://colincheung.dev/homelab.json
      PUBLIC_STATS_KEY: ${PUBLIC_STATS_KEY:?}
      PROMETHEUS_URL: http://gateway:5080/prometheus
      PROMETHEUS_LOGIN: stats@homelab.internal:${STATS_PASSWORD:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    healthcheck:
      # Healthy while pushes succeed: the heartbeat is under 15 minutes old.
      test: ["CMD-SHELL", "find /tmp/ready -mmin -15 | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 90s
      start_interval: 5s
    tmpfs:
      - /tmp
    volumes:
      - ./public_stats.py:/public_stats.py:ro
    # Its own network, shared with the gateway only, where its login reads one query; outbound, the
    # internet.
    networks:
      - public-stats
    depends_on:
      - gateway

networks:
  docker-api:
    internal: true
  grafana:
  public-stats:

secrets:
  discord_webhook:
    environment: DISCORD_PRIVATE_WEBHOOK_URL

volumes:
  alloy-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  # The stores' own, declared here for their folders' compose.yaml; only the picked ones are made.
  loki-data:
  victorialogs-data:
  tempo-data:
  victoriatraces-data:

services:
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:3001:3000"
    labels:
      # Alert rules and contact points are only provisioned at startup.
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
      - GF_SERVER_ROOT_URL=http://100.100.146.119:3001
      - GF_USERS_DEFAULT_THEME=dark
      - GF_USERS_HOME_PAGE=/d/container-overview/container-overview
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Dashboards are readable without logging in; editing and admin still
      # need the password. Safe only because the port is bound to Tailscale.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - DISCORD_PRIVATE_WEBHOOK_URL=${DISCORD_PRIVATE_WEBHOOK_URL}
      - CLAUDE_ROUTINE_TOKEN=${CLAUDE_ROUTINE_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - prometheus-data:/prometheus
    networks:
      - default
      - public-stats

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/local-config.yaml
    labels:
      # Recreate when mounted config changes (set by scripts/deploy.py).
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - FOWNER
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      ALLOY_DEPLOY_MODE: docker
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/rootproc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /dev/disk:/dev/disk:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/kmsg
    depends_on:
      - prometheus
      - loki
      - docker-socket-proxy

  # Read-only Docker API for Alloy; a raw socket mount would be root-equivalent.
  docker-socket-proxy:
    image: linuxserver/socket-proxy:3.4.6-r0-ls100@sha256:0357c479cc98e863917d1cd8b10e83d35a50ca46a0788f5a192bf792c3b7100d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
    environment:
      ALLOW_LOGS: 1
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Pushes a few numbers to the blog's home page; nothing connects in. See
  # docs/public-stats.md for what it publishes.
  public-stats:
    build:
      context: .
      dockerfile: public-stats.Dockerfile
    image: homelab/public-stats
    # Built here only: never pulled, since a registry image of that name
    # would run with the signing key.
    pull_policy: build
    restart: unless-stopped
    command: ["python", "-I", "/public_stats.py"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    environment:
      FLIGHTS_URL: https://api.colincheung.dev/aircraft
      PUBLIC_STATS_URL: https://colincheung.dev/homelab.json
      PUBLIC_STATS_KEY: ${PUBLIC_STATS_KEY:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    healthcheck:
      # Healthy while pushes succeed: the heartbeat is under 15 minutes old.
      test: ["CMD-SHELL", "find /tmp/ready -mmin -15 | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 90s
      start_interval: 5s
    tmpfs:
      - /tmp
    volumes:
      - ./public_stats.py:/public_stats.py:ro
    # Its own network, shared with Prometheus only: it reaches Prometheus and,
    # outbound, the internet, but not Grafana, Loki or Alloy.
    networks:
      - public-stats
    depends_on:
      - prometheus

networks:
  public-stats:

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:

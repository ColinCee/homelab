services:
  # Metrics, logs and alerts (docs/adr/0001-openobserve.md).
  openobserve:
    image: openobserve/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:5080:5080"
    # A fast 6-day load peaked at 1548 MiB; the real rate holds about 750 MiB.
    mem_limit: 2g
    environment:
      ZO_ROOT_USER_EMAIL: root@homelab.internal
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?}
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: "30"
      # At its defaults it confirms writes before saving them, and a kill lost the last few seconds (ADR 0001).
      ZO_WAL_WRITE_QUEUE_ENABLED: "false"
      ZO_WAL_FSYNC_DISABLED: "false"
      # The trials' setup: a 512 MB cache, and the makers' flattening for performance.
      ZO_MEMORY_CACHE_MAX_SIZE: "512"
      ZO_INGEST_FLATTEN_LEVEL: "2"
      # Its memory table (a quarter of the 2 GiB) held 10 minutes of the host's metrics before writing them out, and
      # overflowed: refused writes. Two minutes fit.
      ZO_MAX_FILE_RETENTION_TIME: "120"
      # Its metric caches default to 128 MB and 100 MB; this small store needs far less.
      ZO_METRICS_BLOCKS_CACHE_MAX_SIZE: "32"
      ZO_METRICS_LABEL_CACHE_MAX_SIZE: "64"
      # Merged files wait this long for queries still reading them before they are deleted; the default is 2 h.
      ZO_COMPACT_DELETE_FILES_DELAY_MINUTES: "10"
      ZO_TELEMETRY: "false"
      # Alerts may post to Alertmanager by its name, and to the internet; any other private address is refused.
      ZO_SSRF_ALLOWED_HOSTS: alertmanager
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - openobserve-data:/data

  # Posts OpenObserve's alerts to Discord, repeats, clears and holds them back (alertmanager/alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # One instance: no peers to gossip with.
      - --cluster.listen-address=
    # Not read-only: Compose copies a secret from the environment into the container, which a read-only one refuses.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    # No published port: its API takes silences and alerts without a login. OpenObserve and Alloy reach it here.
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    secrets:
      - discord_webhook
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # What it has posted, so a restart does not post firing alerts again.
      - alertmanager-data:/alertmanager

  # How OpenObserve's readers reach it without root's login: each logs in here with its own and reads only its own
  # paths (gateway/Caddyfile). Public stats on their network, server-health and agents on Tailscale.
  openobserve-gateway:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/start.sh"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 64m
    ports:
      - "100.100.146.119:5081:5080"
    environment:
      OPENOBSERVE_ROOT_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?}
      OPENOBSERVE_STATS_PASSWORD: ${OPENOBSERVE_STATS_PASSWORD:?}
      OPENOBSERVE_AGENTS_PASSWORD: ${OPENOBSERVE_AGENTS_PASSWORD:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    tmpfs:
      - /data:uid=65534,gid=65534
      - /config:uid=65534,gid=65534
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/start.sh:/etc/caddy/start.sh:ro
    networks:
      - default
      - public-stats
    depends_on:
      - openobserve

  # Makes OpenObserve's alerts and dashboards match openobserve/, then idles: `up --wait` fails the deploy on a
  # container that exits, so a refused rule fails it and a finished run must not exit. A restart applies again.
  openobserve-apply:
    image: python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
    restart: unless-stopped
    command: ["sh", "-c", "python -I /apply/apply.py /apply/alerts.toml && touch /tmp/applied && exec sleep infinity"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 64m
    environment:
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/applied"]
      interval: 60s
      start_period: 110s
      start_interval: 2s
    tmpfs:
      - /tmp
    volumes:
      - ./openobserve:/apply:ro
    depends_on:
      - openobserve

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - FOWNER
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    # The `instance` label on every series; a container ID would change on each recreate.
    hostname: beelink
    environment:
      ALLOY_DEPLOY_MODE: docker
      # Go grows its heap to twice what is live by default; this keeps it a little above what is live.
      GOMEMLIMIT: 192MiB
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/rootproc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /dev/disk:/dev/disk:ro
      - /var/lib/docker:/var/lib/docker:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/kmsg
    depends_on:
      - openobserve
      - docker-socket-proxy
    networks:
      - default
      - docker-api

  # Read-only Docker API for Alloy; a raw socket mount would be root-equivalent.
  docker-socket-proxy:
    image: linuxserver/socket-proxy:3.4.6-r0-ls100@sha256:0357c479cc98e863917d1cd8b10e83d35a50ca46a0788f5a192bf792c3b7100d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
    environment:
      ALLOW_LOGS: 1
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Only Alloy can reach it: container inspect shows every container's
    # environment, secrets included.
    networks:
      - docker-api

  # Checks Home Assistant and the .internal names each minute (probes.py) for their alerts. On the host's network: the
  # firewall admits only Tailscale and loopback, so from a Docker network the host's services are out of reach.
  probes:
    image: python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
    restart: unless-stopped
    command: ["python", "-I", "/probes.py"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    mem_limit: 32m
    network_mode: host
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    volumes:
      - ./probes.py:/probes.py:ro
      # Read by Alloy's textfile collector.
      - /var/lib/homelab-metrics:/metrics

  # Pushes a few numbers to the blog's home page; nothing connects in. See
  # docs/public-stats.md for what it publishes.
  public-stats:
    build:
      context: .
      dockerfile: public-stats.Dockerfile
    image: homelab/public-stats
    # Built here only: never pulled, since a registry image of that name
    # would run with the signing key.
    pull_policy: build
    restart: unless-stopped
    command: ["python", "-I", "/public_stats.py"]
    # Passes SIGTERM on (docs/runbooks/deploying-services.md, "Adding a stack").
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    environment:
      FLIGHTS_URL: https://api.colincheung.dev/aircraft
      PUBLIC_STATS_URL: https://colincheung.dev/homelab.json
      PUBLIC_STATS_KEY: ${PUBLIC_STATS_KEY:?}
      PROMETHEUS_URL: http://openobserve-gateway:5080/api/default/prometheus
      PROMETHEUS_LOGIN: stats@homelab.internal:${OPENOBSERVE_STATS_PASSWORD:?}
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    healthcheck:
      # Healthy while pushes succeed: the heartbeat is under 15 minutes old.
      test: ["CMD-SHELL", "find /tmp/ready -mmin -15 | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 90s
      start_interval: 5s
    tmpfs:
      - /tmp
    volumes:
      - ./public_stats.py:/public_stats.py:ro
    # Its own network, shared with OpenObserve's gateway only, where its login reads one query; outbound, the
    # internet.
    networks:
      - public-stats
    depends_on:
      - openobserve-gateway

networks:
  docker-api:
    internal: true
  public-stats:

secrets:
  discord_webhook:
    environment: DISCORD_PRIVATE_WEBHOOK_URL

volumes:
  alloy-data:
  openobserve-data:
  alertmanager-data:

# Between OpenObserve's rules (../openobserve/alerts.toml) and Discord; the standard it keeps is in
# docs/observability.md ("Alerts"). OpenObserve posts each firing alert every minute with no end time.
global:
  # An alert ends this long after its last post. The 10-minute hold against flapping is in each rule's query
  # (openobserve/apply.py), so this only rides out a few missed evaluations, such as an OpenObserve restart.
  resolve_timeout: 5m

route:
  receiver: shadow
  # Every alert, and every series of a per-series rule, is its own post.
  group_by: ["..."]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 24h
  routes:
    - matchers: ['level="now"']
      repeat_interval: 4h

# Every other alert reads the Beelink's metrics through Alloy, so while they are missing only this one posts.
inhibit_rules:
  - source_matchers: ['alertname="beelink-metrics-stopped"']
    target_matchers: ['alertname!="beelink-metrics-stopped"']

receivers:
  # Takes alerts and posts nothing.
  - name: shadow
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook
        send_resolved: true
        title: '{{ template "homelab.title" . }}'
        message: '{{ template "homelab.message" . }}'
        content: '{{ template "homelab.mention" . }}'

templates:
  - /etc/alertmanager/discord.tmpl

# Between Prometheus's rules (../prometheus/rules.yml, slos.rules.yml) and the relay (../incidents/relay.py), which gives each alert
# one #incidents post; the standard it keeps is in docs/architecture.md ("Monitoring and alerts"). Prometheus sends
# each firing alert with an end time, and its end when it clears.

route:
  receiver: incidents
  # Every alert, and every series of a per-series rule, is its own post.
  group_by: ["..."]
  group_wait: 30s
  group_interval: 1m
  # A repeat posts nothing; it tells the relay the alert still fires (relay.py, FORGET_AFTER).
  repeat_interval: 24h
  routes:
    # The relay passes it to Healthchecks.io as a ping, so the pings stop when the relay does.
    - matchers: ['alertname="watchdog"']
      group_wait: 0s
      group_interval: 1m
      # Under group_interval, so every flush pings: an equal one skips every other.
      repeat_interval: 30s

# Every other alert reads the Beelink's metrics through Alloy, so while they are missing only this one posts; the
# rules on Prometheus's own health and the public probes read its own scrape, so they still post.
inhibit_rules:
  - source_matchers: ['alertname="beelink-metrics-stopped"']
    target_matchers: ['alertname!~"beelink-metrics-stopped|Prometheus.+|flight-tracker-down|site-down|watchdog"']

receivers:
  - name: incidents
    webhook_configs:
      - url: http://incidents:8080/alert
        send_resolved: true

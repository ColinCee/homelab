# Between Prometheus's rules (../prometheus/rules.yml) and Discord; the standard it keeps is in
# docs/observability.md ("Alerts"). Prometheus sends each firing alert with an end time, and its end when it clears.

route:
  receiver: discord
  # Every alert, and every series of a per-series rule, is its own post.
  group_by: ["..."]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 24h
  routes:
    - matchers: ['level="now"']
      repeat_interval: 4h
    # A deploy or an install is an event, not a state: one post, and no "Cleared".
    - matchers: ['level="notice"']
      receiver: discord-notice

# Every other alert reads the Beelink's metrics through Alloy, so while they are missing only this one posts; the
# rules on Prometheus's own health and the flight tracker's probe read its own scrape, so they still post.
inhibit_rules:
  - source_matchers: ['alertname="beelink-metrics-stopped"']
    target_matchers: ['alertname!~"beelink-metrics-stopped|Prometheus.+|flight-tracker-down"']

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook
        send_resolved: true
        title: '{{ template "homelab.title" . }}'
        message: '{{ template "homelab.message" . }}'
        content: '{{ template "homelab.mention" . }}'
  - name: discord-notice
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook
        send_resolved: false
        title: '{{ template "homelab.title" . }}'
        message: '{{ template "homelab.message" . }}'

templates:
  - /etc/alertmanager/discord.tmpl

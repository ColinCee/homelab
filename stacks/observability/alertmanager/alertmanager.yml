# Between Prometheus's rules (../prometheus/rules.yml) and the on-call agent, which reads the firing alerts from its
# API and posts each to Discord (docs/architecture.md, "On-call agent"); the standard it keeps is in
# docs/architecture.md ("Monitoring and alerts").

route:
  receiver: oncall
  routes:
    # Never posts: a ping each minute, and Healthchecks.io posts to Discord when they stop.
    - matchers: ['alertname="watchdog"']
      receiver: healthchecks
      group_wait: 0s
      group_interval: 1m
      # Under group_interval, so every flush pings: an equal one skips every other.
      repeat_interval: 30s

# Every other alert reads the Beelink's metrics through Alloy, so while they are missing only this one fires; the
# rules on Prometheus's own health and the public probes read its own scrape, so they still fire.
inhibit_rules:
  - source_matchers: ['alertname="beelink-metrics-stopped"']
    target_matchers: ['alertname!~"beelink-metrics-stopped|Prometheus.+|flight-tracker-down|site-down|watchdog"']

receivers:
  # Sends nothing: the on-call agent polls the firing alerts.
  - name: oncall
  - name: healthchecks
    webhook_configs:
      - url_file: /run/secrets/healthchecks_ping
        send_resolved: false

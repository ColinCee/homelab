# Grafana reads VictoriaLogs through the gateway, never directly: Grafana passes every method and path to a plugin's
# store. The plugin is installed by compose.yaml (grafana, GF_PLUGINS_PREINSTALL_SYNC).
apiVersion: 1
datasources:
  - name: Logs
    uid: logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://gateway:5080/logs
    basicAuth: true
    basicAuthUser: agents@homelab.internal
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/agents_password}
    editable: false
    jsonData:
      # A line's trace opens in the trace store. `$$` keeps provisioning from expanding Grafana's own variable.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: $${__value.raw}
          datasourceUid: traces
          urlDisplayLabel: View trace

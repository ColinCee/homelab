# Grafana reads Loki through the gateway, never directly: Grafana lets a Viewer's GET through to any path.
apiVersion: 1
datasources:
  - name: Logs
    uid: logs
    type: loki
    access: proxy
    url: http://gateway:5080/logs
    basicAuth: true
    basicAuthUser: agents@homelab.internal
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/agents_password}
    editable: false
    jsonData:
      manageAlerts: false
      # A line's trace opens in the trace store. `$$` keeps provisioning from expanding Grafana's own variable.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: $${__value.raw}
          datasourceUid: traces
          urlDisplayLabel: View trace

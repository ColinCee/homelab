# The log store when LOG_STORE=loki (../../.env.example); ../../compose.yaml runs it as `logs`.
services:
  logs:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

volumes:
  loki-data:

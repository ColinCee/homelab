# One Loki for everything, on local disk, keeping 30 days. Settings beyond the defaults:
# https://grafana.com/docs/loki/latest/configure/
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: "2020-05-15"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        # Retention needs a 24 h index period.
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  filesystem:
    directory: /loki/chunks
limits_config:
  retention_period: 30d
  # One heavy query must not take its memory: a minute each, at most a month back, two at a time (querier).
  query_timeout: 1m
  max_query_length: 31d
  allow_structured_metadata: true
  volume_enabled: true
  # Alloy's OTLP sends each line's labels as attributes of the line, not of its resource, and Loki indexes only
  # resource attributes by default: without this every line lands in one stream.
  otlp_config:
    log_attributes:
      - action: index_label
        attributes: [container_name]
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
querier:
  max_concurrent: 2

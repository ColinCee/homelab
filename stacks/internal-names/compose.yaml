# Tailscale sends .internal lookups to dns: a custom nameserver in its admin console (notes, network.md).
services:
  dns:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    command: ["-conf", "/etc/coredns/Corefile"]
    ports:
      - "100.100.146.119:53:53/udp"
      - "100.100.146.119:53:53/tcp"
      - "127.0.0.1:9153:9153"
    labels:
      homelab.config-hash: ${CONFIG_HASH_DNS:-}
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro

  proxy:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    # Its lock, instance id and autosaved config; no certificates, as auto_https is off.
    tmpfs:
      - /data
      - /config
    # Its metrics site (Caddyfile), served by the same Caddy as the names.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/metrics"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    # On the host network, Docker's default NET_RAW would let it capture the host's traffic;
    # binding port 80 is all it needs.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Host networking, so the proxy can reach Home Assistant on loopback (see Caddyfile).
    network_mode: host
    labels:
      homelab.config-hash: ${CONFIG_HASH_PROXY:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

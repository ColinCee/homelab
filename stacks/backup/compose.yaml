services:
  # Nightly encrypted restic backup of state that is not in Git. See
  # docs/architecture.md, "Backups", for what is covered; docs/recovery.md to restore.
  backup:
    container_name: backup
    hostname: beelink
    build:
      context: .
      dockerfile: backup.Dockerfile
    image: homelab/backup
    # Built here only: never pulled, so no registry image of that name can stand in.
    pull_policy: build
    restart: unless-stopped
    mem_limit: 512m
    entrypoint: ["python3", "-I", "/backup.py"]
    # Passes SIGTERM on (docs/architecture.md, "Deploys").
    init: true
    command: ["loop"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH # Read sources owned by other container users
    environment:
      TZ: Etc/UTC
      BACKUP_TIME: "02:30"
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      # Written by backup.py at start from the R2 secrets, so a `docker exec backup restic ...` finds them too.
      RESTIC_REPOSITORY_FILE: /tmp/restic_repository
      AWS_SHARED_CREDENTIALS_FILE: /tmp/r2_credentials
      RESTIC_CACHE_DIR: /cache
    secrets:
      - restic_password
      - r2_account_id
      - r2_access_key_id
      - r2_secret_access_key
    labels:
      homelab.config-hash: ${CONFIG_HASH_BACKUP:-}
    healthcheck:
      # Ready once the repository is reachable with the supplied credentials.
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    tmpfs:
      - /tmp
    volumes:
      - ./backup.py:/backup.py:ro
      - ../telemetry/telemetry.py:/usr/local/lib/python3.15/site-packages/telemetry.py:ro
      - restic-cache:/cache
      # Read by Alloy's textfile collector (observability stack).
      - /var/lib/homelab-metrics:/metrics
      - ../home-assistant/config:/data/home-assistant:ro
      - heatmap-data:/data/flight-tracker:ro
      # What other machines sent with Taildrop (systemd/backup-pc-receive.*; docs/architecture.md, "Backups").
      - /home/colin/pc-backups:/data/pc-backups:ro

# Files on the Beelink, copied from Bitwarden (docs/recovery.md).
secrets:
  restic_password:
    file: ../../secrets/restic_password
  r2_account_id:
    file: ../../secrets/r2_account_id
  # An R2 token scoped to the bucket.
  r2_access_key_id:
    file: ../../secrets/r2_access_key_id
  r2_secret_access_key:
    file: ../../secrets/r2_secret_access_key

volumes:
  restic-cache:
  # Owned by other stacks; deploy those first on a fresh host.
  heatmap-data:
    external: true
    name: flight-tracker_heatmap-data

services:
  # Nightly encrypted restic backup of state that is not in Git. See
  # docs/runbooks/backups.md for what is covered and how to restore.
  backup:
    container_name: backup
    hostname: beelink
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Passes SIGTERM on (docs/runbooks/deploying-services.md, "Adding a stack").
    init: true
    command: ["loop"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH # Read sources owned by other container users
    environment:
      TZ: Etc/UTC
      BACKUP_TIME: "02:30"
      RESTIC_REPOSITORY_FILE: /run/secrets/restic_repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/r2_credentials
      RESTIC_CACHE_DIR: /cache
    secrets:
      - restic_repository
      - restic_password
      - r2_credentials
    labels:
      homelab.config-hash: ${STACK_CONFIG_HASH:-}
    healthcheck:
      # Ready once the repository is reachable with the supplied credentials.
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    tmpfs:
      - /tmp
    volumes:
      - ./backup.sh:/backup.sh:ro
      - restic-cache:/cache
      # Read by Alloy's textfile collector (observability stack).
      - /var/lib/homelab-metrics:/metrics
      - ../home-assistant/config:/data/home-assistant:ro
      - heatmap-data:/data/flight-tracker:ro
      # What other machines sent with Taildrop (systemd/backup-pc-receive.*; docs/runbooks/backups.md).
      - /home/colin/pc-backups:/data/pc-backups:ro

# Rendered by scripts/generate-env.sh from secrets/*.example.
secrets:
  restic_repository:
    file: ./secrets/restic_repository
  restic_password:
    file: ./secrets/restic_password
  r2_credentials:
    file: ./secrets/r2_credentials

volumes:
  restic-cache:
  # Owned by other stacks; deploy those first on a fresh host.
  heatmap-data:
    external: true
    name: flight-tracker_heatmap-data

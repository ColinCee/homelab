services:
  board:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:b5d836aa423212932974349330405d241a4714005471004c71cc6ace9ddd3837
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - board-data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  board-data:

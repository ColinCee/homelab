services:
  board:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:eccf492601e9f3ea0031d6ddef439694ebaef2ff4478a9e898d2d442a6c116fb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - board-data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  board-data:

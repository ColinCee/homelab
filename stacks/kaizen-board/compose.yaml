services:
  board:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:31509f14866d326d6832f38e6d927fab0b41b17f59db8ef07aa6d8021336b20d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - board-data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  board-data:

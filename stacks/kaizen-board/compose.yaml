services:
  board:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:7dfbe05ef7dc13006b55cc0dc18f1086be09de5f5f27b25a016aac8365b57463
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - board-data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  board-data:

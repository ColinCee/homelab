services:
  board:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:ae6eaf9c0dc2daef3a3a3a93d53b0b74c25b8f15cf3e9d4b5c38697b8c21398b
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - board-data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  board-data:

services:
  board:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:9565f495b815946570b17fc775b6ca3be35f97bff040c329298ddfd77e8771b1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - board-data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  board-data:

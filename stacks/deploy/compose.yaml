# The doorbell GitHub's push webhook rings through the tunnel; deploy-main (systemd/) does the deploy
# (docs/architecture.md, "Deploys").
services:
  doorbell:
    image: python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    restart: unless-stopped
    command: ["python3", "-I", "/doorbell.py"]
    # Passes SIGTERM on (docs/architecture.md, "Deploys").
    init: true
    # Root in the container, with no capabilities: Docker creates the ring folder root-owned on first deploy,
    # before deploy-main's units exist, and only root may write to it. Do not create it by hand: owned by colin,
    # root without capabilities cannot write there, and every ring answers 500.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # A public endpoint: a flood of slow clients cannot take the host's memory or processes.
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - ./doorbell.py:/doorbell.py:ro
      - ../telemetry/telemetry.py:/usr/local/lib/python3.15/site-packages/telemetry.py:ro
      - /home/colin/.local/state/homelab/ring:/ring
    labels:
      homelab.config-hash: ${CONFIG_HASH_DOORBELL:-}
    # Answered at all: a POST to / gets 404 (one log line a minute); /ring would deploy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qS -O /dev/null --post-data '' http://127.0.0.1:8080/ 2>&1 | grep -q ' 404 '"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    # Only the tunnel's network, which has no way out: deploy.colincheung.dev/ring reaches it as doorbell:8080.
    networks:
      - tunnel

networks:
  # Owned by the tunnel stack.
  tunnel:
    external: true

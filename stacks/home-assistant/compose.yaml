services:
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          from urllib.request import urlopen; import sys;
          sys.exit(0 if urlopen('http://localhost:8123/', timeout=5).status < 400 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/London
    restart: unless-stopped
    mem_limit: 1536m
    # Bluetooth is off: no D-Bus mount, no NET_ADMIN, and NET_RAW (a Docker
    # default) dropped, so on the host network it can neither change the
    # firewall nor capture other containers' traffic. Add them back only if
    # Bluetooth devices are wanted.
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    # mDNS and other local discovery.
    network_mode: host

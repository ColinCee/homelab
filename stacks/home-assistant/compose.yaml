services:
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          from urllib.request import urlopen; import sys;
          sys.exit(0 if urlopen('http://localhost:8123/', timeout=5).status < 400 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/London
    restart: unless-stopped
    mem_limit: 1536m
    # Bluetooth is off: no D-Bus mount, no NET_ADMIN, and NET_RAW (a Docker
    # default) dropped, so on the host network it can neither change the
    # firewall nor capture other containers' traffic. Add them back only if
    # Bluetooth devices are wanted.
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    # mDNS and other local discovery.
    network_mode: host

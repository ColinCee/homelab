services:
  backend:
    image: ghcr.io/colincee/flight-tracker-at-home/backend:latest@sha256:08d07a7ddf287f9942a992bd4393438c205b09326cc75df9296eb262336a6828
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - heatmap-data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://flight-tracker-at-home.pages.dev}
      - CACHE_TTL=${CACHE_TTL:-10}
      - HEATMAP_DB_PATH=/app/data/historical_heatmap.parquet

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: tunnel run --token ${TUNNEL_TOKEN:?}
    depends_on:
      - backend

volumes:
  heatmap-data:

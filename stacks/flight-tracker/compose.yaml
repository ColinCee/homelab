services:
  backend:
    image: ghcr.io/colincee/flight-tracker-at-home/backend:latest@sha256:e6e77ec026ed3487327edf8d30ad44776821d26684d5ab57f1143d2ab1abf4ea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - heatmap-data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://flight-tracker-at-home.pages.dev}
      - CACHE_TTL=${CACHE_TTL:-10}
      - HEATMAP_DB_PATH=/app/data/historical_heatmap.parquet

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The token is read from a file, so it stays out of the process list and
    # docker inspect.
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      - backend

secrets:
  tunnel_token:
    environment: TUNNEL_TOKEN

volumes:
  heatmap-data:

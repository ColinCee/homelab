services:
  backend:
    image: ghcr.io/colincee/flight-tracker-at-home/backend:latest@sha256:4f6fe2c1ca96ca49b56e5120a79b51ffc957b76a863150ae2992aa282f05e943
    restart: unless-stopped
    # Its new container serves before the old one stops (stacks/deploy/deploy.py, START_FIRST), so a
    # deploy fails no request through the tunnel.
    labels:
      homelab.deploy: start-first
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=5)
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    read_only: true
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - heatmap-data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://flight-tracker-at-home.pages.dev}
      - CACHE_TTL=${CACHE_TTL:-10}
      - HEATMAP_DB_PATH=/app/data/historical_heatmap.parquet
    # default: its way out to the flight data it serves; tunnel: api.colincheung.dev reaches it as backend:8000.
    networks:
      - default
      - tunnel

networks:
  # Owned by the tunnel stack.
  tunnel:
    external: true

volumes:
  heatmap-data:

services:
  backend:
    image: ghcr.io/colincee/flight-tracker-at-home/backend:latest@sha256:73a28916cfe76d09663942d31fafaa26c864e64050718c3acdf88fb7189bba11
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - heatmap-data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://flight-tracker-at-home.pages.dev}
      - CACHE_TTL=${CACHE_TTL:-10}
      - HEATMAP_DB_PATH=/app/data/historical_heatmap.parquet

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Its metrics for the observability stack's Alloy, which reaches it on observability-otlp.
    command: ["tunnel", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    labels:
      homelab.config-hash: ${CONFIG_HASH_CLOUDFLARED:-}
    depends_on:
      - backend
    # deploy-doorbell: the tunnel also carries GitHub's ring to the deploy stack's doorbell.
    networks:
      - default
      - observability-otlp
      - deploy-doorbell

# Written from GitHub secrets by scripts/render-secrets.sh.
secrets:
  tunnel_token:
    file: ../../secrets/cf_tunnel_token

networks:
  # Owned by the observability stack; deploy it first on a fresh host.
  observability-otlp:
    external: true
  # Owned by the deploy stack.
  deploy-doorbell:
    external: true

volumes:
  heatmap-data:

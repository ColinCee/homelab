services:
  backend:
    image: ghcr.io/colincee/flight-tracker-at-home/backend:latest@sha256:e4b4a5565775949e077f6cd84c6b45f5003fed0d7d4655cd776407c5f6d99f98
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - heatmap-data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://flight-tracker-at-home.pages.dev}
      - CACHE_TTL=${CACHE_TTL:-10}
      - HEATMAP_DB_PATH=/app/data/historical_heatmap.parquet

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: tunnel run --token ${TUNNEL_TOKEN:?}
    depends_on:
      - backend

volumes:
  heatmap-data:

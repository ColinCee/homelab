services:
  backend:
    image: ghcr.io/colincee/flight-tracker-at-home/backend:latest@sha256:73a28916cfe76d09663942d31fafaa26c864e64050718c3acdf88fb7189bba11
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - heatmap-data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://flight-tracker-at-home.pages.dev}
      - CACHE_TTL=${CACHE_TTL:-10}
      - HEATMAP_DB_PATH=/app/data/historical_heatmap.parquet
    # default: its way out to the flight data it serves; tunnel: api.colincheung.dev reaches it as backend:8000.
    networks:
      - default
      - tunnel

networks:
  # Owned by the tunnel stack.
  tunnel:
    external: true

volumes:
  heatmap-data:

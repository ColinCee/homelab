services:
  control-room:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:ee15bde23b0e8eb7a9e9c7a82c30f1d387126a44c58a6a6e847798db804dfd1e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
      # The CI runner's status file (docs/runbooks/ci-runner.md); empty until the
      # supervisor writes it.
      - /var/lib/homelab-ci/status:/machines:ro
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_MACHINES_FILE: /machines/machines.json
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  data:
    name: kaizen-control-room_data

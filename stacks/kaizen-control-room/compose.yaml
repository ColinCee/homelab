services:
  control-room:
    image: ghcr.io/colincee/kaizen-control-room:latest@sha256:8f3d1f6574f87e04fa4b522bc713aab26310ebba66a611a61875902f6fdf8994
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
      # The CI runner's status file (docs/runbooks/ci-runner.md); empty until the
      # supervisor writes it.
      - /var/lib/homelab-ci/status:/machines:ro
      # What Kaizen's runs hand on (the handoff action, docs/runbooks/ci-runner.md): held changes, asks'
      # pictures, the factory manager's answers.
      - /var/lib/homelab-ci/handoff/ColinCee__auto-kaizen:/handoffs:ro
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_MACHINES_FILE: /machines/machines.json
      KAIZEN_HANDOFFS: /handoffs
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
      # Grafana's and OpenObserve's alerts come in with this secret (auto-kaizen src/kaizen/board/alert_source.py).
      KAIZEN_ALERT_SECRET_FILE: /run/secrets/kaizen_alert_secret
      # The auto-kaizen Discord bot keeps one post per alert in the #alerts forum, and mentions Colin only when he must act.
      KAIZEN_DISCORD_TOKEN_FILE: /run/secrets/kaizen_discord_token
      KAIZEN_ALERTS_FORUM: "1567861139142877295"
      KAIZEN_DISCORD_COLIN: "124131392207454208"
      # The rules firing now, read each minute to find a lost resolve (auto-kaizen src/kaizen/board/alert_source.py).
      KAIZEN_ALERTS_FIRING_URL: http://100.100.146.119:3001/api/prometheus/grafana/api/v1/alerts
      # Number alerts' charts, from Prometheus over the network below (auto-kaizen src/kaizen/discord/chart.py).
      KAIZEN_PROMETHEUS: http://prometheus:9090
      # OpenObserve through its read-only gateway, over the network below: its alert list and a rule's extra numbers
      # (auto-kaizen src/kaizen/board/alert_source.py; the shadow's until the cutover).
      KAIZEN_OPENOBSERVE: http://openobserve-gateway:5080
      KAIZEN_OPENOBSERVE_LOGIN_FILE: /run/secrets/kaizen_openobserve_login
    secrets:
      - kaizen_app_key
      - kaizen_alert_secret
      - kaizen_discord_token
      - kaizen_openobserve_login

    networks:
      - default
      - kaizen-prometheus

# Shared with the observability stack's Prometheus, OpenObserve and its gateway, which join it. Made here, as this
# stack deploys first.
networks:
  kaizen-prometheus:
    name: kaizen-prometheus

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY
  kaizen_alert_secret:
    environment: KAIZEN_ALERT_SECRET
  kaizen_discord_token:
    environment: KAIZEN_DISCORD_TOKEN
  kaizen_openobserve_login:
    environment: KAIZEN_OPENOBSERVE_LOGIN

volumes:
  data:
    name: kaizen-control-room_data

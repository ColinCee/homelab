services:
  control-room:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:006ab5dbe4ff8aaa5d716b1e4ad00d0ac4c1664ef5ce9427e8e34baba9cba226
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  data:
    name: kaizen-control-room_data

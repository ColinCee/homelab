services:
  control-room:
    image: ghcr.io/colincee/kaizen-control-room:latest@sha256:0346c1bc229488df76dba106f288904bc11ccfae792d9ce0479e2aab95e2b024
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
      # The CI runner's status file (docs/runbooks/ci-runner.md); empty until the
      # supervisor writes it.
      - /var/lib/homelab-ci/status:/machines:ro
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_MACHINES_FILE: /machines/machines.json
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
      # Grafana's alerts come in on /alert with this secret (auto-kaizen src/kaizen/alert.py).
      KAIZEN_ALERT_SECRET_FILE: /run/secrets/kaizen_alert_secret
      # The auto-kaizen Discord bot keeps one post per alert in the #alerts forum, and mentions Colin only when he must act.
      KAIZEN_DISCORD_TOKEN_FILE: /run/secrets/kaizen_discord_token
      KAIZEN_ALERTS_FORUM: "1567861139142877295"
      KAIZEN_DISCORD_COLIN: "124131392207454208"
    secrets:
      - kaizen_app_key
      - kaizen_alert_secret
      - kaizen_discord_token

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY
  kaizen_alert_secret:
    environment: KAIZEN_ALERT_SECRET
  kaizen_discord_token:
    environment: KAIZEN_DISCORD_TOKEN

volumes:
  data:
    name: kaizen-control-room_data

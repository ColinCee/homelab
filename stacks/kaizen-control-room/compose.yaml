services:
  control-room:
    image: ghcr.io/colincee/kaizen-control-room:latest@sha256:ac0e51c22b13175a7a737ea48f53131d0c5a1f774b3135e04e80a7ae846cae4a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
      # The CI runner's status file (docs/runbooks/ci-runner.md); empty until the
      # supervisor writes it.
      - /var/lib/homelab-ci/status:/machines:ro
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_MACHINES_FILE: /machines/machines.json
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
      # Grafana's alerts come in on /alert with this secret (auto-kaizen src/kaizen/alert.py).
      KAIZEN_ALERT_SECRET_FILE: /run/secrets/kaizen_alert_secret
    secrets:
      - kaizen_app_key
      - kaizen_alert_secret

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY
  kaizen_alert_secret:
    environment: KAIZEN_ALERT_SECRET

volumes:
  data:
    name: kaizen-control-room_data

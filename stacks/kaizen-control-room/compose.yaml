services:
  control-room:
    image: ghcr.io/colincee/kaizen-control-room:latest@sha256:33fe13b8252ffe5d9e12fcd01cf9fead3399d65e06cfc220cc207f8c9db09994
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  data:
    name: kaizen-control-room_data

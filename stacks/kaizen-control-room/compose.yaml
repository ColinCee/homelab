services:
  control-room:
    image: ghcr.io/colincee/kaizen-board:latest@sha256:75e660f77c489a013b55a3caf74f5938925537e36ad0f52b577c1009227e3cd1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  data:
    name: kaizen-control-room_data

services:
  control-room:
    image: ghcr.io/colincee/kaizen-control-room:latest@sha256:a440119643aa609766017b17e6cdde165b8890d94cb22f4ededbd928083e98df
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
      # The CI runner's status file (docs/runbooks/ci-runner.md); empty until the
      # supervisor writes it.
      - /var/lib/homelab-ci/status:/machines:ro
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_MACHINES_FILE: /machines/machines.json
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
      # Grafana's alerts come in on /alert with this secret (auto-kaizen src/kaizen/alert.py).
      KAIZEN_ALERT_SECRET_FILE: /run/secrets/kaizen_alert_secret
      # Kaizen says in Discord, next to Grafana's alert, that it picked the alert up, or that no answer came.
      KAIZEN_DISCORD_FILE: /run/secrets/kaizen_discord
    secrets:
      - kaizen_app_key
      - kaizen_alert_secret
      - kaizen_discord

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY
  kaizen_alert_secret:
    environment: KAIZEN_ALERT_SECRET
  kaizen_discord:
    environment: DISCORD_PRIVATE_WEBHOOK_URL

volumes:
  data:
    name: kaizen-control-room_data

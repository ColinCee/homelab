services:
  control-room:
    image: ghcr.io/colincee/kaizen-control-room:latest@sha256:d0cde9ccddc731771c32d60c831d88f4cae12b263c63ded3dddcce4d0e16984a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.100.146.119:8090:8090"
    volumes:
      - data:/data
    environment:
      KAIZEN_APP_ID: ${KAIZEN_APP_ID:?}
      KAIZEN_APP_KEY_FILE: /run/secrets/kaizen_app_key
    secrets:
      - kaizen_app_key

secrets:
  kaizen_app_key:
    environment: KAIZEN_APP_KEY

volumes:
  data:
    name: kaizen-control-room_data

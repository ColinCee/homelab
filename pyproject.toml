[project]
name = "homelab"
version = "0.1.0"
description = "Infrastructure-as-code and tooling for Colin's homelab"
readme = "README.md"
authors = [
    { name = "Colin Cheung", email = "11246116+ColinCee@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "pytest>=8",
    "ruff>=0.11",
    "ty>=0.0.1",
    "yamllint>=1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# EXE: a #! line only on an executable file, and every executable has one.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "G", "EXE"]

# Code that runs on the host's /usr/bin/python3 (3.12): the installer and updater, which must not
# depend on homelab-python3, and the deploy scripts, which need that python's apt python3-yaml.
[tool.ruff.per-file-target-version]
"stacks/deploy/deploy.py" = "py312"
"stacks/deploy/deploy_main.py" = "py312"
"ci-runner/install_host.py" = "py312"
"ci-runner/update.py" = "py312"
# Imported by the deploy scripts above.
"stacks/telemetry/telemetry.py" = "py312"
"stacks/backup/unit_metrics.py" = "py312"

[tool.pytest.ini_options]
# Each test sits beside what it tests (AGENTS.md); the host checks in host-tests/ are not pytest.
python_files = ["*_test.py"]
# pytest's default skips every dot folder, .github's action tests too; .claude holds other checkouts.
norecursedirs = [".git", ".venv", ".claude", ".mise", ".*_cache", "__pycache__", "node_modules"]
# A test imports what sits beside it by name (pytest puts its folder on the path); beyond that,
# checks/ and stacks/ as packages, the installer, the supervisor and telemetry.
pythonpath = [".", "ci-runner", "ci-runner/supervisor", "stacks/telemetry"]

# ty uses the nearest pyproject.toml that has this table; without it, a checkout inside another project takes that project's rules.
[tool.ty]

[tool.ty.environment]
# run_vm.py and stop_vms.py import vm_disks.py from their own folder; services import telemetry,
# which their containers mount into site-packages.
extra-paths = [
  "beelink/security", "beelink/ssd-wear", "ci-runner", "ci-runner/rootfs", "ci-runner/run-times",
  "ci-runner/supervisor",
  "ci-runner/host-tests", "stacks/observability/public-stats", "stacks/telemetry",
]

# Strict: no untyped value gets through, and a warning fails the check.
[tool.ty.rules]
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"

[tool.ty.terminal]
error-on-warning = true

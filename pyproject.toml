[project]
name = "homelab"
version = "0.1.0"
description = "Infrastructure-as-code and tooling for Colin's homelab"
readme = "README.md"
authors = [
    { name = "Colin Cheung", email = "11246116+ColinCee@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    # What the stacks' Python imports, at their images' versions, for the tests and type checks.
    "anthropic==2.8.0",
    "cryptography==50.0.2",
    "discord.py==2.7.1",
    "pytest>=8",
    "ruff>=0.11",
    "ty>=0.0.1",
    "yamllint>=1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

# Code that runs on the host's /usr/bin/python3 (3.12): the installer and updater, which must not
# depend on homelab-python3, and the deploy scripts, which need that python's apt python3-yaml.
[tool.ruff.per-file-target-version]
"scripts/deploy.py" = "py312"
"stacks/deploy/deploy_main.py" = "py312"
"ci-runner/install_host.py" = "py312"
"ci-runner/update.py" = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import scripts/ as a package and ci-runner/'s modules by name, whichever way pytest is started.
pythonpath = [".", "ci-runner"]

# ty uses the nearest pyproject.toml that has this table; without it, a checkout inside another project takes that project's rules.
[tool.ty]

[tool.ty.environment]
# run_vm.py and stop_vms.py import vm_disks.py from their own folder.
extra-paths = ["ci-runner"]

# Strict: no untyped value gets through, and a warning fails the check.
[tool.ty.rules]
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"

[tool.ty.terminal]
error-on-warning = true

[project]
name = "homelab"
version = "0.1.0"
description = "Infrastructure-as-code and tooling for Colin's homelab"
readme = "README.md"
authors = [
    { name = "Colin Cheung", email = "11246116+ColinCee@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.11",
    "ty>=0.0.1",
    "yamllint>=1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.per-file-target-version]
"scripts/tailscale_policy.py" = "py312"
"scripts/deploy.py" = "py312"
"scripts/render_secrets.py" = "py312"
"scripts/runner_job_guard.py" = "py312"
"scripts/ci_supervisor.py" = "py312"
"scripts/ci_times.py" = "py312"
"scripts/ci.py" = "py312"
".github/actions/fc-cache/fc_cache.py" = "py312"
"scripts/pin_only.py" = "py312"
"scripts/versions_hash.py" = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import scripts/ as a package, whichever way pytest is started.
pythonpath = ["."]

# ty uses the nearest pyproject.toml that has this table; without it, a checkout inside another project takes that project's rules.
[tool.ty]

# Kaizen's standard (standards.md, Types): no untyped value gets through, and a warning fails the check.
[tool.ty.rules]
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"

[tool.ty.terminal]
error-on-warning = true

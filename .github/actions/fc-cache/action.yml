name: Save the cache disk
description: >-
  On a push to the default branch, tars what the job left under /cache (and any
  workspace paths given) onto the VM's outbox disk, which the CI supervisor turns
  into the repo's next cache disk. Does nothing on any other event, and never
  fails the job. Use it as a homelab-fc job's last step. See docs/architecture.md, "CI runner".
inputs:
  paths:
    description: Workspace paths to add, separated by spaces or new lines (such as web/node_modules web/package-lock.json).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Save the cache disk
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        # A cache that is not saved only leaves the next jobs the last one; it must never
        # fail the check.
        # shellcheck disable=SC2086 # PATHS splits into one argument per path
        # Through bash: a script's run permission is easily lost on a Windows checkout.
        if ! { bash "$GITHUB_ACTION_PATH/pack.sh" /cache "$RUNNER_TEMP/cache.tar" $PATHS &&
          bash "$GITHUB_ACTION_PATH/save.sh" "$RUNNER_TEMP/cache.tar"; }; then
          echo "::warning::fc-cache: the cache disk was not saved; the next jobs start from the last one"
        fi
        rm -f "$RUNNER_TEMP/cache.tar"

name: Upload the cache disk
description: >-
  On a push to the default branch, tars what the job left under /cache (and any
  workspace paths given) and uploads it as homelab-fc-cache, which the CI
  supervisor turns into the repo's cache disk. Does nothing on any other event.
  Use it as a homelab-fc job's last step. See docs/runbooks/ci-runner.md.
inputs:
  paths:
    description: Workspace paths to add, separated by spaces or new lines (such as web/node_modules web/package-lock.json).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Tar the cache disk
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        # shellcheck disable=SC2086 # PATHS splits into one argument per path
        "$GITHUB_ACTION_PATH/pack.sh" /cache "$RUNNER_TEMP/cache.tar" $PATHS
    - name: Upload the cache disk
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      # The same pin as CACHED_ACTIONS in ci-runner/versions.env, so the VM has it already.
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: homelab-fc-cache
        path: ${{ runner.temp }}/cache.tar
        retention-days: 3
        compression-level: 1
        if-no-files-found: error

name: Deploy watchdog

# Runs off-host: Beelink cannot report its own outage.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy-watchdog
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for stuck deploys
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: python3 scripts/deploy_watchdog.py

      # A deploy that failed, or that the runner guard killed before its first step, cannot tell Kaizen itself.
      - id: kaizen-key
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KAIZEN_APP_ID }}
          private-key: ${{ secrets.KAIZEN_APP_KEY }}
          owner: ColinCee
          repositories: kaizen
          permission-contents: write
          permission-issues: read

      - name: Pull Kaizen's Andon after a failed deploy
        env:
          GH_TOKEN: ${{ steps.kaizen-key.outputs.token }}
          HOMELAB_TOKEN: ${{ github.token }}
        run: |
          last=$(GH_TOKEN=$HOMELAB_TOKEN gh run list -R "$GITHUB_REPOSITORY" -w deploy.yaml -b main -L 1 --json status,conclusion,url --jq '.[0]')
          [ "$(jq -r .status <<< "$last")" = completed ] && [ "$(jq -r .conclusion <<< "$last")" = failure ] || exit 0
          [ -z "$(gh issue list -R ColinCee/kaizen --label andon --state open --json number --jq '.[0].number // empty')" ] || exit 0
          jq -n --arg r "The homelab deploy failed or was blocked: $(jq -r .url <<< "$last")" \
            '{event_type: "andon-open", client_payload: {repo: "ColinCee/homelab", reason: $r}}' \
            | gh api repos/ColinCee/kaizen/dispatches --input -

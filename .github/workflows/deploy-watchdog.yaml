name: Deploy watchdog

# Runs off-host: Beelink cannot report its own outage.
on:
  schedule:
    - cron: "*/15 * * * *"
  # GitHub delays and skips schedules on quiet repos, so deploys drive it too: a finished deploy (including
  # one the runner guard killed before its first step) is checked at once, and a queued one 16 minutes
  # later, which catches a dead runner without waiting for the schedule.
  workflow_run:
    workflows: [Deploy]
    types: [requested, completed]
  workflow_dispatch:

permissions:
  # Write, to retry a failed deploy once before it stops Kaizen's line.
  actions: write
  contents: read

jobs:
  # Gives a newly queued deploy the 15 minutes the check allows before calling it stuck.
  wait:
    if: github.event.action == 'requested'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: sleep 960

  check:
    needs: wait
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    concurrency:
      group: deploy-watchdog
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for stuck deploys
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: python3 scripts/deploy_watchdog.py

      # A deploy that failed, or that the runner guard killed before its first step, cannot tell Kaizen itself.
      - id: kaizen-key
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KAIZEN_APP_ID }}
          private-key: ${{ secrets.KAIZEN_APP_KEY }}
          owner: ColinCee
          repositories: auto-kaizen
          permission-contents: write
          permission-issues: read

      # A first failure is retried; only a deploy that fails again stops the line. A setup failure (a download, a
      # rate limit) is not the stacks' fault, and a retry clears it.
      - id: pull-andon
        name: Retry a failed deploy once, then pull Kaizen's Andon
        if: steps.kaizen-key.outputs.token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.kaizen-key.outputs.token }}
          HOMELAB_TOKEN: ${{ github.token }}
        run: |
          last=$(GH_TOKEN=$HOMELAB_TOKEN gh run list -R "$GITHUB_REPOSITORY" -w deploy.yaml -b main -L 1 --json databaseId,attempt,status,conclusion,url --jq '.[0]')
          [ "$(jq -r .status <<< "$last")" = completed ] && [ "$(jq -r .conclusion <<< "$last")" = failure ] || exit 0
          if [ "$(jq -r .attempt <<< "$last")" -lt 2 ]; then
            GH_TOKEN=$HOMELAB_TOKEN gh run rerun "$(jq -r .databaseId <<< "$last")" -R "$GITHUB_REPOSITORY" --failed
            echo "first failure: retried"; exit 0
          fi
          search='"Repo: ColinCee/homelab" in:body'
          open=$(gh issue list -R ColinCee/auto-kaizen --label andon --state open --search "$search" \
            --json number --jq '.[0].number // empty')
          [ -z "$open" ] || exit 0
          jq -n --arg r "The homelab deploy failed or was blocked: $(jq -r .url <<< "$last")" \
            '{event_type: "andon-open", client_payload: {repo: "ColinCee/homelab", reason: $r}}' \
            | gh api repos/ColinCee/auto-kaizen/dispatches --input -

      # The watchdog is the backstop: if it cannot reach Auto Kaizen, Colin hears about it.
      - name: Say so if Auto Kaizen could not be told
        if: steps.kaizen-key.outcome == 'failure' || steps.pull-andon.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="Deploy watchdog could not reach Auto Kaizen, so a failed deploy may not have stopped it: $RUN_URL"
          jq -n --arg c "$msg" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"

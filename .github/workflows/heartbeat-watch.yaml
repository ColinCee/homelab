name: Heartbeat watch

# Posts to Discord when heartbeat.yaml has not passed for 2 hours (scripts/heartbeat_watch.py). On
# GitHub's machines, so it still posts when the Beelink is down.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the post instead of sending it"
        type: boolean
        default: true

concurrency:
  group: heartbeat-watch
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/heartbeat_watch.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post when the heartbeat stopped
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python3 -I scripts/heartbeat_watch.py

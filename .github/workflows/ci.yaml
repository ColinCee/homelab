name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Labelled too: the slower-ci label lets a raised time limit pass.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A pull request's newer push or label change cancels its older run, freeing a CI VM; each main push runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each run takes exactly one of the two jobs: main requires both, and a skipped job counts as passed. They are apart
# because GitHub looks up every action a job names before it starts, and the VM's job names none.
# Each step's logic is in scripts/ci.py, which says why. A rule judging a pull request comes from its base commit.
jobs:
  homelab:
    name: check (homelab)
    # Colin's own pushes and pull requests from this repo run in the homelab-fc VMs; the VMs' job guard refuses any other
    # job however it asks for them (docs/architecture.md, "CI runner"). The repo variable HOMELAB_FC turns it on (true)
    # or off, as when the VMs are down. The github job's `if` is this one's opposite: change them together.
    if: >-
      vars.HOMELAB_FC == 'true' && github.actor_id == '11246116' && github.triggering_actor == 'ColinCee'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, homelab-fc]
    steps:
      # The VM image's own checkout (ci-runner/rootfs/ci_checkout.py says why).
      - name: Check out
        run: ci-checkout

      - name: Check the pull request's rules (pin-only change, versions.env hashes, test time limits)
        id: pins
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci.py pull-request-rules

      - name: Validate Compose (image pins only)
        if: steps.pins.outputs.only == 'true'
        run: python3 scripts/ci.py validate-changed-compose

      # The VM's tools and uv's cache live on its cache disk (/cache), built from main's last green push.
      - name: Install tools from the cache disk
        if: steps.pins.outputs.only != 'true'
        env:
          # Downloads not yet on the cache disk come from GitHub, whose anonymous limit the home's address shares.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci.py vm-tools

      - name: Run checks (lint + typecheck + test + validate)
        if: steps.pins.outputs.only != 'true'
        env:
          TEST_TIMES: ${{ runner.temp }}/test-times.json
        run: mise run check

      # Its own step: a workflow command must start its line, and mise prefixes each line of its tasks.
      - name: Report the slowest tests
        if: always()
        run: python3 scripts/ci.py slowest-tests

      - name: Check whether the cache disk would change
        id: cache
        run: python3 scripts/ci.py cache-changed

      - uses: ./.github/actions/fc-cache
        if: steps.cache.outputs.changed == 'true'

  github:
    name: check (GitHub)
    # Everyone else's runs (forks, Renovate), and Colin's while the VMs are off.
    if: >-
      !(vars.HOMELAB_FC == 'true' && github.actor_id == '11246116' && github.triggering_actor == 'ColinCee'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The pull request's merge commit and its base, to diff them.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Check the pull request's rules (pin-only change, versions.env hashes, test time limits)
        id: pins
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci.py pull-request-rules

      - name: Validate Compose (image pins only)
        if: steps.pins.outputs.only == 'true'
        run: python3 scripts/ci.py validate-changed-compose

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        if: steps.pins.outputs.only != 'true'

      # Keeps the wheels uv builds from source (pyyaml has none for our Python),
      # so each run reuses them instead of compiling for ~10 seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pins.outputs.only != 'true'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.toml') }}

      - name: Run checks (lint + typecheck + test + validate)
        if: steps.pins.outputs.only != 'true'
        env:
          TEST_TIMES: ${{ runner.temp }}/test-times.json
        run: mise run check

      - name: Report the slowest tests
        if: always()
        run: python3 scripts/ci.py slowest-tests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's merge commit and its base, to diff them.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # A pull request that only moves image pins needs only Compose validation
      # of the stacks it touches; the others are unchanged since main passed.
      # The base commit's copy of the script judges it, so the pull request
      # cannot loosen its own rule.
      - name: Check for an image-pin-only change
        id: pins
        if: github.event_name == 'pull_request'
        run: |
          script="$RUNNER_TEMP/pin_only.py"
          if git show HEAD^1:scripts/pin_only.py > "$script" && python3 "$script" HEAD^1 HEAD; then
            echo "only=true" >> "$GITHUB_OUTPUT"
          fi
      # An accepted decision record changes only in its status line; the base
      # commit's copy judges, as above.
      - name: Check accepted decision records are unchanged
        if: github.event_name == 'pull_request'
        run: |
          script="$RUNNER_TEMP/adr_frozen.py"
          git show HEAD^1:scripts/adr_frozen.py > "$script" 2>/dev/null || exit 0
          python3 "$script" HEAD^1 HEAD
      # A changed release in ci-runner/versions.env is downloaded and checked
      # against its hash, so a stale hash fails here, not in the image build
      # after merge. The base commit's copy judges, as above.
      - name: Check versions.env hashes
        if: github.event_name == 'pull_request'
        run: |
          git diff --quiet HEAD^1 HEAD -- ci-runner/versions.env && exit 0
          script="$RUNNER_TEMP/versions_hash.py"
          git show HEAD^1:scripts/versions_hash.py > "$script" 2>/dev/null || exit 0
          python3 "$script" HEAD^1 HEAD
      # The CI VMs' image, and the handoff action jobs run in it, reach the hosts only
      # after merge, so a change to either builds the image here and hands files in it.
      # The pull request's copy of the test runs: a protocol change needs its test changed.
      - name: Check handoffs in the CI job image
        if: github.event_name == 'pull_request'
        timeout-minutes: 30
        run: |
          git diff --quiet HEAD^1 HEAD -- ci-runner/rootfs ci-runner/versions.env .github/actions/handoff \
            ci-runner/tests/test-handoff-image.sh && exit 0
          bash ci-runner/tests/test-handoff-image.sh
      - name: Validate Compose (image pins only)
        if: steps.pins.outputs.only == 'true'
        run: git diff --name-only -z HEAD^1 HEAD | xargs -0 scripts/validate-compose.sh
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        if: steps.pins.outputs.only != 'true'
      # Keeps the wheels uv builds from source (pyyaml has none for our Python),
      # so each run reuses them instead of compiling for ~10 seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pins.outputs.only != 'true'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.toml') }}
      - name: Run checks (lint + typecheck + test + validate)
        if: steps.pins.outputs.only != 'true'
        run: mise run check

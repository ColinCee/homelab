name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Colin's own pushes and pull requests from this repo run in the homelab-fc VMs, everyone else's (forks, Renovate)
    # on GitHub's runners. The VMs' job guard refuses any other job however it asks for them (docs/architecture.md,
    # "CI runner"). The repo variable HOMELAB_FC turns it on (true) or off, as when the VMs are down.
    runs-on: >-
      ${{ fromJSON(vars.HOMELAB_FC == 'true' && github.actor_id == '11246116' && github.triggering_actor == 'ColinCee'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      && '["self-hosted", "linux", "x64", "homelab-fc"]' || '"ubuntu-26.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's merge commit and its base, to diff them.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # A pull request that only moves image pins needs only Compose validation
      # of the stacks it touches; the others are unchanged since main passed.
      # The base commit's copy of the script judges it, so the pull request
      # cannot loosen its own rule.
      - name: Check for an image-pin-only change
        id: pins
        if: github.event_name == 'pull_request'
        run: |
          script="$RUNNER_TEMP/pin_only.py"
          if git show HEAD^1:scripts/pin_only.py > "$script" && python3 "$script" HEAD^1 HEAD; then
            echo "only=true" >> "$GITHUB_OUTPUT"
          fi
      # A changed release in ci-runner/versions.env is downloaded and checked
      # against its hash, so a stale hash fails here, not in the image build
      # after merge. The base commit's copy judges, as above.
      - name: Check versions.env hashes
        if: github.event_name == 'pull_request'
        run: |
          git diff --quiet HEAD^1 HEAD -- ci-runner/versions.env && exit 0
          script="$RUNNER_TEMP/versions_hash.py"
          git show HEAD^1:scripts/versions_hash.py > "$script" 2>/dev/null || exit 0
          python3 "$script" HEAD^1 HEAD
      - name: Validate Compose (image pins only)
        if: steps.pins.outputs.only == 'true'
        run: git diff --name-only -z HEAD^1 HEAD | xargs -0 scripts/validate-compose.sh
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        if: steps.pins.outputs.only != 'true' && runner.environment == 'github-hosted'
      # Keeps the wheels uv builds from source (pyyaml has none for our Python),
      # so each run reuses them instead of compiling for ~10 seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pins.outputs.only != 'true' && runner.environment == 'github-hosted'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.toml') }}
      # The VM's tools and uv's cache live on its cache disk (/cache), built from main's last green push.
      - name: Install tools from the cache disk
        if: steps.pins.outputs.only != 'true' && runner.environment == 'self-hosted'
        env:
          # Downloads not yet on the cache disk come from GitHub, whose anonymous limit the home's address shares.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export MISE_DATA_DIR=/cache/mise MISE_YES=1 MISE_TRUSTED_CONFIG_PATHS="$GITHUB_WORKSPACE"
          env | grep '^MISE_' >> "$GITHUB_ENV"
          mise install
      - name: Run checks (lint + typecheck + test + validate)
        if: steps.pins.outputs.only != 'true'
        env:
          TEST_TIMES: ${{ runner.temp }}/test-times.json
        run: mise run check
      # For the trace of this run (scripts/ci_times.py). Its own step: a workflow command must start its line, and
      # mise prefixes each line of its tasks.
      - name: Report the slowest tests
        if: always()
        run: |
          times="$RUNNER_TEMP/test-times.json"
          [[ -f $times ]] || exit 0
          # A workflow command's message escapes % (one line, as the JSON is).
          echo "::notice title=slowest tests::$(sed 's/%/%25/g' "$times")"
      - uses: ./.github/actions/fc-cache
        if: runner.environment == 'self-hosted'

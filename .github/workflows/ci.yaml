name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Labelled too: the slower-ci label lets a raised time limit pass.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A pull request's newer push or label change cancels its older run, freeing a CI VM; each main push runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Colin's own pushes and pull requests from this repo run in the homelab-fc VMs, everyone else's (forks, Renovate)
    # on GitHub's runners. The VMs' job guard refuses any other job however it asks for them (docs/architecture.md,
    # "CI runner"). The repo variable HOMELAB_FC turns it on (true) or off, as when the VMs are down.
    runs-on: >-
      ${{ fromJSON(vars.HOMELAB_FC == 'true' && github.actor_id == '11246116' && github.triggering_actor == 'ColinCee'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      && '["self-hosted", "linux", "x64", "homelab-fc"]' || '"ubuntu-26.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The pull request's merge commit and its base, to diff them.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # Each step's logic is in scripts/ci.py, which says why. A rule judging a pull request comes from its base commit.
      - name: Check the pull request's rules (pin-only change, versions.env hashes, test time limits)
        id: pins
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci.py pull-request-rules

      - name: Validate Compose (image pins only)
        if: steps.pins.outputs.only == 'true'
        run: python3 scripts/ci.py validate-changed-compose

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        if: steps.pins.outputs.only != 'true' && runner.environment == 'github-hosted'

      # Keeps the wheels uv builds from source (pyyaml has none for our Python),
      # so each run reuses them instead of compiling for ~10 seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pins.outputs.only != 'true' && runner.environment == 'github-hosted'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.toml') }}

      # The VM's tools and uv's cache live on its cache disk (/cache), built from main's last green push.
      - name: Install tools from the cache disk
        if: steps.pins.outputs.only != 'true' && runner.environment == 'self-hosted'
        env:
          # Downloads not yet on the cache disk come from GitHub, whose anonymous limit the home's address shares.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci.py vm-tools

      - name: Run checks (lint + typecheck + test + validate)
        if: steps.pins.outputs.only != 'true'
        env:
          TEST_TIMES: ${{ runner.temp }}/test-times.json
        run: mise run check

      - name: Profile (experiment)
        if: always()
        run: |
          set +e
          nproc; grep MHz /proc/cpuinfo | head -4; free -m | head -2; cat /proc/loadavg
          ts(){ s=$(date +%s%N); "$@" >/dev/null 2>&1; echo "$(( ($(date +%s%N)-s)/1000000 )) ms: $*"; }
          PY=/cache/venv/bin/python
          ts uv run true; ts uv run --no-sync true; ts $PY -c pass; ts $PY -c "import pytest"; ts $PY -c "import pytest, xdist"
          $PY -X importtime -c "import pytest, xdist" 2>&1 | sort -t'|' -k2 -n | tail -6
          find /cache/venv -name '*.pyc' | wc -l
          ts $PY -m pytest -q -p no:cacheprovider --collect-only tests/
          ts $PY -m pytest -q -p no:cacheprovider --collect-only tests/
          $PY -X importtime -m pytest -q -p no:cacheprovider --collect-only tests/ 2>&1 >/dev/null | awk -F'|' '/import time:/ {n=$3; gsub(/^ +/,"",n); split(n,a,"."); c[a[1]]+=$2+0} END {for (k in c) print c[k], k}' | sort -rn | head -15
          for f in tests/test_*.py; do s=$(date +%s%N); $PY -m pytest -q -p no:cacheprovider --collect-only "$f" >/dev/null 2>&1; echo "$(( ($(date +%s%N)-s)/1000000 )) $f"; done | sort -rn | head -10
          s=$(date +%s%N); $PY -m pytest -q -p no:cacheprovider -n 4 --dist loadfile --durations=15 tests/ 2>&1 | tail -22; echo "$(( ($(date +%s%N)-s)/1000000 )) ms: xdist run"
          $PY -m pytest -q -p no:cacheprovider -p no:xdist --durations=30 tests/ 2>&1 | tail -40
          for t in "ruff check scripts/ ci-runner/ stacks/ tests/ .github/actions/" "ruff format --check scripts/ ci-runner/ stacks/ tests/ .github/actions/"; do ts uv run $t; done
          ts mise run typecheck; ts mise run validate:compose; ts mise run docs:size; ts mise run lint
          ts git -c protocol.version=2 fetch --no-tags --depth=2 https://github.com/ColinCee/homelab +refs/pull/${{ github.event.pull_request.number }}/merge

      # Its own step: a workflow command must start its line, and mise prefixes each line of its tasks.
      - name: Report the slowest tests
        if: always()
        run: python3 scripts/ci.py slowest-tests

      - name: Check whether the cache disk would change
        id: cache
        if: runner.environment == 'self-hosted'
        run: python3 scripts/ci.py cache-changed

      - uses: ./.github/actions/fc-cache
        if: steps.cache.outputs.changed == 'true'

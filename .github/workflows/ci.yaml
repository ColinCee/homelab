name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's merge commit and its base, to diff them.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # A pull request that only moves image pins needs only Compose validation.
      # The base commit's copy of the script judges it, so the pull request
      # cannot loosen its own rule.
      - name: Check for an image-pin-only change
        id: pins
        if: github.event_name == 'pull_request'
        run: |
          script="$RUNNER_TEMP/pin_only.py"
          if git show HEAD^1:scripts/pin_only.py > "$script" && python3 "$script" HEAD^1 HEAD; then
            echo "only=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Compose (image pins only)
        if: steps.pins.outputs.only == 'true'
        run: scripts/validate-compose.sh
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        if: steps.pins.outputs.only != 'true'
      # Keeps the wheels uv builds from source (pyyaml has none for our Python),
      # so each run reuses them instead of compiling for ~10 seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pins.outputs.only != 'true'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.toml') }}
      - name: Run checks (lint + typecheck + test + validate)
        if: steps.pins.outputs.only != 'true'
        run: mise run check

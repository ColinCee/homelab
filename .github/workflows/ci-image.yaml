name: CI image

# The CI VMs' image reaches the Beelink only after merge, so a change to it is built here first. On GitHub's runners:
# a CI VM (2 GiB beside other jobs) cannot hold the build.
on:
  pull_request:
    branches: [main]
    paths:
      - ci-runner/rootfs/**
      - ci-runner/versions.env
      - scripts/runner_job_guard.py
      - scripts/ci.py
      - .github/workflows/ci-image.yaml

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the CI job image
        run: python3 scripts/ci.py build-image

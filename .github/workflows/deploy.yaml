name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "scripts/**"
      - ".github/workflows/deploy.yaml"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: beelink
    permissions:
      contents: read
      packages: read # Pull private GHCR images
    steps:
      # Every step runs from the server checkout, so the job makes no checkout of its own.
      - name: Select exact revision
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: |
          cd /home/colin/code/homelab
          git fetch --no-tags origin main
          git reset --hard "$DEPLOY_REF"

      - name: Render stack environments
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          DISCORD_PRIVATE_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          OPENOBSERVE_ROOT_PASSWORD: ${{ secrets.OPENOBSERVE_ROOT_PASSWORD }}
          # Readers' logins to OpenObserve's read-only gateway (stacks/observability/gateway).
          OPENOBSERVE_AGENTS_PASSWORD: ${{ secrets.OPENOBSERVE_AGENTS_PASSWORD }}
          OPENOBSERVE_STATS_PASSWORD: ${{ secrets.OPENOBSERVE_STATS_PASSWORD }}
          PUBLIC_STATS_KEY: ${{ secrets.PUBLIC_STATS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
        run: |
          cd /home/colin/code/homelab
          scripts/generate-env.sh

      # The login lives in the job's temp directory, which the runner deletes
      # after the job, so no registry credential stays on the host.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/docker"
          printf '%s' "$GHCR_TOKEN" \
            | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Only stacks changed since the last full deploy (all when shared deploy files changed);
      # the marker lives outside the checkout, which each deploy resets. This push's own stacks
      # go first, after any stack creating a network or volume they use.
      - name: Deploy changed stacks
        id: deploy
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          cd /home/colin/code/homelab
          scripts/deploy.sh --last-deployed "$HOME/.local/state/homelab/last-deployed" \
            --first-changed-since "$BEFORE"

      # Grafana gives a top-level provisioned dashboard no viewer access, and
      # provisioning cannot grant it, so each deploy of Grafana's stack lets viewers open Home.
      - name: Let viewers open Grafana's Home
        if: contains(fromJSON(steps.deploy.outputs.deployed || '[]'), 'observability')
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          pw=${GRAFANA_ADMIN_PASSWORD//\\/\\\\}
          pw=${pw//\"/\\\"}
          # This replaces all of Home's permissions; admins keep access regardless.
          # Grafana may still be starting after a recreate.
          for _ in $(seq 30); do
            if printf 'user = "admin:%s"\n' "$pw" |
              curl -sf -m 10 -K - -X POST -H "Content-Type: application/json" \
                -d '{"items":[{"role":"Viewer","permission":1}]}' \
                http://beelink.tail4f465e.ts.net:3001/api/dashboards/uid/home/permissions >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Could not grant viewers access to Grafana's Home"

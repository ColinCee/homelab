name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "scripts/**"
      - ".github/workflows/deploy.yaml"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: beelink
    permissions:
      contents: read
      packages: read # Pull private GHCR images
    steps:
      # For the intrusion alerts (scripts/security_facts.py): every deploy posts who and what.
      - name: Record the deploy
        env:
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: logger -t homelab-deploy "commit=$COMMIT actor=$ACTOR"

      # Every step runs from the server checkout, so the job makes no checkout of its own.
      - name: Select exact revision
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: |
          cd /home/colin/code/homelab
          git fetch --no-tags origin main
          git reset --hard "$DEPLOY_REF"

      - name: Render stack environments
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          DISCORD_PRIVATE_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          # Grafana's admin password and key, and the readers' logins (stacks/observability/secrets/*.example).
          OPENOBSERVE_ROOT_PASSWORD: ${{ secrets.OPENOBSERVE_ROOT_PASSWORD }}
          OPENOBSERVE_INGEST_PASSWORD: ${{ secrets.OPENOBSERVE_INGEST_PASSWORD }}
          OPENOBSERVE_AGENTS_PASSWORD: ${{ secrets.OPENOBSERVE_AGENTS_PASSWORD }}
          OPENOBSERVE_STATS_PASSWORD: ${{ secrets.OPENOBSERVE_STATS_PASSWORD }}
          PUBLIC_STATS_KEY: ${{ secrets.PUBLIC_STATS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          # The tailnet devices the intrusion rules expect, and those SSH may come from, as a|b (config.alloy).
          TAILNET_KNOWN_DEVICES: ${{ secrets.TAILNET_KNOWN_DEVICES }}
          TAILNET_SSH_DEVICES: ${{ secrets.TAILNET_SSH_DEVICES }}
        run: |
          cd /home/colin/code/homelab
          scripts/generate-env.sh

      # The login lives in the job's temp directory, which the runner deletes
      # after the job, so no registry credential stays on the host.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/docker"
          printf '%s' "$GHCR_TOKEN" \
            | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Only stacks changed since the last full deploy (all when shared deploy files changed);
      # the marker lives outside the checkout, which each deploy resets. This push's own stacks
      # go first, after any stack creating a network or volume they use.
      - name: Deploy changed stacks
        id: deploy
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          cd /home/colin/code/homelab
          scripts/deploy.sh --last-deployed "$HOME/.local/state/homelab/last-deployed" \
            --first-changed-since "$BEFORE"

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "scripts/**"
      - ".github/workflows/deploy.yaml"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: beelink
    permissions:
      contents: read
      packages: read # Pull private GHCR images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select exact revision
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: |
          cd /home/colin/code/homelab
          git fetch --no-tags origin main
          git reset --hard "$DEPLOY_REF"

      - name: Render stack environments
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          # Optional until the routine's API token is added; Grafana gets a 401 meanwhile.
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN || 'unset' }}
          DISCORD_PRIVATE_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          KAIZEN_APP_ID: ${{ vars.KAIZEN_APP_ID }}
          KAIZEN_APP_KEY: ${{ secrets.KAIZEN_APP_KEY }}
          PUBLIC_STATS_KEY: ${{ secrets.PUBLIC_STATS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
        run: |
          cd /home/colin/code/homelab
          scripts/generate-env.sh

      # The login lives in the job's temp directory, which the runner deletes
      # after the job, so no registry credential stays on the host.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/docker"
          printf '%s' "$GHCR_TOKEN" \
            | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Deploy discovered stacks
        run: |
          cd /home/colin/code/homelab
          scripts/deploy.sh

      # Kaizen's Andon: a failed deploy stops all automated work until it is fixed, and a good one restarts it.
      - id: kaizen-key
        if: always()
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KAIZEN_APP_ID }}
          private-key: ${{ secrets.KAIZEN_APP_KEY }}
          owner: ColinCee
          repositories: auto-kaizen
          permission-contents: write

      - name: Tell Kaizen
        continue-on-error: true
        if: always() && steps.kaizen-key.outputs.token
        env:
          GH_TOKEN: ${{ steps.kaizen-key.outputs.token }}
          EVENT: ${{ job.status == 'success' && 'andon-close' || 'andon-open' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason=$([ "$EVENT" = andon-close ] && echo "Deployed: $RUN_URL" || echo "The homelab deploy failed: $RUN_URL")
          jq -n --arg e "$EVENT" --arg r "$reason" '{event_type: $e, client_payload: {repo: "ColinCee/homelab", reason: $r}}' \
            | gh api repos/ColinCee/auto-kaizen/dispatches --input -

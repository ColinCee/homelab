name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "scripts/**"
      - ".github/workflows/deploy.yaml"
  # A new secret goes live without a change to deploy: the stacks reading it are deployed (deploy.py).
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: beelink
    permissions:
      contents: read
      packages: read # Pull private GHCR images
    steps:
      # For the intrusion alerts (scripts/security_facts.py): every deploy posts who and what.
      - name: Record the deploy
        env:
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: logger -t homelab-deploy "commit=$COMMIT actor=$ACTOR"

      # Every step runs from the server checkout, so the job makes no checkout of its own. This one stays plain git, not
      # scripts/ci.py: it is what brings the commit's code in.
      - name: Select exact revision
        working-directory: /home/colin/code/homelab
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: git fetch --no-tags origin main && git reset --hard "$DEPLOY_REF"

      # The one list of secret names: render-secrets writes each to secrets/<name in lower case>.
      - name: Render secrets
        env:
          AGENTS_PASSWORD: ${{ secrets.AGENTS_PASSWORD }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          DISCORD_PRIVATE_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_SECRET_KEY: ${{ secrets.GRAFANA_SECRET_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          # A long-lived token made in Home Assistant; until it exists its scrape fails, and nothing alerts on it.
          HOMEASSISTANT_METRICS_TOKEN: ${{ secrets.HOMEASSISTANT_METRICS_TOKEN || '' }}
          PUBLIC_STATS_KEY: ${{ secrets.PUBLIC_STATS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        working-directory: /home/colin/code/homelab
        run: scripts/render-secrets.sh

      - name: Log in to GHCR
        working-directory: /home/colin/code/homelab
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: /usr/local/bin/homelab-python3 scripts/ci.py ghcr-login

      # Only stacks changed since the last full deploy (all when shared deploy files changed);
      # the marker lives outside the checkout, which each deploy resets. This push's own stacks
      # go first, after any stack creating a network or volume they use.
      - name: Deploy changed stacks
        id: deploy
        env:
          BEFORE: ${{ github.event.before }}
        working-directory: /home/colin/code/homelab
        run: >-
          scripts/deploy.sh --last-deployed "$HOME/.local/state/homelab/last-deployed"
          --first-changed-since "$BEFORE"

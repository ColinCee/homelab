name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "scripts/**"
      - ".github/workflows/deploy.yaml"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: beelink
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Deploy
        env:
          DEPLOY_REF: ${{ github.sha }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DISCORD_PRIVATE_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          KNOWLEDGE_DB_PASSWORD: ${{ secrets.KNOWLEDGE_DB_PASSWORD }}
        run: |
          cd /home/colin/code/homelab
          git fetch --no-tags origin main
          git reset --hard "$DEPLOY_REF"
          stacks=()
          for file in stacks/*/compose.yaml; do
            stack="${file#stacks/}"
            stacks+=("${stack%/compose.yaml}")
          done
          scripts/generate-env.sh "${stacks[@]}"
          scripts/deploy.sh "${stacks[@]}"

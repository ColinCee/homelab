name: Heartbeat

# Passes only while alerting works; GitHub emails a failed run (docs/observability.md).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions: {}

jobs:
  heartbeat:
    runs-on: beelink
    timeout-minutes: 5
    steps:
      - name: Check alerting
        # With pipefail, so a failed query fails the check instead of reading as empty.
        shell: bash
        env:
          # The read-only gateway (stacks/observability/gateway), with the agents' login.
          GATEWAY: http://100.100.146.119:5081
          PASSWORD: ${{ secrets.OPENOBSERVE_AGENTS_PASSWORD }}
        run: |
          pw=${PASSWORD//\\/\\\\}
          pw=${pw//\"/\\\"}
          get() { printf 'user = "agents@homelab.internal:%s"\n' "$pw" | curl -sSf -m 20 -K - -G "$GATEWAY$1" "${@:2}"; }
          value() { get /prometheus/api/v1/query --data-urlencode "query=$1" | jq -r '.data.result[0].value[1] // "none"'; }

          rules=$(get /prometheus/api/v1/rules)
          stale=$(jq -r --argjson now "$(date +%s)" '.data.groups[].rules[]
            | select(.health != "ok" or ((.lastEvaluation | sub("\\.[0-9]+"; "") | fromdateiso8601) < $now - 300))
            | "\(.name): \(.lastError // .health)"' <<< "$rules")
          count=$(jq '[.data.groups[].rules[]] | length' <<< "$rules")
          up=$(value 'max(up{job="alertmanager"})')
          failed=$(value 'sum(increase(alertmanager_notifications_failed_total{integration="discord"}[1h])) or vector(0)')
          echo "Rules: $count; Alertmanager up: $up; failed Discord posts in the last hour: $failed"

          ok=true
          [[ "$count" -gt 0 ]] || { echo "::error::Prometheus lists no rules"; ok=false; }
          [[ -z "$stale" ]] || { echo "::error::Rules that did not run cleanly in 5 minutes:"; echo "$stale"; ok=false; }
          [[ "$up" == "1" ]] || { echo "::error::Alertmanager is not up"; ok=false; }
          awk -v f="$failed" 'BEGIN { exit !(f == "none" || f < 0.5) }' || { echo "::error::Posts to Discord failed"; ok=false; }
          $ok

name: Server health

# Weekly health report from Beelink in the job summary, read by the Monday
# gardening routine. On the first Monday of the month it also prunes unused
# Docker images and build cache and test-restores a file from backup.
on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      maintenance:
        description: "Also prune unused images and run a restore test"
        type: boolean
        default: false
      backup_now:
        description: "Run a backup before reporting"
        type: boolean
        default: false
      test_alert:
        description: "Send a test alert to the Claude triage routine"
        type: boolean
        default: false
      network:
        description: "Also print the firewall, listening ports and service states"
        type: boolean
        default: false
      unban_tailnet:
        description: "Lift CrowdSec bans on Colin's own tailnet and LAN addresses"
        type: boolean
        default: false

# Own group: sharing "deploy" would let a queued health run cancel a pending
# deploy. Pruning only removes images older than a week, so it is safe
# alongside a deploy.
concurrency:
  group: server-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: beelink
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Back up now
        if: inputs.backup_now
        # Same as the runbook: output goes to the container log, where the
        # report below reads it. Success also clears Backup Missed.
        run: docker exec backup sh -c '/bin/sh /backup.sh once >/proc/1/fd/1 2>&1' || true

      - name: Send test alert to Claude
        if: inputs.test_alert
        env:
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        # Same endpoint and payload shape as Grafana's claude-triage receiver.
        # Secrets reach curl as a config on stdin, never as arguments visible in ps.
        run: |
          pw=${GRAFANA_ADMIN_PASSWORD//\\/\\\\}
          pw=${pw//\"/\\\"}
          printf 'user = "admin:%s"\n' "$pw" |
            curl -sf -K - http://100.100.146.119:3001/api/v1/provisioning/contact-points |
            jq -r '.[] | select(.uid == "claude-triage") | "Grafana receiver: \(.name) / \(.type)"' ||
            echo "Grafana receiver: could not read (admin login failed?)"
          # Print the response body too: HTTP 200 alone didn't prove a wake landed.
          printf 'header = "Authorization: Bearer %s"\n' "$CLAUDE_ROUTINE_TOKEN" |
            curl -sS -K - -w '\nRoutine fire: HTTP %{http_code}\n' -X POST \
            https://api.anthropic.com/v1/claude_code/routines/trig_0177p7ADgjATF9pSBqk74wQ1/fire \
            -H "anthropic-version: 2023-06-01" -H "Content-Type: application/json" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -d '{"text": "Test — Server health test_alert. Delivery check only; no resource alert fired."}'

      # For when Beelink is up but nothing can reach it. The repo is public, so this
      # prints only rules, ports and service states: no addresses, names or log lines.
      - name: Network state
        if: inputs.network
        run: |
          docker run --rm --net=host --pid=host --privileged -v /:/host ubuntu:24.04 chroot /host sh -c '
            echo "== ufw"; ufw status verbose 2>&1 | head -40
            echo "== iptables INPUT"; iptables -S INPUT 2>&1 | head -30
            echo "== nft tables"; nft list tables 2>&1
            echo "== listening"; ss -ltn 2>&1 | grep -E ":(22|8090|80|443)"
            echo "== interfaces (no addresses)"; ip -br link | sed "s/[0-9a-f:]\{17\}//g"
            echo "== tailscale"; tailscale status --json 2>&1 | grep -m1 BackendState
            echo "== services"; for u in tailscaled ufw docker ssh; do echo "$u $(systemctl is-active $u)"; done
            echo "== conntrack"; cat /proc/sys/net/netfilter/nf_conntrack_count /proc/sys/net/netfilter/nf_conntrack_max 2>&1
            echo "== kernel"; echo "ufw blocks: $(dmesg | grep -c "UFW BLOCK")"
            dmesg -T | grep -iE "out of memory|oom-kill|link is down|table full" | sed "s/[0-9a-f:]\{17\}//g" | tail -5
          '

      # CrowdSec's own allow list covers LAN ranges but not the tailnet's 100.64.0.0/10, so it can ban Colin's
      # devices. Only private addresses are shown (the log is public), with the scenario that banned them.
      - name: CrowdSec bans on our own addresses
        if: inputs.network || inputs.unban_tailnet
        run: |
          export OURS='^Ip:(100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|192\.168\.|10\.)'
          docker exec crowdsec cscli decisions list -o raw 2>&1 \
            | awk -F, 'NR == 1 || $3 ~ ENVIRON["OURS"] {print $2","$3","$4","$5","$9}' | head -20
          echo "bans in all: $(docker exec crowdsec cscli decisions list -o raw 2>/dev/null | tail -n +2 | wc -l)"

      - name: Lift bans on our own addresses
        if: inputs.unban_tailnet
        run: |
          docker exec crowdsec cscli decisions delete --range 100.64.0.0/10
          docker exec crowdsec cscli decisions delete --range 192.168.0.0/16

      - name: Report health
        env:
          EVENT: ${{ github.event_name }}
          MAINTENANCE: ${{ inputs.maintenance }}
        run: |
          if [[ "$MAINTENANCE" == "true" ]] || { [[ "$EVENT" == "schedule" ]] && (( 10#$(date -u +%d) <= 7 )); }; then
            scripts/server-health.sh --maintenance
          else
            scripts/server-health.sh
          fi

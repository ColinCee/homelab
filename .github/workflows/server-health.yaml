name: Server health

# Weekly health report from Beelink in the job summary, read by the Monday
# gardening routine. On the first Monday of the month it also prunes unused
# Docker images and build cache and test-restores a file from backup.
on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      maintenance:
        description: "Also prune unused images and run a restore test"
        type: boolean
        default: false
      backup_now:
        description: "Run a backup before reporting"
        type: boolean
        default: false
      test_alert:
        description: "Send a test alert to Auto Kaizen's responder"
        type: boolean
        default: false

# Own group: sharing "deploy" would let a queued health run cancel a pending
# deploy. Pruning only removes images older than a week, so it is safe
# alongside a deploy.
concurrency:
  group: server-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: beelink
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Back up now
        if: inputs.backup_now
        # Same as the runbook: output goes to the container log, where the
        # report below reads it. Success also clears Nightly backup didn't run.
        run: docker exec backup sh -c '/bin/sh /backup.sh once >/proc/1/fd/1 2>&1' || true

      - name: Send test alert to Kaizen
        if: inputs.test_alert
        env:
          KAIZEN_ALERT_SECRET: ${{ secrets.KAIZEN_ALERT_SECRET }}
          KEY: test-${{ github.run_id }}
        # The same route and body as OpenObserve's alerts (stacks/observability/openobserve/apply.py,
        # template_body): it opens an `alert` issue in Auto Kaizen, whose responder answers "test".
        # The secret reaches curl as a config on stdin, never as an argument.
        run: |
          send() {
            body=$(jq -n --arg s "$1" --arg k "$KEY" \
              '{source: "openobserve", status: $s, title: "Test alert", labels: {key: $k}, route: "kaizen",
                text: "Server health test_alert: a delivery check, nothing is wrong.", post: {name: "Test alert"}, extra: "{}"}')
            printf 'header = "Authorization: Bearer %s"\n' "$KAIZEN_ALERT_SECRET" |
              curl -sS -K - -o /dev/null -w "Kaizen alert ($1): HTTP %{http_code}\n" -X POST http://100.100.146.119:8090/alert/openobserve \
              -H "Content-Type: application/json" --data-binary "$body"
          }
          send firing
          # Long enough for the responder to read the issue before it clears.
          sleep 180
          send resolved

      - name: Report health
        env:
          EVENT: ${{ github.event_name }}
          MAINTENANCE: ${{ inputs.maintenance }}
          # Firing alerts and metrics through OpenObserve's read-only gateway, with the agents' login.
          OPENOBSERVE_URL: http://100.100.146.119:5081
          OPENOBSERVE_LOGIN: agents@homelab.internal:${{ secrets.OPENOBSERVE_AGENTS_PASSWORD }}
        run: |
          if [[ "$MAINTENANCE" == "true" ]] || { [[ "$EVENT" == "schedule" ]] && (( 10#$(date -u +%d) <= 7 )); }; then
            scripts/server-health.sh --maintenance
          else
            scripts/server-health.sh
          fi

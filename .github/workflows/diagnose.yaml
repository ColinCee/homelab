name: Diagnose network

# For when Beelink is up (deploys still run) but nothing can reach it: prints the
# firewall, listening ports, interfaces and recent logs, changing nothing. The
# runner reaches the host's view through Docker, which it already uses to deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: beelink
    timeout-minutes: 5
    steps:
      - name: Host network state
        run: |
          docker run --rm --net=host --pid=host --privileged -v /:/host ubuntu:24.04 chroot /host sh -c '
            echo "== ufw"; ufw status verbose 2>&1 | head -40
            echo "== iptables INPUT"; iptables -S INPUT 2>&1 | head -30
            echo "== nft tables"; nft list tables 2>&1
            echo "== listening"; ss -ltnp 2>&1 | grep -E ":(22|8090|80|443)\b"
            echo "== interfaces"; ip -br addr
            echo "== tailscale"; tailscale status 2>&1 | head -5
            echo "== conntrack"; cat /proc/sys/net/netfilter/nf_conntrack_count /proc/sys/net/netfilter/nf_conntrack_max 2>&1
            echo "== dmesg"; dmesg -T 2>&1 | tail -30
            echo "== journal"; journalctl -u tailscaled -u ufw -u docker -u ssh --since "-3h" --no-pager 2>&1 | tail -40
          '
